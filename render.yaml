services:
  - type: web
    name: neo-collective-cloud
    runtime: docker
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NEO_MAX_AGENTS
        value: "4"
      - key: NEO_TIMEOUT
        value: "25"
      - key: NEO_SELF_MANAGMENT
        value: "true"
      - key: NEO_AUTOPILOT_INTERVAL_SECONDS
        value: "300"
