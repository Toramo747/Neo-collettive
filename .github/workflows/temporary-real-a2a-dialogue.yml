name: Temporary real A2A dialogue
on:
  push:
    branches: ["feat/relay-isolated-pilot"]
permissions:
  contents: read
jobs:
  dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Three-round bounded dialogue with AgentMesh
        run: |
          set -euo pipefail
          CARD="https://app.agentmesh.link/.well-known/agent-card.json"
          curl --fail --silent --show-error --max-time 20 "$CARD" -o /tmp/card.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/card.json'))
          print('agent_name='+str(d.get('name')))
          print('protocol_version='+str(d.get('protocolVersion')))
          interfaces=d.get('supportedInterfaces') or []
          endpoint=(interfaces[0].get('url') if interfaces and isinstance(interfaces[0],dict) else None) or d.get('url')
          if endpoint != 'https://app.agentmesh.link/a2a':
              raise SystemExit('unexpected endpoint: '+str(endpoint))
          open('/tmp/endpoint','w').write(endpoint)
          PY
          endpoint="$(cat /tmp/endpoint)"
          python - <<'PY'
          import json
          prompts=[
            "Hello from MYCELIX. This is a bounded capability interview only. Describe your role or identity, concrete capabilities, the A2A protocol/interface you support, one public documentation reference if available, and one important limitation. Do not execute tools, contact third parties, spend money, or take external actions.",
            "Round 2/3 — methodology. How do you distinguish retrieved/stored memory from learned policy or skill adaptation and from actual parameter updates? Give one falsifiable black-box experiment with a reset/control condition. Do not perform the experiment; only describe it.",
            "Round 3/3 — transport. MYCELIX now has a persistent HTTPS relay where a peer can retain a bearer capability, poll for messages, ACK them, and reply asynchronously. Could your agent operate as a polling client for such a custom relay? State yes/no, the protocol constraints, and whether you require standard A2A tasks/get instead."
          ]
          json.dump(prompts,open('/tmp/prompts.json','w'))
          PY
          context=""
          for round in 1 2 3; do
            ROUND="$round" CONTEXT="$context" GITHUB_RUN_ID="$GITHUB_RUN_ID" python - <<'PY'
          import json,os
          prompts=json.load(open('/tmp/prompts.json'))
          r=int(os.environ['ROUND'])
          msg={
            "kind":"message",
            "messageId":"mycelix-real-"+os.environ.get('GITHUB_RUN_ID','run')+"-"+str(r),
            "role":"user",
            "parts":[{"kind":"text","text":prompts[r-1]}],
          }
          ctx=os.environ.get('CONTEXT','')
          if ctx:
              msg["contextId"]=ctx
          payload={"jsonrpc":"2.0","id":"round-"+str(r),"method":"message/send","params":{"message":msg}}
          json.dump(payload,open('/tmp/request.json','w'))
          PY
            code=$(curl --silent --show-error --max-time 45 -o "/tmp/resp-$round.json" -w "%{http_code}" \
              -X POST "$endpoint" -H "content-type: application/json" --data-binary @/tmp/request.json || true)
            printf 'round_%s_http=%s\n' "$round" "$code"
            test "$code" = "200"
            ROUND="$round" python - <<'PY'
          import json,os
          r=int(os.environ['ROUND'])
          d=json.load(open('/tmp/resp-'+str(r)+'.json'))
          if d.get('error'):
              raise SystemExit('A2A error: '+json.dumps(d['error']))
          result=d.get('result') or {}
          context=result.get('contextId') or ''
          texts=[]
          def collect(obj):
              if isinstance(obj,dict):
                  if isinstance(obj.get('text'),str): texts.append(obj['text'])
                  for v in obj.values(): collect(v)
              elif isinstance(obj,list):
                  for v in obj: collect(v)
          collect(result)
          text='\n'.join(dict.fromkeys(x.strip() for x in texts if x.strip()))
          print('ROUND_'+str(r)+'_CONTEXT='+context)
          print('--- ROUND '+str(r)+' RESPONSE ---')
          print(text[:5000] if text else json.dumps(result,ensure_ascii=False)[:5000])
          print('--- END ROUND '+str(r)+' ---')
          open('/tmp/context','w').write(context)
          PY
            context="$(cat /tmp/context)"
          done
