name: Bootstrap private Oxibay core

on:
  push:
    branches:
      - bootstrap/private-core-split
    paths:
      - ".github/workflows/bootstrap-private-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.MODEL_LABEL_REPO_TOKEN }}
      TARGET_REPO: Toramo747/Oxibay-core
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require bootstrap token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "MODEL_LABEL_REPO_TOKEN missing"; exit 1; }

      - name: Create private core repository if missing
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$TARGET_REPO" >/tmp/target.json 2>/dev/null; then
            visibility="$(python -c 'import json; print(json.load(open("/tmp/target.json"))["visibility"])')"
            test "$visibility" = "private" || { echo "Target exists but is not private"; exit 1; }
          else
            gh api user/repos               -f name='Oxibay-core'               -F private=true               -f description='Private core runtime and research engine for Oxibay/MYCELIX'               -F has_issues=true               -F has_projects=false               -F has_wiki=false               >/tmp/target.json
          fi

      - name: Mirror source into private core
        shell: bash
        run: |
          set -euo pipefail
          git remote add private-core "https://Toramo747:${GH_TOKEN}@github.com/${TARGET_REPO}.git"
          git push --mirror private-core

      - name: Ensure private main branch
        shell: bash
        run: |
          set -euo pipefail
          git push private-core refs/remotes/origin/main:refs/heads/main

      - name: Verify target is private and main exists
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$TARGET_REPO" > /tmp/verify.json
          python -c 'import json; d=json.load(open("/tmp/verify.json")); assert d.get("visibility")=="private" and d.get("private") is True, "private target verification failed"; print({"repository":d.get("full_name"),"visibility":d.get("visibility"),"default_branch":d.get("default_branch")})'
          src="$(git rev-parse refs/remotes/origin/main)"
          dst="$(git ls-remote private-core refs/heads/main | awk '{print $1}')"
          test -n "$dst" || { echo "private main missing"; exit 1; }
          test "$src" = "$dst" || { echo "private main SHA mismatch"; exit 1; }
          echo "private_main_sha=$dst"
