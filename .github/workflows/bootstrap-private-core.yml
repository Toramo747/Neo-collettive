name: Bootstrap private Oxibay core

on:
  push:
    branches:
      - bootstrap/private-core-split
    paths:
      - ".github/workflows/bootstrap-private-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.MODEL_LABEL_REPO_TOKEN }}
      SOURCE_REPO: Toramo747/Neo-collettive
      TARGET_REPO: Toramo747/Oxibay-core
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require bootstrap token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "MODEL_LABEL_REPO_TOKEN missing"; exit 1; }

      - name: Create private core repository if missing
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$TARGET_REPO" >/tmp/target.json 2>/dev/null; then
            visibility="$(python - <<'PY'
import json
print(json.load(open("/tmp/target.json"))["visibility"])
PY
)"
            test "$visibility" = "private" || { echo "Target exists but is not private"; exit 1; }
          else
            gh api user/repos               -f name='Oxibay-core'               -f private=true               -f description='Private core runtime and research engine for Oxibay/MYCELIX'               -f has_issues=true               -f has_projects=false               -f has_wiki=false               >/tmp/target.json
          fi

      - name: Mirror source into private core
        shell: bash
        run: |
          set -euo pipefail
          git remote add private-core "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git"
          git push --mirror private-core

      - name: Verify target is private and main exists
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$TARGET_REPO" > /tmp/verify.json
          python - <<'PY'
import json
d=json.load(open("/tmp/verify.json"))
if d.get("visibility") != "private" or d.get("private") is not True:
    raise SystemExit("private target verification failed")
if d.get("default_branch") != "main":
    raise SystemExit("private target default branch is not main")
print({
    "repository": d.get("full_name"),
    "visibility": d.get("visibility"),
    "default_branch": d.get("default_branch"),
})
PY
