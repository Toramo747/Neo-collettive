name: MCP Liveness Tool Opportunity

on:
  push:
    branches: [main]
    paths:
      - "mcp_liveness_thesis.py"
      - "tool_opportunity.py"
      - "test_tool_opportunity.py"
      - ".github/workflows/mcp-liveness-tool-opportunity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Test commercial gate unchanged
        run: python -m unittest -v test_tool_opportunity.py
      - name: Evaluate MCP liveness thesis
        run: python mcp_liveness_thesis.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-liveness-tool-opportunity
          path: runtime/mcp-liveness-tool-opportunity.json
          if-no-files-found: error
