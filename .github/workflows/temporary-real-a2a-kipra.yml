name: Temporary real A2A dialogue Kipra
on:
  push:
    branches: ["feat/relay-isolated-pilot"]
permissions:
  contents: read
jobs:
  dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Three-round bounded dialogue with Kipra A2A
        run: |
          set -euo pipefail
          endpoint="https://mcp.kiprarent.com/a2a"
          python - <<'PY'
          import json
          prompts=[
            "Hello from MYCELIX. This is a bounded capability interview only. Describe your role, concrete capabilities, the A2A interface you support, one public documentation reference if available, and one important limitation. Do not make bookings, purchases, contact third parties, or take external actions.",
            "Round 2/3 — reliability. Explain how you distinguish live source data from cached or inferred data, and name one failure condition where you should refuse or ask for clarification rather than guess. Do not execute any rental search.",
            "Round 3/3 — transport. MYCELIX has a persistent HTTPS relay where a peer retains a bearer capability, polls for messages, ACKs them, and replies asynchronously. Could your runtime act as a client of such a custom polling relay? Answer yes/no, list protocol constraints, and say whether you require standard A2A GetTask instead."
          ]
          json.dump(prompts,open('/tmp/prompts.json','w'))
          PY
          context=""
          for round in 1 2 3; do
            ROUND="$round" CONTEXT="$context" GITHUB_RUN_ID="$GITHUB_RUN_ID" python - <<'PY'
          import json,os
          prompts=json.load(open('/tmp/prompts.json'))
          r=int(os.environ['ROUND'])
          msg={
            "messageId":"mycelix-kipra-"+os.environ.get('GITHUB_RUN_ID','run')+"-"+str(r),
            "role":"ROLE_USER",
            "parts":[{"text":prompts[r-1]}],
          }
          ctx=os.environ.get('CONTEXT','')
          if ctx:
              msg["contextId"]=ctx
          payload={"jsonrpc":"2.0","id":"round-"+str(r),"method":"SendMessage","params":{"message":msg}}
          json.dump(payload,open('/tmp/request.json','w'))
          PY
            code=$(curl --silent --show-error --max-time 45 -o "/tmp/resp-$round.json" -w "%{http_code}" \
              -X POST "$endpoint" -H "content-type: application/json" --data-binary @/tmp/request.json || true)
            printf 'round_%s_http=%s\n' "$round" "$code"
            test "$code" = "200"
            ROUND="$round" python - <<'PY'
          import json,os
          r=int(os.environ['ROUND'])
          d=json.load(open('/tmp/resp-'+str(r)+'.json'))
          if d.get('error'):
              raise SystemExit('A2A error: '+json.dumps(d['error']))
          result=d.get('result') or {}
          # A2A 1.0 may wrap either {"message":...} or {"task":...}
          payload=result.get('message') or result.get('task') or result
          context=payload.get('contextId') or result.get('contextId') or ''
          texts=[]
          def collect(obj):
              if isinstance(obj,dict):
                  if isinstance(obj.get('text'),str): texts.append(obj['text'])
                  for v in obj.values(): collect(v)
              elif isinstance(obj,list):
                  for v in obj: collect(v)
          collect(result)
          text='\n'.join(dict.fromkeys(x.strip() for x in texts if x.strip()))
          print('ROUND_'+str(r)+'_CONTEXT='+context)
          print('--- ROUND '+str(r)+' RESPONSE ---')
          print(text[:5000] if text else json.dumps(result,ensure_ascii=False)[:5000])
          print('--- END ROUND '+str(r)+' ---')
          open('/tmp/context','w').write(context)
          PY
            context="$(cat /tmp/context)"
          done
