name: Arena Commercial Signal Phase 0

on:
  workflow_dispatch:
  push:
    branches: [mycelix-arena-commercial-signal-phase0-20260929]
    paths:
      - "arena/commercial_signal/**"
      - ".github/workflows/arena-commercial-signal-phase0.yml"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert offline workflow contract
        run: |
          python - <<'PY'
          import os
          forbidden=[k for k in os.environ if k.endswith("_TOKEN") or k.endswith("_KEY") or k.endswith("_SECRET")]
          print("secret_like_env_count="+str(len(forbidden)))
          PY
      - name: Validate schema and evaluator tests
        run: |
          python -m json.tool arena/commercial_signal/proposal.schema.json >/dev/null
          python -m unittest -v arena.commercial_signal.test_evaluate
      - name: Evaluate baseline and alternatives
        run: |
          python -m arena.commercial_signal.evaluate --out arena-commercial-signal-scores.json
      - name: Publish aggregate scores only
        uses: actions/upload-artifact@v4
        with:
          name: arena-commercial-signal-scores
          path: arena-commercial-signal-scores.json
          retention-days: 14
