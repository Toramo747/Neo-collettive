name: Full Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python - <<'PY'
          import httpx
          import jsonschema
          print("httpx", httpx.__version__)
          print("jsonschema", jsonschema.__version__)
          PY
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Privacy and self-traffic guards
        run: |
          python -m unittest -v             test_public_snapshot_privacy             test_inbound_traffic             test_self_traffic_hmac_port

      - name: Full unittest suite
        run: python -m unittest discover -v
