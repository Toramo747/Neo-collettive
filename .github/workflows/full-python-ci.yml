name: Full Python CI

on:
  push:
    branches: [main, mycelix-public-snapshot-allowlist-20260929]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install PyYAML==6.0.3
          python - <<'PY'
          import httpx
          import jsonschema
          print("httpx", httpx.__version__)
          print("jsonschema", jsonschema.__version__)
          PY
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Privacy and self-traffic guards
        run: |
          python -m unittest -v \
            test_public_snapshot_privacy \
            test_inbound_traffic \
            test_self_traffic_hmac_port

      - name: Full unittest suite
        run: python -m unittest discover -v

      - name: Measure health probe handler latency
        run: |
          python - <<'PY'
          import asyncio,json,time
          from unittest.mock import patch
          import cloud_mcp
          from test_inbound_e2e import asgi_request

          async def main():
              rows=[]
              for path in ("/livez","/readyz","/health"):
                  patches=[
                      patch.object(cloud_mcp.endpoint_verifier,"consume_rate_limit",return_value=None),
                  ]
                  if path=="/health":
                      patches.append(patch.object(cloud_mcp,"_record_inbound_traffic",return_value=None))
                  for p in patches: p.start()
                  try:
                      start=time.perf_counter()
                      status,_=await asgi_request(cloud_mcp.app,path,"GET")
                      elapsed=(time.perf_counter()-start)*1000.0
                  finally:
                      for p in reversed(patches): p.stop()
                  rows.append({"path":path,"status":status,"latency_ms":round(elapsed,3)})
              print(json.dumps(rows,separators=(",",":")))
              if any(r["status"]!=200 for r in rows):
                  raise SystemExit(1)
          asyncio.run(main())
          PY
