name: MYCELIX Heartbeat Watchdog v2

on:
  schedule:
    - cron: "9,19,29,39,49,59 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mycelix-heartbeat-watchdog-v2.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: mycelix-heartbeat-watchdog
  cancel-in-progress: false

jobs:
  ensure-heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check MYCELIX freshness
        env:
          STATUS_URL: https://neo-collettive.onrender.com/api/checkpoint-status
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 2 --retry-delay 5 --max-time 45 "$STATUS_URL" > /tmp/status.json

          python - <<'PY'
          import json
          from datetime import datetime, timezone

          d=json.load(open("/tmp/status.json",encoding="utf-8"))
          ap={}
          last=d.get("last_checkpoint_utc")
          runtime_stale=True
          runtime_age_minutes=None

          if last:
              try:
                  dt=datetime.fromisoformat(str(last).replace("Z","+00:00"))
                  runtime_age_minutes=(datetime.now(timezone.utc)-dt.astimezone(timezone.utc)).total_seconds()/60
                  runtime_stale=runtime_age_minutes>20
              except Exception:
                  runtime_stale=True

          with open("/tmp/runtime_stale","w",encoding="utf-8") as f:
              f.write("1" if runtime_stale else "0")

          print({
              "checkpoint_ok": d.get("ok"),
              "last_finished_utc": last,
              "runtime_age_minutes": None if runtime_age_minutes is None else round(runtime_age_minutes,1),
              "stored_bytes": d.get("stored_bytes"),
              "limit_bytes": d.get("limit_bytes"),
              "runtime_stale": runtime_stale,
          })
          PY

      - name: Capture public runtime health
        continue-on-error: true
        run: |
          set +e
          curl --silent --show-error --max-time 45 \
            "https://neo-collettive.onrender.com/health" \
            -o /tmp/runtime-health.json
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "Runtime health unavailable (curl rc=$rc)"
            exit 0
          fi
          python - <<'PY'
          import json
          d=json.load(open("/tmp/runtime-health.json",encoding="utf-8"))
          print({
              "status": d.get("status"),
              "version": d.get("version"),
              "commit": d.get("commit"),
              "runtime_snapshot": d.get("runtime_snapshot"),
          })
          PY

      - name: Check published snapshot freshness
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          snapshot_stale=1
          if curl --fail --show-error --silent --max-time 30 \
            -H "Accept: application/vnd.github.raw+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/contents/neo_latest_result.json?ref=main" > /tmp/snapshot.json; then
            SNAPSHOT=/tmp/snapshot.json python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          try:
              d=json.load(open(os.environ["SNAPSHOT"],encoding="utf-8"))
              captured=d.get("captured_at_utc")
              age=None
              stale=True
              if captured:
                  dt=datetime.fromisoformat(str(captured).replace("Z","+00:00"))
                  age=(datetime.now(timezone.utc)-dt.astimezone(timezone.utc)).total_seconds()/60
                  stale=age>20
              open("/tmp/snapshot_stale","w").write("1" if stale else "0")
              print({"snapshot_captured_at_utc":captured,"snapshot_age_minutes":None if age is None else round(age,1),"snapshot_stale":stale})
          except Exception as exc:
              open("/tmp/snapshot_stale","w").write("1")
              print({"snapshot_stale":True,"snapshot_error":type(exc).__name__+": "+str(exc)[:200]})
          PY
          else
            echo "1" > /tmp/snapshot_stale
            echo "Could not read published snapshot; forcing heartbeat dispatch."
          fi

      - name: Dispatch primary heartbeat if runtime or snapshot is stale
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          runtime_stale="$(cat /tmp/runtime_stale)"
          snapshot_stale="$(cat /tmp/snapshot_stale)"
          if [ "$runtime_stale" != "1" ] && [ "$snapshot_stale" != "1" ]; then
            echo "Runtime and published snapshot are fresh; no dispatch needed."
            exit 0
          fi

          # Do not cancel a primary run that can still finish normally.
          curl --fail --show-error --silent --max-time 30 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/mycelix-heartbeat-v3.yml/runs?branch=main&per_page=20" > /tmp/primary-runs.json
          python - <<'PYRUN'
          import json
          from datetime import datetime, timezone
          runs=json.load(open("/tmp/primary-runs.json",encoding="utf-8"))["workflow_runs"]
          now=datetime.now(timezone.utc)
          active=[]
          for run in runs:
              if run.get("status") not in {"queued","in_progress","waiting","pending","requested"}:
                  continue
              ts=datetime.fromisoformat(str(run.get("run_started_at") or run["created_at"]).replace("Z","+00:00"))
              if 0 <= (now-ts).total_seconds() <= 20*60:
                  active.append(run["id"])
          open("/tmp/primary-active","w").write("1" if active else "0")
          print({"primary_active_count":len(active),"dispatch_deferred":bool(active)})
          PYRUN
          if [ "$(cat /tmp/primary-active)" = "1" ]; then
            echo "Primary heartbeat is active; allowing its publication to finish."
            exit 0
          fi

          curl --fail --show-error --silent \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/mycelix-heartbeat-v3.yml/dispatches" \
            -d '{"ref":"main"}'

          echo "Canonical MYCELIX heartbeat v3 dispatched. runtime_stale=$runtime_stale snapshot_stale=$snapshot_stale"

      - name: Fail if runtime snapshot is older than 90 minutes
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          try:
              d=json.load(open("/tmp/snapshot.json",encoding="utf-8"))
          except Exception as exc:
              raise SystemExit(f"runtime snapshot freshness check failed: published snapshot unavailable: {type(exc).__name__}")
          last=d.get("captured_at_utc")
          if not last:
              raise SystemExit("runtime snapshot publication cannot be verified: captured_at_utc is missing")
          try:
              dt=datetime.fromisoformat(str(last).replace("Z","+00:00"))
              if dt.tzinfo is None:
                  raise ValueError("timezone required")
              age=(datetime.now(timezone.utc)-dt.astimezone(timezone.utc)).total_seconds()/60
          except Exception:
              raise SystemExit("runtime snapshot publication cannot be verified: invalid captured_at_utc")
          if age < 0:
              raise SystemExit("runtime snapshot publication cannot be verified: timestamp is in the future")
          if age>90:
              raise SystemExit(f"no runtime snapshot published for more than 90 minutes: age_minutes={age:.1f}; recovery dispatch attempted or deferred to active heartbeat")
          print({"published_snapshot_utc":last,"published_snapshot_age_minutes":round(age,1),"published_snapshot_within_90m":True})
          PY
