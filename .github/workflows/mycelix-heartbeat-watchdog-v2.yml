name: MYCELIX Heartbeat Watchdog v2

on:
  schedule:
    - cron: "3,23,43 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mycelix-heartbeat-watchdog-v2.yml"

permissions:
  actions: write
  contents: read

jobs:
  ensure-heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check MYCELIX freshness
        env:
          STATUS_URL: https://neo-collettive.onrender.com/api/autopilot/status
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 2 --retry-delay 5 --max-time 45 "$STATUS_URL" > /tmp/status.json

          python - <<'PY'
          import json
          from datetime import datetime, timezone

          d=json.load(open("/tmp/status.json",encoding="utf-8"))
          ap=d.get("autopilot") or {}
          last=ap.get("last_finished_utc")
          runtime_stale=True
          runtime_age_minutes=None

          if last:
              try:
                  dt=datetime.fromisoformat(str(last).replace("Z","+00:00"))
                  runtime_age_minutes=(datetime.now(timezone.utc)-dt.astimezone(timezone.utc)).total_seconds()/60
                  runtime_stale=runtime_age_minutes>20
              except Exception:
                  runtime_stale=True

          with open("/tmp/runtime_stale","w",encoding="utf-8") as f:
              f.write("1" if runtime_stale else "0")

          print({
              "neo_version": d.get("neo_version"),
              "last_finished_utc": last,
              "runtime_age_minutes": None if runtime_age_minutes is None else round(runtime_age_minutes,1),
              "running": ap.get("running"),
              "last_error": ap.get("last_error"),
              "runtime_stale": runtime_stale,
              "cycles_completed": ap.get("cycles_completed"),
          })
          PY

      - name: Capture NEO Render diagnostics
        continue-on-error: true
        run: |
          set +e
          curl --silent --show-error --max-time 45 \
            "https://neo-collettive.onrender.com/api/render/diagnostics?target=neo" \
            -o /tmp/render-diagnostics.json
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "Render diagnostics unavailable (curl rc=$rc)"
            exit 0
          fi
          python - <<'PY'
          import json
          d=json.load(open("/tmp/render-diagnostics.json",encoding="utf-8"))
          print(json.dumps({
              "ok": d.get("ok"),
              "assessment": d.get("assessment"),
              "service": d.get("service"),
              "recent_deploys": d.get("recent_deploys"),
              "categories": d.get("categories"),
              "important": d.get("important"),
          }, ensure_ascii=False, indent=2, default=str))
          PY

      - name: Check published snapshot freshness
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          snapshot_stale=1
          if curl --fail --show-error --silent --max-time 30 \
            -H "Accept: application/vnd.github.raw+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/contents/neo_latest_result.json?ref=main" > /tmp/snapshot.json; then
            SNAPSHOT=/tmp/snapshot.json python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          try:
              d=json.load(open(os.environ["SNAPSHOT"],encoding="utf-8"))
              captured=d.get("captured_at_utc")
              age=None
              stale=True
              if captured:
                  dt=datetime.fromisoformat(str(captured).replace("Z","+00:00"))
                  age=(datetime.now(timezone.utc)-dt.astimezone(timezone.utc)).total_seconds()/60
                  stale=age>20
              open("/tmp/snapshot_stale","w").write("1" if stale else "0")
              print({"snapshot_captured_at_utc":captured,"snapshot_age_minutes":None if age is None else round(age,1),"snapshot_stale":stale})
          except Exception as exc:
              open("/tmp/snapshot_stale","w").write("1")
              print({"snapshot_stale":True,"snapshot_error":type(exc).__name__+": "+str(exc)[:200]})
          PY
          else
            echo "1" > /tmp/snapshot_stale
            echo "Could not read published snapshot; forcing heartbeat dispatch."
          fi

      - name: Dispatch primary heartbeat if runtime or snapshot is stale
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          runtime_stale="$(cat /tmp/runtime_stale)"
          snapshot_stale="$(cat /tmp/snapshot_stale)"
          if [ "$runtime_stale" != "1" ] && [ "$snapshot_stale" != "1" ]; then
            echo "Runtime and published snapshot are fresh; no dispatch needed."
            exit 0
          fi

          curl --fail --show-error --silent \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/mycelix-heartbeat-v2.yml/dispatches" \
            -d '{"ref":"main"}'

          echo "Primary MYCELIX heartbeat dispatched. runtime_stale=$runtime_stale snapshot_stale=$snapshot_stale"
