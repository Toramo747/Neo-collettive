name: Checkpoint Lag Regression Repeats

on:
  push:
    branches: [fix/ci-checkpoint-lag-relative-20261009]
    paths:
      - "test_checkpoint_observation_deploy.py"
      - ".github/workflows/checkpoint-lag-repeat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
      - name: Repeat isolated checkpoint lag test 10 times
        run: |
          set -euo pipefail
          for iteration in $(seq 1 10); do
            echo "=== run $iteration/10 ==="
            python -m unittest -v test_checkpoint_observation_deploy.CodecSwitchTests.test_three_mib_replay_one_cpu_before_after
          done
