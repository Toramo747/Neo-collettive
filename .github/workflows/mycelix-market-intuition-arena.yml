name: MYCELIX Market Intuition Arena (continuous, private)
on:
  schedule:
    - cron: "17 * * * *"   # watchdog only: restarts the loop if the chain broke
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "Run generations back-to-back for this long, then re-dispatch (0 = single generation)"
        required: false
        default: "330"
permissions:
  contents: read
  actions: write
jobs:
  watchdog:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Restart the loop if no loop is running or queued
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow mycelix-market-intuition-arena.yml --event workflow_dispatch --limit 20 --json status --jq '[.[]|select(.status!="completed")]|length')
          if [ "$active" = "0" ]; then
            gh workflow run mycelix-market-intuition-arena.yml --repo "$GITHUB_REPOSITORY" --ref main -f loop_minutes=330
            echo "::notice title=Market Intuition watchdog::loop restarted"
          fi
  generation:
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: mycelix-market-intuition-arena
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Validate arena
        run: python -m unittest -q test_arena_market_intuition test_market_inference test_mi_deep
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.MODEL_LABEL_REPO }}
          token: ${{ secrets.MODEL_LABEL_REPO_TOKEN }}
          path: private-labels
      # State, discoveries and texts stay in the private archive.
      # The log prints aggregate counts and generic problem terms only.
      # Continuous mode: GitHub's scheduler can stall for hours, so a dispatched
      # run loops one generation every 30 minutes and then re-dispatches itself.
      # Cron stays as a fallback. Public repository: no Actions cost.
      # The mind: a local LLM (Ollama, free) that judges needs, maps markets
      # and proposes its own next searches. If it cannot start, the arena runs
      # without it.
      - name: Start local LLM (the mind)
        continue-on-error: true
        run: |
          set -euo pipefail
          timeout 120 bash -c 'curl -fsSL https://ollama.com/install.sh | sh'
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
          timeout 480 ollama pull qwen2.5:3b-instruct-q4_K_M
      - name: Generations (one every 30 minutes)
        env:
          LOOP_MINUTES: ${{ inputs.loop_minutes || '0' }}
          MI_LLM_MODEL: qwen2.5:3b-instruct-q4_K_M
        run: |
          set -euo pipefail
          git -C private-labels config user.name "MYCELIX Market Intuition"
          git -C private-labels config user.email "actions@users.noreply.github.com"
          start=$(date +%s)
          while true; do
            t0=$(date +%s)
            git -C private-labels pull --quiet --rebase || true
            python arena_market_intuition.py --private-dir private-labels || echo "::warning::generation failed"
            git -C private-labels add market-intuition
            if git -C private-labels commit --quiet -m "market intuition: generation"; then
              for attempt in 1 2 3; do
                git -C private-labels pull --quiet --rebase && git -C private-labels push --quiet && break
                sleep $((attempt*4))
              done
            fi
            gen=$(python -c "import json;print(json.load(open('private-labels/market-intuition/state.json')).get('generation',0))" 2>/dev/null || echo 0)
            if [ $((gen % 12)) -eq 0 ]; then
              GH_TOKEN="${{ github.token }}" gh workflow run mycelix-market-mind-deep.yml --repo "$GITHUB_REPOSITORY" --ref main || true
            fi
            elapsed=$(( ($(date +%s) - start) / 60 ))
            if [ "$elapsed" -ge "$((LOOP_MINUTES - 32))" ]; then break; fi
            sleep $(( 1800 - ($(date +%s) - t0) > 0 ? 1800 - ($(date +%s) - t0) : 0 ))
          done
      - name: Re-dispatch next loop
        if: inputs.loop_minutes != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mycelix-market-intuition-arena.yml --repo "$GITHUB_REPOSITORY" --ref main -f loop_minutes="${{ inputs.loop_minutes }}"
