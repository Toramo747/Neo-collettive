name: AICOMGLOBAL adapter validation

on:
  push:
    branches: [experiment-aicomglobal-adapter]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python -m unittest -v test_aicomglobal_adapter.py
      - name: Focused read-only mapping
        run: |
          python - <<'PY'
          from aicomglobal_adapter import call_read_only

          probes=[
              ("AGENT_JOBS","aicom_channel_read",{"channel":"agent-jobs","limit":20}),
              ("AGENT_JOBS_ID","aicom_channel_read",{"channel_id":"chn_daaa0916","limit":20}),
              ("EXPERIMENT_TRUST","aicom_experiment_get",{"experiment_id":"exp_bee3264c"}),
              ("EXPERIMENT_TRANSPORT","aicom_experiment_get",{"experiment_id":"exp_3e1464a2"}),
          ]
          success=0
          for label,skill,inp in probes:
              print("=== "+label+" ===")
              try:
                  out=call_read_only(skill,inp,timeout=30)
                  print("ok="+str(out.get("ok"))+" state="+str(out.get("state")))
                  for text in (out.get("texts") or [])[:4]:
                      print(text[:18000])
                  success += 1
              except Exception as exc:
                  print("ERROR="+type(exc).__name__+":"+str(exc)[:1200])
          print("FOCUSED_PROBES_OK="+str(success)+"/"+str(len(probes)))
          PY
