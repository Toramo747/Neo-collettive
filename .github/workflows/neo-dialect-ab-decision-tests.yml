name: NEO Dialect AB Decision Tests

on:
  push:
    paths:
      - "docs/neo-dialect/ab-decision.md"
      - "test_neo_dialect_ab_decision.py"
      - ".github/workflows/neo-dialect-ab-decision-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate blocked A/B decision
        run: python -m unittest -v test_neo_dialect_ab_decision.py
      - name: Assert production 1.0 remains untouched
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only HEAD^ HEAD -- docs/neo-dialect.md schemas/neo-dialect/1.0 neo_dialect.py)"
      - name: Assert no 1.1 draft exists
        run: |
          set -euo pipefail
          test ! -e schemas/neo-dialect/1.1-draft
