name: Deploy regression diagnostics (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Run the deploy regression list and annotate failures
        run: |
          set +e
          python -m unittest -v test_checkpoint_observation_deploy.py test_runtime_observation.py test_deploy_rollback.py test_deploy_health.py test_memory_repair.py test_evidence_store_atomic.py test_evidence_integrity.py test_arena_research_algorithm.py test_a2a_discovery_startup.py test_hidden_control_gate.py test_hidden_challenge_control_gate.py test_challenge_track.py test_commercial_gate_non_regression.py test_gate_stability.py test_seti_radar.py test_tool_opportunity.py test_thesis_control.py test_outcome_control.py test_discovery_v3.py test_query_builder.py test_state_recovery.py test_state_compaction.py test_public_snapshot_privacy.py test_model_judges.py test_model_shadow_runtime.py test_model_shadow_gate_non_regression.py test_model_shadow_privacy.py test_route_policy.py test_inbound_interview.py test_trust_lab.py test_intent_discovery.py test_agent_demand.py test_agent_chat.py test_inbound_traffic.py test_runtime_boundary.py test_a2a_peer.py test_peer_refusal.py test_inbound_security.py test_venture_measurement.py test_neo_dialect.py test_neo_dialect_security.py test_neo_dialect_seti_probe.py test_neo_dialect_council.py test_dialect_peer_harness.py test_mcp_endpoint_verifier.py test_registry_health.py test_arena_core.py test_arena_micelio.py test_arena_evolution.py test_arena_registry_world.py > /tmp/ut.txt 2>&1
          rc=$?
          grep -E "^(FAIL|ERROR):" /tmp/ut.txt | head -20 | sed 's/^/::error title=failing test::/'
          python - <<'PY'
          import re
          t=open("/tmp/ut.txt").read()
          for block in re.split(r"\n=+\n", t)[1:6]:
              lines=[l for l in block.splitlines() if l.strip()][-6:]
              print("::warning title=failure detail::" + " | ".join(l.strip()[:200] for l in lines)[:900])
          PY
          tail -3 /tmp/ut.txt
          exit $rc
