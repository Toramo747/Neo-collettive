name: tmp full check - anchors and provenance on main (read-only)
on:
  push:
    branches: [mind/fact-cards]
    paths: [.github/workflows/tmp-provenance-trial.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --quiet --require-hashes -r requirements.lock && python -m pip install --quiet opentimestamps-client==0.7.2
      - run: |
          set +e
          for a in docs/receipts-log/anchors/20*.json; do
            python tools/receipt_log_anchor.py verify "$a" docs/receipts-log/log.jsonl > /tmp/a.txt; rc=$?
            echo "::notice title=anchor $(basename $a)::rc=$rc $(tr '\n' ' ' < /tmp/a.txt | cut -c1-600)"
          done
          for p in docs/provenance/post_*.json; do
            python tools/provenance.py verify "$p" --live > /tmp/p.txt; rc=$?
            echo "::notice title=provenance $(basename $p)::rc=$rc ok=$(grep -c '^OK' /tmp/p.txt) fail=$(grep -c '^FAIL' /tmp/p.txt) $(grep '^FAIL' /tmp/p.txt | tr '\n' ' ')"
          done
          python tools/receipt_log_verify.py docs/receipts-log/log.jsonl > /tmp/l.txt 2>&1; echo "::notice title=receipt log chain::rc=$? $(tail -2 /tmp/l.txt | tr '\n' ' ' | cut -c1-300)"
