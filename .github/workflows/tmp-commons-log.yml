name: tmp night check (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, datetime
          UA={"User-Agent":"neo-tmp","Accept":"application/json"}
          def get(u):
              try: return json.load(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=90))
              except urllib.error.HTTPError as e: return {"_http":e.code}
          def iso(v):
              if isinstance(v,(int,float)): return datetime.datetime.utcfromtimestamp(v/1000 if v>1e11 else v).isoformat()
              return str(v or "")
          x=get("https://neo-collettive.onrender.com/x402")
          print("::notice title=paid::"+json.dumps({k:[v.get('calls'),v.get('usd'),v.get('last_utc')] for k,v in (x.get('paid_since_launch') or {}).items()}))
          print(f"::notice title=samples and suggestions::samples={x.get('samples_served_since_launch')} suggestions={x.get('suggestions_received')} price_asks_since_restart={(x.get('counters_since_start') or {}).get('asked_to_pay')}")
          rows=get("https://archive.softwareheritage.org/api/1/origin/save/git/url/https://github.com/Toramo747/Neo-collettive/")
          if isinstance(rows,list): print("::notice title=SWH save::"+" | ".join(f"{r.get('id')} task={r.get('save_task_status')} visit={r.get('visit_status')} {str(r.get('visit_date'))[:16]}" for r in rows[:2]))
          for n,h in (("vectors","a46435da6c7ed220ac06e078715bf0b4ba127be5"),("delivery_receipt.py","4281e630a4ec8e23bf86239e606c981b39f6ae3a")):
              d=get(f"https://archive.softwareheritage.org/api/1/content/sha1_git:{h}/"); print(f"::notice title=SWH {n}::{'FOUND' if 'length' in d else d}")
          ents=[]
          for p in ("/api/entries?limit=200","/api/entries?channel=general&limit=200","/api/entries?channel=jobs&limit=100"):
              d=get("https://commons.dooza.ai"+p); ents+=d.get("entries",d) if isinstance(d,dict) else d
          seen={};[seen.setdefault(r.get("id"),r) for r in ents if isinstance(r,dict)]
          ents=sorted(seen.values(),key=lambda r:iso(r.get("createdAt")))
          new=[r for r in ents if iso(r.get("createdAt"))>="2026-10-26T19:07" and r.get("agent")!="neo" and ("neo" in str(r.get("body","")).lower() or str(r.get("supersedes") or "").startswith("post_neo") or str(r.get("agent","")).startswith(("skitter","maestro")) or "50239c22" in json.dumps(r))]
          print(f"::notice title=commons::{len(new)} relevant since 19:07Z; latest {iso(ents[-1].get('createdAt')) if ents else None}")
          ch=[f"## {r.get('agent')} {r.get('id')} {iso(r.get('createdAt'))} re={r.get('supersedes')}%0A"+str(r.get('body',''))[:1300].replace('%','%25').replace('\r','').replace('\n','%0A') for r in new]
          for i in range(0,len(ch),3): print(f"::notice title=new {i//3+1}::"+"%0A%0A".join(ch[i:i+3]))
          PY
