name: tmp verify skitter credits live (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          pip install -q cryptography
          python3 - <<'PY'
          import json, urllib.request, base64, hashlib
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          B="https://neo-collettive.onrender.com"; UA={"User-Agent":"neo-tmp"}
          get=lambda p: json.load(urllib.request.urlopen(urllib.request.Request(B+p,headers=UA),timeout=120))
          cj=lambda o: json.dumps(o,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()
          pub=get("/.well-known/agent-card.json")["receipt_signing"]["public_key_b64"]
          cr=get("/receipts/credits?agent=skitter")["credits"]
          log=get("/receipts/log"); ents={e[0]:e for e in log.get("entries",[])}
          for c in cr:
              o=dict(c); s=o.pop("signature")
              try: Ed25519PublicKey.from_public_bytes(base64.b64decode(pub)).verify(base64.urlsafe_b64decode(s+"=="),cj(o)); sig=True
              except Exception: sig=False
              seq=c["receipt"]["log"]["seq"]; e=ents.get(seq)
              print(f"::notice title=credit seq {seq}::sig_ok={sig} item_ok={bool(e) and e[3]==hashlib.sha256(cj(c)).hexdigest()} kind={e and e[2]} extra={e and e[4]} found_on={c.get('found_on')}")
          print(f"::notice title=log::count={log.get('count')} head={log.get('head')}")
          PY
