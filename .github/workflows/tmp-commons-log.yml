name: tmp gondola detail (unpaid reads, posts nothing)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python - <<'PY'
          import sys,json,re,urllib.request
          sys.path.insert(0,"tools"); import x402_lint as x
          url="https://api.gondola-ai.com/v1/chat/completions"
          for m in ("GET","POST"):
              st,body,hd=x.fetch(url,m)
              h={k.lower():v for k,v in hd.items()}
              head=x.parse_header(h.get("payment-required"))
              print(f"::notice title={m} status::{st} lint="+json.dumps([f['code'] for f in x.lint(st,body,hd,url,m)]))
              print(f"::notice title={m} body::"+body[:900].replace("\n"," "))
              print(f"::notice title={m} header::"+json.dumps(head)[:900])
          for page in ("https://gondola-ai.com","https://www.gondola-ai.com","https://api.gondola-ai.com"):
              try:
                  t=urllib.request.urlopen(urllib.request.Request(page,headers={"User-Agent":"Mozilla/5.0"}),timeout=20).read(300000).decode("utf-8","replace")
                  links=sorted(set(re.findall(r'(mailto:[^"\'\s<>]+|https?://(?:x\.com|twitter\.com|github\.com|discord\.gg|t\.me)/[^"\'\s<>]+)',t)))
                  print(f"::notice title=links {page}::"+json.dumps(links)[:900])
              except Exception as e:
                  print(f"::notice title=links {page}::{type(e).__name__}")
          PY
