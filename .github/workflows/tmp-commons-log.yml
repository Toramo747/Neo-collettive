name: tmp markedet feed check (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, hashlib, datetime, re
          UA={"User-Agent":"neo-tmp (neo-collettive.onrender.com)","Accept":"application/json"}
          def get(u,h=UA):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=60); b=r.read(); return b, r.status
              except Exception as e: return str(e).encode(), 0
          now=datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%MZ")
          raw,st=get("https://markedet.bitbucket.io/spec-radar/feed.json")
          sha=hashlib.sha256(raw).hexdigest(); f=json.loads(raw)
          items=f.get("items",[])
          print(f"::notice title=feed {now}::status={st} bytes={len(raw)} sha256={sha} items={len(items)} top_keys={sorted(f)[:10]}")
          print("::notice title=item keys::"+json.dumps(sorted(items[0]) if items else []))
          done={"2026-07-28","2026-07-28-RC","v1.0.1","v0.2.4"}
          rows=[]
          for it in items:
              src=str(it.get("_source","")); tag=src.rstrip("/").split("/")[-1]
              rows.append((it.get("title","")[:50], src[:90], it.get("_prerelease"), it.get("date_published"), it.get("_checked_at")))
          print("::notice title=items::"+json.dumps(rows[:12]))
          cand=[it for it in items if "github.com" in str(it.get("_source","")) and str(it.get("_source","")).rstrip("/").split("/")[-1] not in done][:2]
          out=[]
          for it in cand:
              src=str(it["_source"]); m=re.search(r"github\.com/([^/]+/[^/]+)/releases/tag/([^/?#]+)",src)
              if not m: out.append({"src":src,"note":"not a release tag url"}); continue
              repo,tag=m.groups(); b,s=get(f"https://api.github.com/repos/{repo}/releases/tags/{tag}",{"User-Agent":"neo-tmp","Accept":"application/vnd.github+json"})
              g=json.loads(b) if s==200 else {"_http":s}
              out.append({"title":it.get("title","")[:50],"repo":repo,"tag":tag,"feed_prerelease":it.get("_prerelease"),"feed_date":it.get("date_published"),
                          "gh_prerelease":g.get("prerelease"),"gh_draft":g.get("draft"),"gh_published_at":g.get("published_at"),"gh_id":g.get("id"),"http":s})
          print("::notice title=checked::"+json.dumps(out))
          # free verify_quote via our public MCP: is the first checked item's title verbatim in the feed?
          q=(cand[0].get("title","") if cand else "")
          body=json.dumps({"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"verify_quote","arguments":{"url":"https://markedet.bitbucket.io/spec-radar/feed.json","quote":q}}}).encode()
          try:
              r=urllib.request.urlopen(urllib.request.Request("https://neo-collettive.onrender.com/mcp",data=body,method="POST",headers={"Content-Type":"application/json","Accept":"application/json, text/event-stream","User-Agent":"neo-tmp"}),timeout=120)
              t=r.read().decode(); t=t[:1500]
          except Exception as e: t=str(e)[:300]
          print("::notice title=verify_quote::"+t.replace('%','%25').replace('\n','%0A'))
          PY
