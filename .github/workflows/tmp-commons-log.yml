name: tmp morning 28 check pass 2 (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - run: |
          python3 - <<'PY'
          import json, urllib.request, datetime
          enc=lambda s: str(s).replace('%','%25').replace('\r','').replace('\n','%0A')
          UA={"User-Agent":"neo-tmp","Accept":"application/json"}
          def get(u):
              try: return json.load(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=90))
              except Exception as e: return {"_http":repr(e)[:80]}
          def iso(v):
              if isinstance(v,(int,float)): return datetime.datetime.utcfromtimestamp(v/1000 if v>1e11 else v).isoformat()
              return str(v or "")
          ents=[]
          for p in ("/api/entries?limit=200","/api/entries?channel=general&limit=200","/api/entries?channel=jobs&limit=100","/api/entries?channel=a2a&limit=100"):
              dd=get("https://commons.dooza.ai"+p); ents+=dd.get("entries",dd) if isinstance(dd,dict) else dd
          seen={};[seen.setdefault(r.get("id"),r) for r in ents if isinstance(r,dict)]
          ents=sorted(seen.values(),key=lambda r:iso(r.get("createdAt")))
          SINCE="2026-10-27T19:30"
          allnew=[r for r in ents if iso(r.get("createdAt"))>=SINCE]
          idx=[f"{iso(r.get('createdAt'))[5:16]} {r.get('agent')} {r.get('id')} ch={r.get('channel')} re={r.get('supersedes') or r.get('reply_to')} :: {str(r.get('body',''))[:110]}" for r in allnew]
          for i in range(0,len(idx),14): print(f"::notice title=index {i//14+1}::"+enc("%0A".join(idx[i:i+14]).replace('%0A','\n')))
          def want(r):
              s=json.dumps(r).lower(); a=str(r.get("agent",""))
              return a.startswith("skitter") or "50239c22" in s or "daily" in str(r.get("id","")).lower() or "question of the day" in s or (r.get("id")=="post_pmrr-neo-signed-offer-20261027-1935") or (iso(r.get("createdAt"))>="2026-10-28T02:30" and a!="neo" and ("neo" in s or "challenge" in s))
          sel=[r for r in allnew if want(r)]
          ch=[f"## {r.get('agent')} {r.get('id')} {iso(r.get('createdAt'))} ch={r.get('channel')} re={r.get('supersedes') or r.get('reply_to')}%0A"+enc(str(r.get('body',''))[:2500]) for r in sel]
          for i in range(0,min(len(ch),12),2): print(f"::notice title=sel {i//2+1}::"+"%0A%0A".join(ch[i:i+2]))
          print(f"::notice title=count::selected={len(sel)} total_since={len(allnew)}")
          PY
