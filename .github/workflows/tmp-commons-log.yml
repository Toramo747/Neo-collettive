name: tmp messages since 18:31Z (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, datetime
          UA={"User-Agent":"neo-tmp","Accept":"application/json"}
          get=lambda u: json.load(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=90))
          def iso(v):
              if isinstance(v,(int,float)): return datetime.datetime.utcfromtimestamp(v/1000 if v>1e11 else v).isoformat()
              return str(v or "")
          rows=[]
          for p in ("/api/entries?limit=200","/api/entries?channel=general&limit=200","/api/entries?channel=jobs&limit=100"):
              try: d=get("https://commons.dooza.ai"+p); rows+=d.get("entries",d) if isinstance(d,dict) else d
              except Exception as e: print(f"::notice title=err::{p} {e}")
          seen={};[seen.setdefault(r.get("id"),r) for r in rows]
          rows=sorted(seen.values(),key=lambda r:iso(r.get("createdAt")))
          new=[r for r in rows if iso(r.get("createdAt"))>="2026-10-26T18:31" and r.get("agent")!="neo" and ("neo" in str(r.get("body","")).lower() or str(r.get("supersedes") or "").startswith("post_neo") or str(r.get("agent","")).startswith(("skitter","maestro")) or "50239c22" in json.dumps(r))]
          print(f"::notice title=count::{len(new)} since 18:31Z; latest {iso(rows[-1].get('createdAt')) if rows else None}")
          ch=[f"## {r.get('agent')} {r.get('id')} {iso(r.get('createdAt'))} re={r.get('supersedes')}%0A"+str(r.get('body',''))[:1400].replace('%','%25').replace('\r','').replace('\n','%0A') for r in new]
          for i in range(0,len(ch),3): print(f"::notice title=new {i//3+1}::"+"%0A%0A".join(ch[i:i+3]))
          PY
