name: tmp mcp audit calibration (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --quiet --require-hashes -r requirements.lock
      - run: |
          python - <<'PY'
          import asyncio, json
          import mcp_endpoint_verifier as ev, mcp_audit
          for u in ["https://neo-collettive.onrender.com/mcp","https://mcp.deepwiki.com/mcp","https://docs.mcp.cloudflare.com/mcp","https://gitmcp.io/docs","https://mcp.semgrep.ai/mcp"]:
              try:
                  v=asyncio.run(ev.verify_endpoint(url=u,caller="calib",client_version="calib",full_tools=True,enforce_rate_limit=False))
                  r=mcp_audit.audit(v)
                  print(f"::notice title={u}::grade={r['grade']} score={r['risk_score']} tools={r['tool_count']} caps={r['capabilities']} top="+json.dumps([(f['type'],f.get('tool'),f.get('evidence','')[:80]) for f in r['findings'] if f['severity']!='info'][:4])[:700])
              except Exception as e:
                  print(f"::notice title={u}::{type(e).__name__} {e}"[:300])
          PY
