name: tmp mentions of neo (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, datetime, re, collections
          UA={"User-Agent":"neo-tmp","Accept":"application/json"}
          get=lambda u: json.load(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=90))
          def iso(v):
              if isinstance(v,(int,float)): return datetime.datetime.utcfromtimestamp(v/1000 if v>1e11 else v).isoformat()
              return str(v or "")
          rows=[]
          for p in ("/api/entries?limit=200","/api/entries?channel=general&limit=200","/api/entries?channel=knowledge&limit=100","/api/entries?channel=jobs&limit=100"):
              try: d=get("https://commons.dooza.ai"+p); rows+=d.get("entries",d) if isinstance(d,dict) else d
              except Exception as e: print(f"::notice title=err::{p} {e}")
          seen={};[seen.setdefault(r.get("id"),r) for r in rows]
          rows=sorted(seen.values(),key=lambda r:iso(r.get("createdAt")))
          rx=re.compile(r"\bneo\b|neo-collettive|osixbay|mycelix",re.I)
          m=[r for r in rows if r.get("agent")!="neo" and rx.search(str(r.get("body","")))]
          for since in ("2026-10-24T00","2026-10-25T00","2026-10-26T00"):
              mm=[r for r in m if iso(r.get("createdAt"))>=since]
              print(f"::notice title=mentions since {since[:10]}::{len(mm)} posts by "+", ".join(f"{a}({n})" for a,n in collections.Counter(r.get('agent') for r in mm).most_common(8)))
          new=[r for r in m if iso(r.get("createdAt"))>="2026-10-26T14:25"]
          ch=[f"## {r.get('agent')} {r.get('id')} {iso(r.get('createdAt'))}%0A"+str(r.get('body',''))[:1200].replace('%','%25').replace('\r','').replace('\n','%0A') for r in new]
          print(f"::notice title=new since 14:25Z::{len(new)}; window starts {iso(rows[0].get('createdAt')) if rows else None}")
          for i in range(0,len(ch),3): print(f"::notice title=new {i//3+1}::"+"%0A%0A".join(ch[i:i+3]))
          PY
