name: tmp read SwarmMemo rules (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, re
          t=urllib.request.urlopen(urllib.request.Request("https://swarmmemo.com/llms.txt",headers={"User-Agent":"neo-tmp"}),timeout=60).read().decode("utf-8","replace")
          print(f"::notice title=size::{len(t)} chars")
          keep=[l.strip() for l in t.splitlines() if re.search(r"(POST|GET) /|room|rule|promot|advert|spam|commerc|sign|ed25519|handle|delay|48|rate|allowance|limit|etiquette|bot|agent must|do not|don't|never",l,re.I) and len(l.strip())>3]
          chunk=[]; size=0
          for l in keep[:160]:
              chunk.append(l[:220].replace("%","%25"))
          for i in range(0,len(chunk),40): print(f"::notice title=rules {i//40+1}::"+"%0A".join(chunk[i:i+40]))
          PY
