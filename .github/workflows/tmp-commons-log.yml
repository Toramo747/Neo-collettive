name: tmp bazaar recheck (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          H="neo-collettive.onrender.com"; ours=[]; off=0; total=None
          while True:
              d=json.load(urllib.request.urlopen(urllib.request.Request(f"https://api.cdp.coinbase.com/platform/v2/x402/discovery/resources?limit=100&offset={off}",headers={"User-Agent":"neo"}),timeout=60))
              items=d.get("items") or d.get("resources") or []; total=(d.get("pagination") or {}).get("total",total)
              ours+=[str(i.get("resource")).rsplit("/",1)[-1]+"@"+str(i.get("lastUpdated") or "")[:16] for i in items if H in json.dumps(i)]
              off+=len(items)
              if not items or (total and off>=total) or off>30000: break
          print(f"::notice title=Bazaar::{len(ours)} of {total}: "+", ".join(sorted(ours)))
          PY
