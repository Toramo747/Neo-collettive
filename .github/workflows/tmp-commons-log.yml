name: tmp SWH check of 25/10 SWHIDs (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          ids={"delivery_receipt.py":"c58f9554ae8fb81585cf425a30b4813348b45d9c","vectors":"6fdaf45c52826bcccfe7cca8259fd237559a0606","spec":"e522b830b1231fdb9003e15b23c1c2be0cc41570"}
          for name,h in ids.items():
              u=f"https://archive.softwareheritage.org/api/1/content/sha1_git:{h}/"
              try:
                  d=json.load(urllib.request.urlopen(u,timeout=60))
                  print(f"::notice title=SWH {name}::FOUND length={d.get('length')} status={d.get('status')} sha1_git_ok={d.get('checksums',{}).get('sha1_git')==h}")
              except urllib.error.HTTPError as e:
                  print(f"::notice title=SWH {name}::HTTP {e.code}")
              except Exception as e:
                  print(f"::notice title=SWH {name}::ERR {type(e).__name__}")
          PY
