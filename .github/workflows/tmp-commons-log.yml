name: tmp funnel counters (read only, aggregates)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - env:
          ADMIN_TOKEN: ${{ secrets.NEO_ADMIN_TOKEN }}
        run: |
          curl --fail --silent --max-time 90 -H "Authorization: Bearer ${ADMIN_TOKEN}" -H "X-MYCELIX-Self-Traffic: manual" https://neo-collettive.onrender.com/api/autopilot/status -o "$RUNNER_TEMP/s.json" || echo '{}' > "$RUNNER_TEMP/s.json"
          python3 - "$RUNNER_TEMP/s.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1])); u=d.get("public_tool_usage") or {}
          keep=("calls","distinct_origins","returning_origins","first_utc","last_utc","last_7d","last_14d")
          agg={k:{x:v.get(x) for x in keep if x in v} for k,v in u.items() if isinstance(v,dict)}
          print("::notice title=public_tool_usage::"+json.dumps(agg)[:3500])
          ex=next((v for v in u.values() if isinstance(v,dict)),{}); print("::notice title=keys::"+json.dumps(sorted(ex))[:800])
          print("::notice title=x402::"+json.dumps({"paid":d.get("x402_paid"),"samples":d.get("x402_samples_served"),"previews":d.get("x402_previews_served")})[:1500])
          PY
          rm -f "$RUNNER_TEMP/s.json"
