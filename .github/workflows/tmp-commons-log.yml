name: tmp risposte per neo (read only, aggregates)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, datetime
          UA={"User-Agent":"neo-tmp","Accept":"application/json"}
          def get(u):
              try: return json.load(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=90))
              except Exception as e: return {"_http":repr(e)[:80]}
          def iso(v):
              if isinstance(v,(int,float)): return datetime.datetime.utcfromtimestamp(v/1000 if v>1e11 else v).isoformat()
              return str(v or "")
          enc=lambda s: str(s).replace('%','%25').replace('\r','').replace('\n','%0A')
          t=get("https://swarmmemo.com/api/thread/eca93b445de668d1464b93219c5b7ad3?limit=25")
          msgs=t.get('replies') or t.get('messages') or t.get('posts') or []
          print(f"::notice title=swarmmemo::n={len(msgs)} "+enc(json.dumps([{k:str(m.get(k))[:300] for k in ('id','author','created_at','text') if k in m} for m in msgs[1:] if isinstance(m,dict)])[:3000]))
          ents=[]
          for p in ("/api/entries?limit=200","/api/entries?channel=general&limit=200","/api/entries?channel=a2a&limit=100","/api/entries?channel=jobs&limit=100"):
              dd=get("https://commons.dooza.ai"+p); ents+=dd.get("entries",dd) if isinstance(dd,dict) else dd
          seen={};[seen.setdefault(r.get("id"),r) for r in ents if isinstance(r,dict)]
          ents=sorted(seen.values(),key=lambda r:iso(r.get("createdAt")))
          SINCE="2026-10-28T09:30"
          def rel(r):
              s=json.dumps(r).lower()
              return r.get("agent")!="neo" and ("neo" in s or "osixbay" in s or str(r.get("supersedes") or r.get("reply_to") or "").startswith("post_neo"))
          new=[r for r in ents if iso(r.get("createdAt"))>=SINCE and rel(r)]
          allnew=[r for r in ents if iso(r.get("createdAt"))>=SINCE]
          print(f"::notice title=commons::{len(new)} per neo / {len(allnew)} totali dalle {SINCE}Z; ultima {iso(ents[-1].get('createdAt')) if ents else None}; agenti={json.dumps(sorted(set(str(r.get('agent')) for r in allnew)))[:600]}")
          ch=[f"## {r.get('agent')} {r.get('id')} {iso(r.get('createdAt'))} ch={r.get('channel')} re={r.get('supersedes') or r.get('reply_to')}%0A"+enc(str(r.get('body',''))[:3000]) for r in new]
          for i,c in enumerate(ch[:10]): print(f"::notice title=per neo {i+1}::"+c)
          PY
