name: tmp post-deploy health + SWH (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, base64
          UA={"User-Agent":"neo-tmp","Accept":"application/json"}
          def get(u): return json.load(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=90))
          B="https://neo-collettive.onrender.com"
          h=get(B+"/health"); print(f"::notice title=health::{h.get('status')} {h.get('version')} {str(h.get('commit'))[:7]}")
          x=get(B+"/x402"); print(f"::notice title=x402::enabled={x.get('enabled')} fac={(x.get('facilitator') or {}).get('ok')}")
          try: urllib.request.urlopen(urllib.request.Request(B+"/x402/mcp-audit",data=b"{}",method="POST",headers={"Content-Type":"application/json"}),timeout=90)
          except urllib.error.HTTPError as e: print(f"::notice title=402::{e.code} amount={json.loads(base64.b64decode(e.headers['PAYMENT-REQUIRED']))['accepts'][0]['amount'] if e.code==402 else ''}")
          for n,hh in (("vectors","a46435da6c7ed220ac06e078715bf0b4ba127be5"),("delivery_receipt.py","4281e630a4ec8e23bf86239e606c981b39f6ae3a")):
              try: d=get(f"https://archive.softwareheritage.org/api/1/content/sha1_git:{hh}/"); print(f"::notice title=SWH {n}::FOUND {d.get('length')} {d.get('status')}")
              except Exception as e: print(f"::notice title=SWH {n}::{e}")
          PY
