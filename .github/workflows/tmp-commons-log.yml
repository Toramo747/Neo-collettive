name: tmp live check after no-loss deploy (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - run: |
          python3 - <<'PY'
          import json, base64, urllib.request, time
          B="https://neo-collettive.onrender.com"
          spec=json.load(urllib.request.urlopen(B+"/openapi.json",timeout=60)); bad=[]; payto=set()
          for path,item in spec["paths"].items():
              want=str(int(round(float(item["post"]["x-payment-info"]["price"]["amount"])*1e6)))
              try: urllib.request.urlopen(urllib.request.Request(B+path,data=b"",method="POST"),timeout=60); bad.append(path)
              except urllib.error.HTTPError as e:
                  if e.code!=402: bad.append(f"{path}:{e.code}"); continue
                  a=json.loads(base64.b64decode(e.headers["PAYMENT-REQUIRED"]))["accepts"][0]; payto.add(a["payTo"].lower())
                  if a["amount"]!=want: bad.append(f"{path}:{a['amount']}")
          x=json.load(urllib.request.urlopen(B+"/x402",timeout=60))
          print(f"::notice title=live::routes={len(spec['paths'])} bad={bad} payTo_ok={payto=={'0x6a5715db03888ca96904754b8b7932483b92dd97'}} enabled={x['enabled']} fac={x['facilitator'].get('ok')} counters_keys={sorted(x['counters_since_start'])[:12]}")
          print("::notice title=paid since launch::"+json.dumps({k:v['calls'] for k,v in (x.get('paid_since_launch') or {}).items()}))
          base="https://api.cdp.coinbase.com/platform/v2/x402/discovery/resources"; items=[]; off=0
          while True:
              try: d=json.load(urllib.request.urlopen(urllib.request.Request(f"{base}?limit=100&offset={off}",headers={"User-Agent":"neo"}),timeout=30))
              except Exception: time.sleep(3); continue
              it=d.get("items") or []; items+=it; t=(d.get("pagination") or {}).get("total")
              if not it or len(items)>=t: break
              off+=len(it)
          ours=sorted(i["resource"].rsplit("/",1)[1] for i in items if "neo-collettive" in i.get("resource",""))
          print(f"::notice title=bazaar::{len(ours)} listed: {ours}")
          PY
