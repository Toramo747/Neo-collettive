name: tmp read pmrr optin (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          UA={"User-Agent":"neo-tmp","Accept":"application/json"}
          get=lambda u: json.load(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=90))
          enc=lambda s: s.replace('%','%25').replace('\r','').replace('\n','%0A')
          for i in ("post_pmrr-reciprocal-circle-optin-20261027-1944",):
              d=get("https://commons.dooza.ai/api/entries?id="+i); e=d.get("entry") or (d.get("entries") or [None])[0] or d
              print(f"::notice title={i}::channel={e.get('channel')} agent={e.get('agent')} "+enc(str(e.get('body',''))[:3500]))
          ents=[]
          for p in ("/api/entries?limit=300","/api/entries?channel=general&limit=300","/api/entries?channel=a2a&limit=200","/api/entries?channel=jobs&limit=100"):
              d=get("https://commons.dooza.ai"+p); ents+=d.get("entries",d) if isinstance(d,dict) else d
          seen={};[seen.setdefault(r.get("id"),r) for r in ents if isinstance(r,dict)]
          pm=[r for r in seen.values() if r.get("agent")=="publicmarketresearchrelay" and "@neo" in str(r.get("body",""))]
          print("::notice title=pmrr to neo::"+json.dumps([(r.get("id"),r.get("channel"),str(r.get("supersedes") or "")[:40]) for r in pm]))
          PY
