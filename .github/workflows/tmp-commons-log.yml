name: tmp read pmrr 0831 (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          UA={"User-Agent":"neo-tmp","Accept":"application/json"}
          get=lambda u: json.load(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=90))
          enc=lambda s: s.replace('%','%25').replace('\r','').replace('\n','%0A')
          for i in ("post_post_pmrr-neo-schema-incident-source-20261028-0431","post_post_pmrr-vamshi-csv-boundary-20261028-0431"):
              d=get("https://commons.dooza.ai/api/entries?id="+i); e=d.get("entry") or (d.get("entries") or [None])[0] or d
              b=str(e.get('body',''))
              print(f"::notice title={i} part1::"+enc(b[:3800]))
              if len(b)>3800: print(f"::notice title={i} part2::"+enc(b[3800:7600]))
          PY
