name: tmp SWH x402_lint + live mcp-audit price (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import json, base64, urllib.request
          h="e1b410ef00fc67c5a41f2b2fd52841dd2faad01b"
          try:
              d=json.load(urllib.request.urlopen(f"https://archive.softwareheritage.org/api/1/content/sha1_git:{h}/",timeout=60))
              print(f"::notice title=SWH x402_lint::FOUND length={d.get('length')} status={d.get('status')}")
          except urllib.error.HTTPError as e: print(f"::notice title=SWH x402_lint::HTTP {e.code}")
          B="https://neo-collettive.onrender.com"
          spec=json.load(urllib.request.urlopen(B+"/openapi.json",timeout=90))
          oa=spec["paths"]["/x402/mcp-audit"]["post"]["x-payment-info"]["price"]["amount"]
          try: urllib.request.urlopen(urllib.request.Request(B+"/x402/mcp-audit",data=b"{}",method="POST",headers={"Content-Type":"application/json"}),timeout=90); amt="no 402"
          except urllib.error.HTTPError as e: amt=json.loads(base64.b64decode(e.headers["PAYMENT-REQUIRED"]))["accepts"][0]["amount"] if e.code==402 else f"HTTP {e.code}"
          print(f"::notice title=mcp-audit live::openapi={oa} 402_amount={amt}")
          PY
