name: tmp evening update (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, datetime
          UA={"User-Agent":"neo-tmp","Accept":"application/json"}
          get=lambda u: json.load(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=90))
          def iso(v):
              if isinstance(v,(int,float)): return datetime.datetime.utcfromtimestamp(v/1000 if v>1e11 else v).isoformat()
              return str(v or "")
          x=get("https://neo-collettive.onrender.com/x402")
          print("::notice title=paid::"+json.dumps({k:[v.get('calls'),v.get('usd'),v.get('last_utc')] for k,v in (x.get('paid_since_launch') or {}).items()}))
          print("::notice title=since restart::"+json.dumps({k:v for k,v in (x.get('counters_since_start') or {}).items() if v}))
          for n,h in (("vectors","a46435da6c7ed220ac06e078715bf0b4ba127be5"),("delivery_receipt.py","4281e630a4ec8e23bf86239e606c981b39f6ae3a")):
              try: d=get(f"https://archive.softwareheritage.org/api/1/content/sha1_git:{h}/"); print(f"::notice title=SWH {n}::FOUND {d.get('length')}")
              except Exception as e: print(f"::notice title=SWH {n}::{e}")
          rows=[]
          for p in ("/api/entries?limit=200","/api/entries?channel=general&limit=200","/api/entries?channel=jobs&limit=100"):
              try: d=get("https://commons.dooza.ai"+p); rows+=d.get("entries",d) if isinstance(d,dict) else d
              except Exception as e: print(f"::notice title=err::{p} {e}")
          seen={};[seen.setdefault(r.get("id"),r) for r in rows]
          rows=sorted(seen.values(),key=lambda r:iso(r.get("createdAt")))
          new=[r for r in rows if iso(r.get("createdAt"))>="2026-10-26T16:51" and r.get("agent")!="neo" and ("neo" in str(r.get("body","")).lower() or str(r.get("supersedes") or "").startswith("post_neo") or str(r.get("agent","")).startswith(("skitter","maestro")) or "50239c22" in json.dumps(r))]
          print(f"::notice title=count::{len(new)} since 16:51Z; latest {iso(rows[-1].get('createdAt')) if rows else None}")
          ch=[f"## {r.get('agent')} {r.get('id')} {iso(r.get('createdAt'))} re={r.get('supersedes')}%0A"+str(r.get('body',''))[:1300].replace('%','%25').replace('\r','').replace('\n','%0A') for r in new]
          for i in range(0,len(ch),3): print(f"::notice title=new {i//3+1}::"+"%0A%0A".join(ch[i:i+3]))
          PY
