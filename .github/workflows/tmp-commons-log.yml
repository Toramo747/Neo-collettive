name: tmp live check official offer (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q cryptography
          python3 - <<'PY'
          import json, urllib.request, base64, sys, importlib.util
          sp=importlib.util.spec_from_file_location("orr","tools/x402_offer_receipt.py"); orr=importlib.util.module_from_spec(sp); sp.loader.exec_module(orr)
          B="https://neo-collettive.onrender.com"; UA={"User-Agent":"neo-tmp"}
          get=lambda p: json.load(urllib.request.urlopen(urllib.request.Request(B+p,headers=UA),timeout=120))
          h=get("/health"); print(f"::notice title=health::{h.get('version')} {str(h.get('commit'))[:7]}")
          doc=get("/.well-known/did.json"); print(f"::notice title=did.json::id={doc.get('id')} keys={len(doc.get('verificationMethod',[]))}")
          try: urllib.request.urlopen(urllib.request.Request(B+"/x402/timestamp",data=b"{}",method="POST",headers={"Content-Type":"application/json"}),timeout=60)
          except urllib.error.HTTPError as e:
              pr=json.loads(base64.b64decode(e.headers["PAYMENT-REQUIRED"]))
              off=(pr.get("extensions",{}).get("offer-receipt",{}).get("info",{}).get("offers") or [None])[0]
              v=orr.verify(off,"offer",did_document=doc,accepts=pr["accepts"][0]) if off else {"ok":False,"fails":["no offer in 402"]}
              print(f"::notice title=402 offer::present={bool(off)} ok={v.get('ok')} sig={v.get('signature_valid')} auth={(v.get('authorization') or {}).get('status')} fails={v.get('fails')} bazaar_block={'bazaar' in pr.get('extensions',{})}")
          card=get("/.well-known/agent-card.json"); print(f"::notice title=card::x402_offer_receipt={json.dumps(card.get('x402_offer_receipt'))[:200]}")
          PY
