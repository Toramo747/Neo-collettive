name: tmp x402 listing test (one paid call per unlisted service, Andrea's OK 25/10)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --quiet "x402[httpx,evm]" eth-account cryptography
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.MODEL_LABEL_REPO }}
          token: ${{ secrets.MODEL_LABEL_REPO_TOKEN }}
          path: private-labels
      - name: Self-test (address published only after checks; then wait for 2.08 USDC and pay five calls)
        run: |
          git -C private-labels config user.name "NEO Ops Bot"; git -C private-labels config user.email "actions@users.noreply.github.com"
          git -C private-labels rm -q --cached common/x402/selftest-address.txt 2>/dev/null || true
          rm -f private-labels/common/x402/selftest-address.txt
          python tools/x402_selftest.py private-labels/common/x402/selftest-address.txt private-labels/common/x402/selftest-report.json
      - if: always()
        run: |
          rm -f "$RUNNER_TEMP/k"
          git -C private-labels add common/x402 2>/dev/null; git -C private-labels commit -qm "ops: x402 self-test report (private)" || true
          for i in 1 2 3; do git -C private-labels pull -q --rebase && git -C private-labels push -q && break; sleep 5; done
