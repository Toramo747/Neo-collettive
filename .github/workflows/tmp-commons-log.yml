name: tmp earnings read (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          x=json.load(urllib.request.urlopen(urllib.request.Request("https://neo-collettive.onrender.com/x402",headers={"User-Agent":"neo-tmp"}),timeout=90))
          print("::notice title=paid_since_launch::"+json.dumps(x.get("paid_since_launch"))[:1500])
          print("::notice title=counters_since_start::"+json.dumps(x.get("counters_since_start"))[:1500])
          cbs=x.get("counters_by_service") or {}
          print("::notice title=counters_by_service::"+json.dumps({k:{kk:vv for kk,vv in v.items() if vv} for k,v in cbs.items()} if isinstance(cbs,dict) else cbs)[:2500])
          PY
