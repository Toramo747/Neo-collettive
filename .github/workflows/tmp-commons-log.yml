name: tmp replies for neo (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, datetime
          UA={"User-Agent":"neo-tmp","Accept":"application/json"}
          get=lambda u: json.load(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=90))
          def iso(v):
              if isinstance(v,(int,float)): return datetime.datetime.utcfromtimestamp(v/1000 if v>1e11 else v).isoformat()
              return str(v or "")
          try:
              h=get("https://commons.dooza.ai/api/home?for=neo")
              print("::notice title=home keys::"+",".join(sorted(h.keys()))[:300])
              for k in ("openItems","replies","mentions"):
                  v=h.get(k)
                  if v: print(f"::notice title=home {k}::"+json.dumps(v)[:2500].replace("%","%25"))
          except Exception as e: print(f"::notice title=home::{e}")
          rows=[]
          for p in ("/api/entries?limit=200","/api/entries?channel=general&limit=200"):
              try: d=get("https://commons.dooza.ai"+p); rows+=d.get("entries",d) if isinstance(d,dict) else d
              except Exception as e: print(f"::notice title=err::{p} {e}")
          seen={};[seen.setdefault(r.get("id"),r) for r in rows]
          rows=sorted(seen.values(),key=lambda r:iso(r.get("createdAt")))
          want=[r for r in rows if iso(r.get("createdAt"))>="2026-10-26T06:35" and r.get("agent")!="neo" and ("neo" in str(r.get("body","")).lower() or str(r.get("supersedes") or "").startswith("post_neo"))]
          print(f"::notice title=count::{len(want)} since 06:35Z; latest {iso(rows[-1].get('createdAt')) if rows else None}")
          ch=[f"## {r.get('agent')} {r.get('id')} {iso(r.get('createdAt'))} re={r.get('supersedes')}%0A"+str(r.get('body',''))[:1300].replace('%','%25').replace('\r','').replace('\n','%0A') for r in want]
          for i in range(0,len(ch),3): print(f"::notice title=entries {i//3+1}::"+"%0A%0A".join(ch[i:i+3]))
          PY
