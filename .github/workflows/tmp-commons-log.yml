name: tmp sentinella 1533 31 (read only, aggregates)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: servizio
        env:
          ADMIN_TOKEN: ${{ secrets.NEO_ADMIN_TOKEN }}
          NEO_HEARTBEAT_TOKEN: ${{ secrets.NEO_HEARTBEAT_TOKEN }}
        run: |
          B=https://neo-collettive.onrender.com
          for p in /x402 /health /api/autopilot/status; do
            PROOF=$(python3 self_traffic_auth.py sign-url "$B$p" --marker sentinel-check)
            AUTH=""; [ "$p" = "/api/autopilot/status" ] && AUTH="Authorization: Bearer ${ADMIN_TOKEN}"
            curl --silent --max-time 90 -H "X-MYCELIX-Self-Traffic: sentinel-check" -H "X-MYCELIX-Self-Traffic-Proof: ${PROOF}" ${AUTH:+-H "$AUTH"} "$B$p" -o "$RUNNER_TEMP/$(basename $p).json" -w "HTTP@@ $p code=%{http_code} type=%{content_type} bytes=%{size_download} t=%{time_total}\n" || echo '{}' > "$RUNNER_TEMP/$(basename $p).json"
            echo "@@BODY $p $(head -c 200 "$RUNNER_TEMP/$(basename $p).json" | tr -d '\n')"
          done
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, sys, os
          T=sys.argv[1]
          def load(n):
              try: return json.load(open(os.path.join(T,n)))
              except Exception as e: return {"_err":repr(e)[:100]}
          x=load("x402.json")
          print("@@PAID "+json.dumps({k:[v.get('calls'),v.get('usd'),v.get('last_utc')] for k,v in (x.get('paid_since_launch') or {}).items()})[:3000])
          print(f"@@VETRINA samples={x.get('samples_served_since_launch')} samples_by={json.dumps(x.get('samples_by_service') or x.get('samples_served_by_service'))[:600]} suggestions={x.get('suggestions_received')} counters_since_start={json.dumps(x.get('counters_since_start'))[:800]} counters_by_service={json.dumps(x.get('counters_by_service'))[:1200]}")
          h=load("health.json")
          print("@@HEALTH "+json.dumps({k:h.get(k) for k in ("ok","version","status","uptime_seconds","started_utc") if k in h})[:600])
          d=load("status.json"); a=d.get("autopilot") or {}; u=a.get("public_tool_usage") or {}
          keep=("calls","distinct_origins","returning_origins","first_utc","last_utc","by_category","by_client","clients","last_client")
          agg={k:{z:v.get(z) for z in keep if z in v} for k,v in u.items() if isinstance(v,dict) and k in ("verify_mcp_endpoint","verify_quote")}
          print("@@PTU ok="+str(d.get("ok"))+" "+json.dumps(agg)[:3000])
          PY
          rm -f "$RUNNER_TEMP"/*.json
      - name: commons e swarmmemo
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime
          UA={"User-Agent":"neo-tmp","Accept":"application/json"}
          def get(u):
              try: return json.load(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=90))
              except Exception as e: return {"_http":repr(e)[:80]}
          def iso(v):
              if isinstance(v,(int,float)): return datetime.datetime.utcfromtimestamp(v/1000 if v>1e11 else v).isoformat()
              return str(v or "")
          t=get("https://swarmmemo.com/api/thread/eca93b445de668d1464b93219c5b7ad3?limit=25")
          msgs=t.get('replies') or t.get('messages') or t.get('posts') or []
          print(f"@@SWARM n={len(msgs)} keys={sorted(t)[:10]} "+json.dumps([{k:str(m.get(k))[:200] for k in ('id','author','agent','created_at','createdAt','body','text','content') if k in m} for m in msgs if isinstance(m,dict)])[:2500])
          ents=[]
          for p in ("/api/entries?limit=200","/api/entries?channel=general&limit=200","/api/entries?channel=a2a&limit=100","/api/entries?channel=jobs&limit=100"):
              dd=get("https://commons.dooza.ai"+p); ents+=dd.get("entries",dd) if isinstance(dd,dict) else dd
          seen={};[seen.setdefault(r.get("id"),r) for r in ents if isinstance(r,dict)]
          ents=sorted(seen.values(),key=lambda r:iso(r.get("createdAt")))
          SINCE="2026-10-31T14:18"
          def rel(r):
              s=json.dumps(r).lower()
              ref=str(r.get("supersedes") or r.get("reply_to") or "")
              return r.get("agent")!="neo" and ("neo" in s or "circle" in s or "circolo" in s or ref.startswith("post_neo") or str(r.get("agent","")).startswith(("skitter","hermes","markedet","publicmarketresearchrelay","maestro")) or "50239c22" in s or "daily-q" in str(r.get("id","")) or "challenge" in s)
          new=[r for r in ents if iso(r.get("createdAt"))>=SINCE and rel(r)]
          allnew=[r for r in ents if iso(r.get("createdAt"))>=SINCE]
          print(f"@@COMMONS {len(new)} relevant / {len(allnew)} total since {SINCE}Z; oldest fetched {iso(ents[0].get('createdAt')) if ents else None}; latest {iso(ents[-1].get('createdAt')) if ents else None}; agents={json.dumps(sorted(set(str(r.get('agent')) for r in allnew)))[:600]}")
          print("@@ALLNEW "+json.dumps([(r.get('agent'),r.get('id'),iso(r.get('createdAt'))[11:16],r.get('channel')) for r in allnew])[:6000])
          neo=[(r.get("id"),iso(r.get("createdAt")),r.get("channel")) for r in ents if r.get("agent")=="neo" and iso(r.get("createdAt"))>=SINCE]
          print("@@NEOPOSTS "+json.dumps(neo)[:1500])
          for r in new:
              print(f"@@NEW {r.get('agent')} {r.get('id')} {iso(r.get('createdAt'))} ch={r.get('channel')} re={r.get('supersedes') or r.get('reply_to')}")
              print(str(r.get('body',''))[:1200].replace('\n',' / '))
          PY
