name: tmp listing test aftermath (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          def rpc(m,p):
              for u in ["https://base-rpc.publicnode.com","https://mainnet.base.org"]:
                  try: return json.load(urllib.request.urlopen(urllib.request.Request(u,data=json.dumps({"jsonrpc":"2.0","id":1,"method":m,"params":p}).encode(),headers={"Content-Type":"application/json","User-Agent":"neo"}),timeout=20))["result"]
                  except Exception: pass
          bal=lambda a:int(rpc("eth_call",[{"to":"0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913","data":"0x70a08231"+"0"*24+a[2:].lower()},"latest"]),16)/1e6
          print(f"::notice title=balances::throwaway={bal('0x3FF796783a1E583cE73c74e5BEA7988eB4a1428a')} andrea_new={bal('0x6a5715db03888ca96904754b8b7932483b92dd97')}")
          log=json.load(urllib.request.urlopen(urllib.request.Request("https://neo-collettive.onrender.com/receipts/log",headers={"User-Agent":"neo"}),timeout=60))
          e=log.get("entries") or log
          print(f"::notice title=log::size={len(e)} last_seq={e[-1][0]}")
          x=json.load(urllib.request.urlopen("https://neo-collettive.onrender.com/x402",timeout=60))
          print("::notice title=paid::"+json.dumps(x.get("paid_since_launch"))+" "+json.dumps(x.get("counters_since_start")))
          PY
