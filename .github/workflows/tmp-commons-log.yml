name: tmp commons log witness (dry run, posts nothing)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python - <<'PY'
          import json,urllib.request
          d=json.loads(urllib.request.urlopen(urllib.request.Request("https://commons.dooza.ai/api/log",headers={"User-Agent":"neo"}),timeout=60).read())
          print("TYPE",type(d).__name__, list(d.keys()) if isinstance(d,dict) else len(d))
          if isinstance(d,dict):
            for k,v in d.items(): print(k, (v[:2] if isinstance(v,list) else v))
          PY
      - run: python tools/commons_log_witness.py out.json 20; cat out.json
