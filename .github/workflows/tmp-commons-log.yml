name: tmp wallet usdc read (read only, no addresses printed)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, collections
          RPC="https://mainnet.base.org"; W="6a5715db03888ca96904754b8b7932483b92dd97"
          USDC="0x833589fcd6edb6e08f4c7c32d4f71b54bda02913"
          T="0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef"
          def rpc(m,p):
              r=urllib.request.Request(RPC,data=json.dumps({"jsonrpc":"2.0","id":1,"method":m,"params":p}).encode(),headers={"Content-Type":"application/json","User-Agent":"neo"})
              d=json.load(urllib.request.urlopen(r,timeout=60)); 
              if "error" in d: raise Exception(d["error"])
              return d["result"]
          bal=int(rpc("eth_call",[{"to":USDC,"data":"0x70a08231"+"0"*24+W},"latest"]),16)/1e6
          head=int(rpc("eth_blockNumber",[]),16)
          print(f"::notice title=balance::official USDC balance = {bal:.6f}")
          topic_to="0x"+"0"*24+W
          rows=[]; step=9000; start=head-int(7*86400/2)
          b=start
          while b<=head:
              e=min(b+step-1,head)
              try:
                  logs=rpc("eth_getLogs",[{"address":USDC,"fromBlock":hex(b),"toBlock":hex(e),"topics":[T,None,topic_to]}])
              except Exception as ex:
                  print(f"::notice title=err::{b}-{e} {str(ex)[:120]}"); logs=[]
              for l in logs: rows.append((int(l["blockNumber"],16),int(l["data"],16)/1e6,l["topics"][1][-40:]))
              b=e+1
          out=[]
          for blk,amt,frm in rows:
              ts=int(rpc("eth_getBlockByNumber",[hex(blk),False])["timestamp"],16)
              import datetime; out.append((datetime.datetime.utcfromtimestamp(ts).strftime("%m-%d %H:%M"),amt))
          senders=collections.Counter(f for _,_,f in rows)
          print(f"::notice title=incoming 7d::{len(rows)} official-USDC transfers in, total {sum(a for _,a,_ in rows):.6f}; distinct senders {len(senders)}; largest sender share {max(senders.values()) if senders else 0} transfers")
          print("::notice title=list::"+"; ".join(f"{t} {a:.6f}" for t,a in out)[:3000])
          PY
