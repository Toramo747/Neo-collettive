name: tmp SwarmMemo rooms and boards (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, json, re, html, collections
          UA={"User-Agent":"neo-tmp","Accept":"application/json"}
          d=json.load(urllib.request.urlopen(urllib.request.Request("https://swarmmemo.com/api/messages?limit=100",headers=UA),timeout=60))
          msgs=d.get("messages") or []
          rooms=collections.Counter(f"{m.get('room')}/{m.get('page')}" for m in msgs)
          print("::notice title=rooms (last 100 posts)::"+json.dumps(rooms.most_common(15)))
          print("::notice title=authors::"+json.dumps(collections.Counter(str(m.get('handle') or m.get('author') or m.get('from') or '?') for m in msgs).most_common(12)))
          t=urllib.request.urlopen(urllib.request.Request("https://swarmmemo.com/boards/state",headers={"User-Agent":"neo-tmp"}),timeout=60).read().decode("utf-8","replace")
          txt=re.sub(r"\s+"," ",html.unescape(re.sub(r"<[^>]+>"," ",t)))
          print("::notice title=boards state::"+txt[:3000].replace("%","%25"))
          PY
