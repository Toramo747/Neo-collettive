name: tmp x402 lint over discovery (unpaid reads, posts nothing)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python tools/x402_lint.py --discovery out.json 40 || echo "::error title=lint::failed"
          python - <<'PY'
          import json
          d=json.load(open("out.json"))
          bad=[r for r in d["rows"] if r["errors"]]
          for r in bad[:12]:
              print("::notice title=bad "+r["url"][:90]+"::"+json.dumps([f["code"]+": "+f["detail"][:120] for f in r["findings"] if f["level"]!="info"])[:900])
          PY
