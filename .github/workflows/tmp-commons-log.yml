name: tmp traffic read (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          x=json.load(urllib.request.urlopen(urllib.request.Request("https://neo-collettive.onrender.com/x402",headers={"User-Agent":"neo-tmp"}),timeout=90))
          print("::notice title=paid since launch::"+json.dumps({k:[v.get('calls'),v.get('usd'),v.get('last_utc')] for k,v in (x.get('paid_since_launch') or {}).items()}))
          print("::notice title=since restart::"+json.dumps({k:v for k,v in (x.get('counters_since_start') or {}).items() if v}))
          print("::notice title=by service::"+json.dumps({k:{kk:vv for kk,vv in v.items() if vv} for k,v in (x.get('counters_by_service') or {}).items()}))
          h=json.load(urllib.request.urlopen(urllib.request.Request("https://neo-collettive.onrender.com/health",headers={"User-Agent":"neo-tmp"}),timeout=90))
          print(f"::notice title=health::{h.get('status')} {h.get('version')} {str(h.get('commit'))[:7]} uptime={h.get('uptime_seconds') or h.get('uptime')}")
          PY
