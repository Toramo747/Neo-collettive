name: tmp SWH save + wait for requires-field files
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, time
          A="https://archive.softwareheritage.org/api/1/"
          try:
              r=json.load(urllib.request.urlopen(urllib.request.Request(A+"origin/save/git/url/https://github.com/Toramo747/Neo-collettive/",method="POST",headers={"User-Agent":"neo"}),timeout=60))
              print(f"::notice title=save::{r.get('save_request_status')} {r.get('save_task_status')}")
          except Exception as e: print(f"::notice title=save::ERR {e}")
          want={"vectors":"a46435da6c7ed220ac06e078715bf0b4ba127be5","delivery_receipt.py":"4281e630a4ec8e23bf86239e606c981b39f6ae3a"}; t0=time.time()
          while want and time.time()-t0<2400:
              for n,h in list(want.items()):
                  try:
                      d=json.load(urllib.request.urlopen(urllib.request.Request(A+f"content/sha1_git:{h}/",headers={"User-Agent":"neo"}),timeout=60))
                      print(f"::notice title=SWH {n}::FOUND after {int(time.time()-t0)}s length={d.get('length')} status={d.get('status')}"); want.pop(n)
                  except urllib.error.HTTPError: pass
              if want: time.sleep(60)
          for n in want: print(f"::notice title=SWH {n}::NOT YET after 40 min")
          PY
