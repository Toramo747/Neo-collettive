name: tmp test mcp-verify action (self traffic)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - id: sign
        env: {HEARTBEAT_TOKEN: "${{ secrets.NEO_HEARTBEAT_TOKEN }}"}
        run: echo "proof=$(NEO_HEARTBEAT_TOKEN="$HEARTBEAT_TOKEN" python3 self_traffic_auth.py sign-url https://neo-collettive.onrender.com/mcp --marker github-actions-mcp-verify-test)" >> "$GITHUB_OUTPUT"
      - uses: Toramo747/Neo-collettive/actions/mcp-verify@feat/registry-metadata-and-action
        id: v
        env:
          NEO_SELF_TRAFFIC: github-actions-mcp-verify-test
          NEO_SELF_TRAFFIC_PROOF: ${{ steps.sign.outputs.proof }}
        with:
          url: https://neo-collettive.onrender.com/mcp
          fail-on: never
      - run: echo "::notice title=action::ok=${{ steps.v.outputs.ok }}"; head -c 1500 "${{ steps.v.outputs.result }}" | sed 's/^/::notice title=raw::/'
