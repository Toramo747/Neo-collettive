name: tmp controllo mattino 0755 30 (read only, aggregates)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: neo health (service suspended?)
        env:
          NEO_HEARTBEAT_TOKEN: ${{ secrets.NEO_HEARTBEAT_TOKEN }}
        run: |
          B=https://neo-collettive.onrender.com
          for p in /health /x402; do
            PROOF=$(python3 self_traffic_auth.py sign-url "$B$p" --marker morning-check)
            curl --silent --max-time 60 -H "X-MYCELIX-Self-Traffic: morning-check" -H "X-MYCELIX-Self-Traffic-Proof: ${PROOF}" "$B$p" -o "$RUNNER_TEMP/r.json" -w "::notice title=http $p::code=%{http_code} type=%{content_type} bytes=%{size_download} t=%{time_total}\n" || true
            echo "::notice title=body $p::$(head -c 200 "$RUNNER_TEMP/r.json" | tr -d '\n' | sed 's/%/%25/g')"
          done
          rm -f "$RUNNER_TEMP"/r.json
      - name: swarmmemo
        run: |
          python3 - <<'PY'
          import json, urllib.request
          UA={"User-Agent":"neo-tmp","Accept":"application/json"}
          enc=lambda s: str(s).replace('%','%25').replace('\r','').replace('\n','%0A')
          def get(u):
              try: return json.load(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=90))
              except Exception as e: return {"_http":repr(e)[:80]}
          t=get("https://swarmmemo.com/api/thread/eca93b445de668d1464b93219c5b7ad3?limit=25")
          msgs=t.get('replies') or t.get('messages') or t.get('posts') or []
          print(f"::notice title=swarmmemo thread::n={len(msgs)} keys={sorted(t)[:10]} "+enc(json.dumps([{k:str(m.get(k))[:200] for k in ('id','author','agent','created_at','createdAt','body','text','content') if k in m} for m in msgs if isinstance(m,dict)])[:2500]))
          PY
      - name: commons
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime
          UA={"User-Agent":"neo-tmp","Accept":"application/json"}
          enc=lambda s: str(s).replace('%','%25').replace('\r','').replace('\n','%0A')
          def get(u):
              try: return json.load(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=90))
              except Exception as e: return {"_http":repr(e)[:80]}
          def iso(v):
              if isinstance(v,(int,float)): return datetime.datetime.utcfromtimestamp(v/1000 if v>1e11 else v).isoformat()
              return str(v or "")
          ents=[]
          for p in ("/api/entries?limit=200","/api/entries?channel=general&limit=200","/api/entries?channel=a2a&limit=100","/api/entries?channel=jobs&limit=100","/api/entries?channel=knowledge&limit=100"):
              dd=get("https://commons.dooza.ai"+p); ents+=dd.get("entries",dd) if isinstance(dd,dict) else dd
          seen={};[seen.setdefault(r.get("id"),r) for r in ents if isinstance(r,dict)]
          ents=sorted(seen.values(),key=lambda r:iso(r.get("createdAt")))
          SINCE="2026-10-29T19:43"
          def rel(r):
              s=json.dumps(r).lower()
              ref=str(r.get("supersedes") or r.get("reply_to") or "")
              return r.get("agent")!="neo" and ("neo" in s or "circle" in s or "circolo" in s or ref.startswith("post_neo") or str(r.get("agent","")).startswith(("skitter","hermes","markedet","publicmarketresearchrelay","pmrr","maestro")) or "50239c22" in s or "daily-q" in str(r.get("id","")) or "challenge" in s or "question of the day" in s or "qotd" in s)
          new=[r for r in ents if iso(r.get("createdAt"))>=SINCE and rel(r)]
          allnew=[r for r in ents if iso(r.get("createdAt"))>=SINCE]
          direct=[r.get("id") for r in allnew if "neo" in json.dumps(r).lower() and r.get("agent")!="neo"]
          print(f"::notice title=commons::{len(new)} relevant / {len(allnew)} total since {SINCE}Z; latest {iso(ents[-1].get('createdAt')) if ents else None}; direct-neo={json.dumps(direct)[:400]}; agents={json.dumps(sorted(set(str(r.get('agent')) for r in allnew)))[:500]}")
          neo=[(r.get("id"),iso(r.get("createdAt")),r.get("channel")) for r in ents if r.get("agent")=="neo" and iso(r.get("createdAt"))>=SINCE]
          print("::notice title=neo posts::"+json.dumps(neo)[:800])
          ch=[f"## {r.get('agent')} {r.get('id')} {iso(r.get('createdAt'))} ch={r.get('channel')} re={r.get('supersedes') or r.get('reply_to')}%0A"+enc(str(r.get('body',''))[:700]) for r in new]
          for i in range(0,min(len(ch),24),3): print(f"::notice title=new {i//3+1}::"+"%0A%0A".join(ch[i:i+3]))
          PY
