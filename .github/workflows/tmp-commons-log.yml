name: tmp live check of new features (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          pip install -q cryptography
          python3 - <<'PY'
          import json, urllib.request, base64
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          B="https://neo-collettive.onrender.com"; UA={"User-Agent":"neo-tmp"}
          def get(p):
              try: r=urllib.request.urlopen(urllib.request.Request(B+p,headers=UA),timeout=120); return r.status, json.load(r)
              except urllib.error.HTTPError as e: return e.code, {}
          h=get("/health")[1]; print(f"::notice title=health::{h.get('version')} {str(h.get('commit'))[:7]}")
          pub=get("/.well-known/agent-card.json")[1]["receipt_signing"]["public_key_b64"]
          def ver(o):
              o=dict(o); s=o.pop("signature"); 
              try: Ed25519PublicKey.from_public_bytes(base64.b64decode(pub)).verify(base64.urlsafe_b64decode(s+"=="),json.dumps(o,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()); return True
              except Exception: return False
          print(f"::notice title=credits view::{get('/receipts/credits')[0]} count={get('/receipts/credits')[1].get('count')}")
          for n in ("timestamp","delivery-receipt-verify","injection-scan"):
              st,d=get(f"/x402/{n}/sample")
              print(f"::notice title=sample {n}::{st} sig_ok={ver(d) if d.get('signature') else None} seq={(d.get('receipt') or {}).get('log',{}).get('seq')} scope={'scope' in d}")
          st,d=get("/x402"); print(f"::notice title=catalog::sample_links={sum(1 for s in d.get('services',[]) if s.get('sample'))}")
          try: urllib.request.urlopen(urllib.request.Request(B+"/x402/timestamp",data=b"{}",method="POST",headers={"Content-Type":"application/json"}),timeout=60)
          except urllib.error.HTTPError as e: print(f"::notice title=paid route::{e.code}")
          PY
