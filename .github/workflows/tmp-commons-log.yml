name: tmp swh check (read only, posts nothing)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          for pair in receipt_cite:41c5ad57f3c6314c72a5451add10df11b01eda83 witness:dd85844b1c9ecd55e20ab8aad7bd424cbbd9ad83 delivery_receipt:fe460d2a2b6efe62b5d5fab691defc878603c997 spec:e522b830b1231fdb9003e15b23c1c2be0cc41570 vectors:2185d505622f3d1e4c0effbbbde43f66b1ababd3 commons_log_witness:624f827193dcbcaac597a4ac0ca0b0b117144e7c break:fdcb1f686019d7ea7d5cb15371f83ebde0bbc32a quote_verifier:96d6e619f3cca94af61e856614101808260384ce; do
            n=${pair%%:*}; id=${pair#*:}
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://archive.softwareheritage.org/api/1/content/sha1_git:$id/")
            echo "::notice title=swh $n::$code $id"
          done
