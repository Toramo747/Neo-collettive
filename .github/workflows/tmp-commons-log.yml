name: tmp live check offer-receipt-verify (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, base64
          B="https://neo-collettive.onrender.com"; UA={"User-Agent":"neo-tmp"}
          get=lambda p: json.load(urllib.request.urlopen(urllib.request.Request(B+p,headers=UA),timeout=120))
          h=get("/health"); print(f"::notice title=health::{h.get('version')} {str(h.get('commit'))[:7]}")
          try: urllib.request.urlopen(urllib.request.Request(B+"/x402/offer-receipt-verify",data=b"{}",method="POST",headers={"Content-Type":"application/json"}),timeout=60)
          except urllib.error.HTTPError as e:
              a=json.loads(base64.b64decode(e.headers["PAYMENT-REQUIRED"]))["accepts"][0] if e.code==402 else {}
              print(f"::notice title=402::{e.code} amount={a.get('amount')} payTo_ok={str(a.get('payTo','')).lower()=='0x6a5715db03888ca96904754b8b7932483b92dd97'}")
          s=get("/x402/offer-receipt-verify/sample"); v=s.get("verdict",{})
          print(f"::notice title=sample::ok={v.get('ok')} sig={v.get('signature_valid')} auth={v.get('authorization',{}).get('status')} signed={'signature' in s} scope={'scope' in s}")
          print(f"::notice title=catalog::services={len(get('/x402').get('services',[]))} openapi_paths={len(get('/openapi.json')['paths'])}")
          PY
