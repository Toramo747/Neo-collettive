name: tmp live check descriptions (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, base64
          B="https://neo-collettive.onrender.com"; UA={"User-Agent":"neo-tmp"}
          get=lambda p: json.load(urllib.request.urlopen(urllib.request.Request(B+p,headers=UA),timeout=120))
          h=get("/health"); print(f"::notice title=health::{h.get('version')} {str(h.get('commit'))[:7]}")
          o=get("/openapi.json"); d={p.split('/')[2]:(v.get('post') or {}).get('description','')[:60] for p,v in o['paths'].items() if p.startswith('/x402/') and not p.endswith('/sample')}
          print("::notice title=openapi::"+json.dumps(d))
          try: urllib.request.urlopen(urllib.request.Request(B+"/x402/mcp-audit",data=b"{}",method="POST",headers={"Content-Type":"application/json"}),timeout=60)
          except urllib.error.HTTPError as e:
              pr=json.loads(base64.b64decode(e.headers["PAYMENT-REQUIRED"])); a=pr["accepts"][0]
              print(f"::notice title=402 mcp-audit::price={a.get('amount') or a.get('maxAmountRequired')} desc={a.get('description','')[:90]} bazaar={'bazaar' in pr.get('extensions',{})}")
          PY
