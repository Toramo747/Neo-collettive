name: tmp verify pmrr offer (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - run: |
          pip install -q cryptography
          python3 - <<'PY'
          import json, urllib.request, re, importlib.util
          UA={"User-Agent":"neo-tmp","Accept":"application/json"}
          def get(u):
              return json.load(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=90))
          ents=[]
          for p in ("/api/entries?limit=300","/api/entries?channel=general&limit=300"):
              d=get("https://commons.dooza.ai"+p); ents+=d.get("entries",d) if isinstance(d,dict) else d
          e=next((r for r in ents if r.get("id")=="post_pmrr-neo-signed-offer-20261027-1935"),None)
          body=str((e or {}).get("body",""))
          enc=lambda s: s.replace('%','%25').replace('\r','').replace('\n','%0A')
          for i in range(0,len(body),1800): print(f"::notice title=body {i//1800+1}::"+enc(body[i:i+1800]))
          jws=re.search(r"\b(eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)\b",body)
          m=re.search(r"(\{\"scheme\".*?\})\s*(?:\n|$)",body,re.S)
          sp=importlib.util.spec_from_file_location("orr","tools/x402_offer_receipt.py"); orr=importlib.util.module_from_spec(sp); sp.loader.exec_module(orr)
          if jws:
              acc=None
              if m:
                  try: acc=json.loads(m.group(1))
                  except Exception as ex: print("::notice title=accept parse::"+str(ex)[:200])
              try:
                  v=orr.verify(jws.group(1),"offer",accepts=acc)
                  print("::notice title=verify offer::"+enc(json.dumps(v)[:3500]))
              except Exception as ex:
                  print("::notice title=verify error::"+enc(repr(ex)[:500]))
          else:
              print("::notice title=jws::not found in body")
          PY
