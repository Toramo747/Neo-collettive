name: tmp live check counters (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          B="https://neo-collettive.onrender.com"; UA={"User-Agent":"neo-tmp"}
          h=json.load(urllib.request.urlopen(urllib.request.Request(B+"/health",headers=UA),timeout=90)); print(f"::notice title=health::{h.get('version')} {str(h.get('commit'))[:7]}")
          x=json.load(urllib.request.urlopen(urllib.request.Request(B+"/x402",headers=UA),timeout=90))
          print(f"::notice title=x402::samples={x.get('samples_served_since_launch')} suggestions={x.get('suggestions_received')} suggest_link={'suggest' in x}")
          try: urllib.request.urlopen(urllib.request.Request(B+"/x402/suggest",data=b'{"want":"x"}',method="POST",headers={"Content-Type":"application/json"}),timeout=60)
          except urllib.error.HTTPError as e: print(f"::notice title=suggest validation::{e.code} (expected 400, nothing stored)")
          PY
