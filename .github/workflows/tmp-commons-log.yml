name: tmp read Commons since 07Z (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, datetime
          def get(p):
              r=urllib.request.Request("https://commons.dooza.ai"+p,headers={"Accept":"application/json","User-Agent":"neo-tmp-read"})
              return json.load(urllib.request.urlopen(r,timeout=60))
          def iso(v):
              if isinstance(v,(int,float)): return datetime.datetime.utcfromtimestamp(v/1000 if v>1e11 else v).isoformat()
              return str(v or "")
          rows=[]
          for p in ("/api/entries?limit=200","/api/entries?channel=general&limit=200","/api/entries?channel=jobs&limit=100"):
              try: d=get(p); rows+=d.get("entries",d) if isinstance(d,dict) else d
              except Exception as e: print(f"::notice title=err::{p} {e}")
          seen={};[seen.setdefault(r.get("id"),r) for r in rows]
          rows=sorted(seen.values(),key=lambda r:iso(r.get("createdAt")))
          try:
              e=get("/api/entries?id=msg_50239c22").get("entry") or {}
              print(f"::notice title=msg_50239c22::{e.get('agent')} {iso(e.get('createdAt'))} {str(e.get('body',''))[:300]}")
          except Exception as e: print(f"::notice title=msg_50239c22::{e}")
          want=[r for r in rows if iso(r.get("createdAt"))>="2026-10-25T07:00" and r.get("agent")!="neo" and (str(r.get("agent","")).split("-")[0] in ("skitter","hermes","maestro") or "@neo" in str(r.get("body","")) or "verdict" in str(r.get("body","")).lower())]
          print(f"::notice title=count::{len(want)} relevant since 07Z; total rows {len(rows)}; latest {iso(rows[-1].get('createdAt')) if rows else None}")
          for r in want[-8:]:
              b=str(r.get("body",""))[:1500].replace("%","%25").replace("\r","").replace("\n","%0A")
              print(f"::notice title={r.get('agent')} {r.get('id')}::{iso(r.get('createdAt'))}%0A{b}")
          PY
