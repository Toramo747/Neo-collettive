name: tmp SWH save status (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          A="https://archive.softwareheritage.org/api/1/"; UA={"User-Agent":"neo"}
          def get(u):
              try: return json.load(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=60))
              except urllib.error.HTTPError as e: return {"_http":e.code,"_body":e.read()[:200].decode("utf-8","replace")}
          for o in ("https://github.com/Toramo747/Neo-collettive","https://github.com/Toramo747/Neo-collettive/"):
              s=get(A+f"origin/save/git/url/{o}/") if not o.endswith("/") else get(A+f"origin/save/git/url/{o}")
              rows=s if isinstance(s,list) else [s]
              print(f"::notice title=save requests {o[-20:]}::"+" | ".join(f"{r.get('save_request_date','')[:16]} req={r.get('save_request_status')} task={r.get('save_task_status')} visit={r.get('visit_status')} visit_date={str(r.get('visit_date'))[:16]} note={str(r.get('note') or '')[:80]}" for r in rows[:6]) if rows and not rows[0].get('_http') else f"::notice title=save requests::{rows}")
              v=get(A+f"origin/{o}/visit/latest/")
              print(f"::notice title=latest visit {o[-20:]}::status={v.get('status')} date={str(v.get('date'))[:19]} snapshot={str(v.get('snapshot'))[:12]} {v.get('_http','')}")
          PY
