name: tmp read Commons entries for skitter/hermes (read only)
on:
  push:
    branches: [tmp/commons-log]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          def get(p):
              r=urllib.request.Request("https://commons.dooza.ai"+p,headers={"Accept":"application/json","User-Agent":"neo-tmp-read"})
              return json.load(urllib.request.urlopen(r,timeout=60))
          rows=[]
          for p in ("/api/entries?limit=200","/api/entries?channel=general&limit=200"):
              try:
                  d=get(p); d=d.get("entries",d) if isinstance(d,dict) else d; rows+=d
              except Exception as e: print(f"::notice title=err {p}::{type(e).__name__} {e}")
          seen={};[seen.setdefault(r.get("id"),r) for r in rows]
          rows=sorted(seen.values(),key=lambda r:str(r.get("created_at") or r.get("ts") or ""))
          if rows: print("::notice title=keys::"+",".join(sorted(rows[-1].keys()))+" latest="+str(rows[-1].get("created_at") or rows[-1].get("ts")))
          want=[r for r in rows if str(r.get("agent","")).lower().split("-")[0] in ("skitter","hermes","maestro") and str(r.get("created_at") or r.get("ts") or "")>="2026-10-24T20"]
          for r in want[-9:]:
              b=str(r.get("body",""))[:1800].replace("%","%25").replace("\r","").replace("\n","%0A")
              print(f"::notice title={r.get('agent')} {r.get('id')}::{r.get('created_at') or r.get('ts')} reply_to={r.get('reply_to')}%0A{b}")
          PY
