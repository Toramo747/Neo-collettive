name: Fact-card mind, shadow mode for verification messages (Kaggle GPU, drafts only, private)
# 22/10 (Andrea's OK): Qwen 3.8 27B + fact cards + verify_quote run by the code + code and meaning checks.
# Never posts. Drafts go to the private archive next to the other mind's, and are graded the same way.
on:
  schedule:
    - cron: "11 */2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kaggle-gpu
  cancel-in-progress: false
jobs:
  shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --quiet --require-hashes -r requirements.lock && python -m pip install --quiet "kaggle>=1.8.0"
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.MODEL_LABEL_REPO }}
          token: ${{ secrets.MODEL_LABEL_REPO_TOKEN }}
          path: private-labels
      - name: Draft on Kaggle (never over a queued run; quota tracked)
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set +e -uo pipefail
          K="$KAGGLE_USERNAME/neo-fact-shadow"
          kstatus() { kaggle kernels status "$K" 2>&1 | grep -oiE 'complete|error|cancel[a-z]*|queued|running' | head -1 | tr 'A-Z' 'a-z' || true; }
          prev=$(kstatus); echo "::notice title=fact shadow::previous kernel status=${prev:-none}"
          case "$prev" in queued|running) echo "::notice title=fact shadow::previous run still ${prev}"; exit 0 ;; esac
          python tools/fact_shadow.py pending private-labels /tmp/set.json; rc=$?
          [ "$rc" = "0" ] || exit 0
          python tools/mi_deep.py quota private-labels || { echo "::warning title=fact shadow::GPU quota guard says no"; exit 0; }
          python tools/fact_actions.py enrich /tmp/set.json /tmp/set-enriched.json
          python -c "import sys; sys.path.insert(0,'tools'); import fact_mind_kaggle as k; sys.exit(k.build('/tmp/set-enriched.json','kernel','$KAGGLE_USERNAME', k.MODEL, 'neo-fact-shadow', ('compose',), 'fact_shadow.json'))"
          start=$(date +%s)
          kaggle kernels push -p kernel --accelerator NvidiaTeslaT4 >/dev/null 2>&1 || { echo "::error title=fact shadow::push failed"; exit 1; }
          status=""
          for i in $(seq 1 140); do sleep 30; status=$(kstatus); case "$status" in complete|error|cancel*) break ;; esac; done
          minutes=$(( ($(date +%s) - start) / 60 ))
          echo "::notice title=fact shadow::status=${status:-unknown} wall_minutes=$minutes"
          if [ "$status" = "complete" ]; then
            rm -rf out; kaggle kernels output "$K" -p out >/dev/null 2>&1
            [ -f out/fact_shadow.json ] && python tools/fact_shadow.py collect out/fact_shadow.json private-labels
          fi
          python - "$minutes" <<'PY2'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path("private-labels/market-intuition/deep_usage.json")
          u = json.loads(p.read_text()) if p.exists() else {}
          y, w, _ = datetime.now(timezone.utc).isocalendar(); k = f"{y}-W{w:02d}"
          u[k] = round(float(u.get(k, 0)) + float(sys.argv[1]), 1); p.write_text(json.dumps(u))
          PY2
          rm -rf out kernel
          git -C private-labels config user.name "NEO Fact Mind"
          git -C private-labels config user.email "actions@users.noreply.github.com"
          git -C private-labels add common/drafts common/factmind market-intuition/deep_usage.json
          git -C private-labels commit --quiet -m "common: fact-card mind shadow drafts (private)" || exit 0
          for a in 1 2 3 4; do git -C private-labels pull --quiet --rebase && git -C private-labels push --quiet && exit 0; sleep $((a*5)); done
          exit 1
