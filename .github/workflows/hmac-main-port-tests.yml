name: HMAC main-port tests

on:
  push:
    branches:
      - mycelix-hmac-main-port-20260929
    paths:
      - "self_traffic_auth.py"
      - "inbound_traffic.py"
      - "cloud_mcp.py"
      - "test_self_traffic_hmac_port.py"
      - "test_inbound_traffic.py"
      - ".github/workflows/hmac-main-port-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install locked test dependencies
        run: python -m pip install -r requirements.lock
      - name: Run HMAC hardening tests
        run: python -m unittest -v test_self_traffic_hmac_port.py test_inbound_traffic.py
