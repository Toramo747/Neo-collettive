name: NEO Heartbeat

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neo-heartbeat
  cancel-in-progress: false

jobs:
  wake-neo:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake NEO
        env:
          HEARTBEAT_URL: https://neo-collettive.onrender.com/api/heartbeat
          HEARTBEAT_TOKEN: ${{ secrets.NEO_HEARTBEAT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${HEARTBEAT_TOKEN}" ]; then
            curl --fail --show-error --silent \
              --retry 2 --retry-delay 5 --max-time 90 \
              -H "X-NEO-Heartbeat-Token: ${HEARTBEAT_TOKEN}" \
              "${HEARTBEAT_URL}"
          else
            curl --fail --show-error --silent \
              --retry 2 --retry-delay 5 --max-time 90 \
              "${HEARTBEAT_URL}"
          fi
