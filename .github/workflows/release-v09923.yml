name: Release Current Version

on:
  workflow_run:
    workflows: ["NEO Render Deploy"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve release version from source
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re
          s=open("cloud_mcp.py",encoding="utf-8").read()
          m=re.search(r'^VERSION = "([^"]+)"',s,re.M)
          if not m:
              raise SystemExit("VERSION not found in cloud_mcp.py")
          version=m.group(1).strip()
          if not re.fullmatch(r'\d+\.\d+\.\d+',version):
              raise SystemExit("invalid release VERSION: "+version)
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as fh:
              fh.write("RELEASE_VERSION="+version+"\n")
          print("release_version="+version)
          PY

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "${tag} release already exists"
            exit 0
          fi
          gh release create "${tag}" \
            --target "${TARGET_SHA}" \
            --title "${tag}" \
            --notes "Relicensed under BUSL 1.1 — (c) 2026 Andrea Gava"
