name: Release Current Version

on:
  workflow_run:
    workflows: ["NEO Render Deploy"]
    types: [completed]

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      actions: write
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Ensure this is the latest release-relevant deploy
        id: freshness
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          latest="$(git log -1 --format=%H origin/main -- cloud_mcp.py mcp_endpoint_verifier.py server.json)"
          echo "target_sha=${TARGET_SHA}"
          echo "latest_release_relevant_sha=${latest}"
          if [ "${TARGET_SHA}" != "${latest}" ]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "A newer release-relevant commit exists; skip this stale deploy release."
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Resolve release version from source
        if: steps.freshness.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re
          s=open("cloud_mcp.py",encoding="utf-8").read()
          m=re.search(r'^VERSION = "([^"]+)"',s,re.M)
          if not m:
              raise SystemExit("VERSION not found in cloud_mcp.py")
          version=m.group(1).strip()
          if not re.fullmatch(r'\d+\.\d+\.\d+',version):
              raise SystemExit("invalid release VERSION: "+version)
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as fh:
              fh.write("RELEASE_VERSION="+version+"\n")
          print("release_version="+version)
          PY

      - name: Create tag and GitHub release
        if: steps.freshness.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "${tag} release already exists"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} tag already exists"
            git fetch --tags origin
          else
            echo "Creating lightweight tag ${tag} at ${TARGET_SHA}"
            git tag "${tag}" "${TARGET_SHA}"
            git push origin "refs/tags/${tag}"
          fi
          gh release create "${tag}" \
            --verify-tag \
            --title "${tag}" \
            --notes "Relicensed under BUSL 1.1 — (c) 2026 Andrea Gava"

      - name: Publish current version to official MCP Registry
        if: steps.freshness.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          gh workflow run publish-mcp-registry.yml --ref "${tag}"
          echo "official MCP Registry publication dispatched for ${tag}"
