name: NEO Docker Build Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/neo-docker-build-check.yml"

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build production Docker image
        run: |
          set -euo pipefail
          docker build --pull --no-cache -t neo-build-check .
