name: Common ensemble experiment (GitHub CPU, all models in parallel)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verdict | evidence"
        required: false
        default: evidence
      bench:
        description: "bench file in the private archive (default common/bench/claims-v1.json)"
        required: false
        default: ""
      voice:
        description: "facts sheet in this repo (default docs/common-voice.md)"
        required: false
        default: ""
      num_ctx:
        description: "model context window in tokens (default: ollama's own)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  judge:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        model: ["qwen2.5:14b-instruct-q4_K_M", "llama3.1:8b", "gemma2:9b"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.MODEL_LABEL_REPO }}
          token: ${{ secrets.MODEL_LABEL_REPO_TOKEN }}
          path: private-labels
      - name: Free disk for the model
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true; df -h / | tail -1
      - name: Ollama on CPU
        run: |
          curl -fsSL https://ollama.com/install.sh | sh >/dev/null 2>&1
          (ollama serve >/dev/null 2>&1 &) ; sleep 5
          ollama pull "${{ matrix.model }}" >/dev/null 2>&1
          ollama list | tail -n +2 | awk '{print "::notice title=model::"$1" "$3$4}'
      - name: Judge the bench (verdicts only)
        env:
          NEO_BENCH: ${{ inputs.bench || '' }}
          NEO_VOICE: ${{ inputs.voice || '' }}
          NEO_NUM_CTX: ${{ inputs.num_ctx || '' }}
        run: |
          slug=$(echo "${{ matrix.model }}" | tr ':.' '--')
          python3 tools/common_ensemble.py judge private-labels "${{ matrix.model }}" "verdicts-$slug.json" "${{ inputs.mode || 'evidence' }}"
          echo "SLUG=$slug" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: verdicts-${{ env.SLUG }}
          path: verdicts-${{ env.SLUG }}.json
          retention-days: 1
  combine:
    needs: judge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.MODEL_LABEL_REPO }}
          token: ${{ secrets.MODEL_LABEL_REPO_TOKEN }}
          path: private-labels
      - uses: actions/download-artifact@v4
        with: {path: v, merge-multiple: true}
      - env:
          NEO_BENCH: ${{ inputs.bench || '' }}
        run: |
          set -euo pipefail
          python3 tools/common_ensemble.py merge ensemble.json v/*.json
          python3 tools/common_ensemble.py collect private-labels ensemble.json
          git -C private-labels config user.name "NEO Ensemble"
          git -C private-labels config user.email "actions@users.noreply.github.com"
          git -C private-labels add common/bench
          git -C private-labels commit --quiet -m "common: ensemble result, CPU run (private)" || exit 0
          for attempt in 1 2 3 4; do
            git -C private-labels pull --quiet --rebase && git -C private-labels push --quiet && exit 0
            sleep $((attempt*5))
          done
          exit 1
