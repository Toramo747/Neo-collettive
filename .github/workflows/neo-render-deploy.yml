# forced redeploy for NEO v0.56.0
name: NEO Render Deploy

on:
  workflow_dispatch:
    inputs:
      extended_validation:
        description: "Run outbound/effectful extended post-deploy validation"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "cloud_mcp.py"
      - "route_policy.py"
      - "test_route_policy.py"
      - "test_route_auth_runtime.py"
      - "test_mcp_route_auth.py"
      - "arena_core.py"
      - "arena_micelio.py"
      - "arena_evolution.py"
      - "arena_registry_world.py"
      - "arena_local_llm_probe.py"
      - "test_arena_local_llm_probe.py"
      - ".github/workflows/neo-arena-local-llm.yml"
      - "test_arena_registry_world.py"
      - "test_arena_evolution.py"
      - "data/arena/evolution.json"
      - "test_arena_micelio.py"
      - "data/arena/micelio.json"
      - "test_arena_core.py"
      - ".github/workflows/neo-arena.yml"
      - "a2a_peer.py"
      - "test_a2a_peer.py"
      - "test_peer_refusal.py"
      - "inbound_security.py"
      - "test_inbound_security.py"
      - "venture_measurement.py"
      - "test_venture_measurement.py"
      - "test_discovery_v3.py"
      - "discovery_v3.py"
      - "test_runtime_boundary.py"
      - "runtime_boundary.py"
      - "runtime_profile.json"
      - "state_recovery.py"
      - "test_state_recovery.py"
      - "inbound_interview.py"
      - "test_inbound_interview.py"
      - "trust_lab.py"
      - "test_intent_discovery.py"
      - "intent_discovery.py"
      - "test_agent_demand.py"
      - "agent_demand.py"
      - "test_agent_chat.py"
      - "inbound_traffic.py"
      - "test_inbound_traffic.py"
      - "agent_chat.py"
      - "test_trust_lab.py"
      - "inbound_recovery_seed.json"
      - "seti_radar.py"
      - "thesis_control.py"
      - "outcome_control.py"
      - "test_outcome_control.py"
      - "test_thesis_control.py"
      - "test_seti_radar.py"
      - "tool_opportunity.py"
      - "test_tool_opportunity.py"
      - "neo_dialect.py"
      - "neo_dialect_security.py"
      - "neo_dialect_seti_probe.py"
      - "neo_dialect_council.py"
      - "dialect_peer_harness.py"
      - "mcp_endpoint_verifier.py"
      - "test_mcp_endpoint_verifier.py"
      - "registry_health.py"
      - "registry_health_scan.py"
      - "test_registry_health.py"
      - "test_arena_core.py"
      - "data/registry-health/latest-summary.json"
      - "data/registry-health/latest-servers.json"
      - "verify_mcp_endpoint_live_probe.py"
      - "server.json"
      - "test_neo_dialect.py"
      - "test_neo_dialect_security.py"
      - "test_neo_dialect_seti_probe.py"
      - "test_neo_dialect_council.py"
      - "test_dialect_peer_harness.py"
      - "docs/neo-dialect.md"
      - "schemas/neo-dialect/1.0/**"
      - "runtime/neo-dialect-peer-report.json"
      - "requirements.lock"
      - "neo_policy.json"
      - "render.yaml"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/neo-render-deploy.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: neo-render-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate source before deploy
        run: |
          set -euo pipefail
          python -m py_compile cloud_mcp.py jarvis_service/app.py
          python -m json.tool neo_policy.json >/dev/null
          python -m json.tool runtime_profile.json >/dev/null
          python - <<'PY'
          from runtime_boundary import load_runtime_profile
          p=load_runtime_profile()
          print("runtime_profile="+p["profile_id"]+" fingerprint="+p["config_fingerprint"])
          PY
          python - <<'PY'
          import ast
          for path in ("cloud_mcp.py","jarvis_service/app.py"):
              tree=ast.parse(open(path,encoding="utf-8").read(),filename=path)
              bad=[n.id for n in ast.walk(tree) if isinstance(n,ast.Name) and n.id in {"true","false","null"}]
              if bad:
                  raise SystemExit(f"{path}: JSON literal used as Python name: {sorted(set(bad))}")
          print("source runtime-literal validation passed")
          PY

      - name: Install locked test dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock

      - name: Run regression tests
        run: |
          set -euo pipefail
          python -m unittest -v test_evidence_integrity.py test_seti_radar.py test_tool_opportunity.py test_thesis_control.py test_outcome_control.py test_discovery_v3.py test_state_recovery.py test_inbound_interview.py test_trust_lab.py test_intent_discovery.py test_agent_demand.py test_agent_chat.py test_inbound_traffic.py test_runtime_boundary.py test_a2a_peer.py test_peer_refusal.py test_inbound_security.py test_venture_measurement.py test_neo_dialect.py test_neo_dialect_security.py test_neo_dialect_seti_probe.py test_neo_dialect_council.py test_dialect_peer_harness.py test_mcp_endpoint_verifier.py test_registry_health.py test_arena_core.py test_arena_micelio.py test_arena_evolution.py test_arena_registry_world.py

      - name: Build Docker image in GitHub CI
        run: |
          set -euo pipefail
          docker build --pull -t neo-ci .

      - name: Resolve expected NEO version
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          s=open("cloud_mcp.py",encoding="utf-8").read()
          m=re.search(r'^VERSION = "([^"]+)"',s,re.M)
          if not m:
              raise SystemExit("VERSION not found")
          open("/tmp/neo_version","w").write(m.group(1))
          print("expected_version="+m.group(1))
          PY

      - name: Validate Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          [ -n "$RENDER_DEPLOY_HOOK" ] || { echo "Missing GitHub secret: RENDER_DEPLOY_HOOK"; exit 2; }

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          sep='?'
          case "$RENDER_DEPLOY_HOOK" in *\?*) sep='&' ;; esac
          deploy_url="${RENDER_DEPLOY_HOOK}${sep}ref=${GITHUB_SHA}"
          curl --fail --show-error --silent --max-time 60 "$deploy_url" > /tmp/deploy.txt
          cat /tmp/deploy.txt || true

      - name: Wait for expected NEO version
        run: |
          set -euo pipefail
          expected="$(cat /tmp/neo_version)"
          render_ready=1
            if [ "$render_ready" -eq 1 ] && curl --fail --silent --show-error -H "X-MYCELIX-Self-Traffic: github-actions-deploy" -H "X-MYCELIX-Self-Traffic-Proof: $(NEO_HEARTBEAT_TOKEN="${HEARTBEAT_TOKEN}" python self_traffic_auth.py sign-url 'https://neo-collettive.onrender.com/health' --marker github-actions-deploy)" --max-time 30 \
              "https://neo-collettive.onrender.com/health" > /tmp/health.json; then
              cat /tmp/health.json
              if EXPECTED="$expected" python - <<'PY'
          import json,os,sys
          d=json.load(open("/tmp/health.json",encoding="utf-8"))
          profile=d.get("runtime_profile") or {}
          ok=(
              str(d.get("version") or "") == os.environ["EXPECTED"]
              and str(d.get("commit") or "") == os.environ.get("GITHUB_SHA","")
              and str(profile.get("profile_id") or "") == "mycelix-prod-main"
              and str(profile.get("deployment_role") or "") == "production"
          )
          sys.exit(0 if ok else 1)
          PY
              then
                echo "NEO v$expected is live on commit $GITHUB_SHA"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "Timed out waiting for NEO v$expected"
          cat /tmp/health.json || true
          exit 5

      - name: Capture public health if version wait fails
        if: failure()
        run: |
          set +e
          curl --silent --show-error --max-time 30 "https://neo-collettive.onrender.com/health" -o /tmp/runtime-health.json
          curl --silent --show-error --max-time 30 "https://neo-collettive.onrender.com/api/checkpoint-status" -o /tmp/checkpoint-status.json
          python - <<'PY'
          import json
          for path in ("/tmp/runtime-health.json","/tmp/checkpoint-status.json"):
              try:
                  d=json.load(open(path,encoding="utf-8"))
              except Exception:
                  continue
              print(path, {k:d.get(k) for k in ("status","version","commit","ok","stored_bytes","limit_bytes","last_checkpoint_utc")})
          PY

      - name: Verify autopilot runtime
        run: |
          set -euo pipefail
          expected="$(cat /tmp/neo_version)"
          curl --fail --silent --show-error -H "X-MYCELIX-Self-Traffic: github-actions-deploy" -H "X-MYCELIX-Self-Traffic-Proof: $(NEO_HEARTBEAT_TOKEN="${HEARTBEAT_TOKEN}" python self_traffic_auth.py sign-url 'https://neo-collettive.onrender.com/api/autonomy/status' --marker github-actions-deploy)" --retry 3 --retry-delay 5 \
            "https://neo-collettive.onrender.com/api/autonomy/status" > /tmp/status.json
          cat /tmp/status.json
          EXPECTED="$expected" python - <<'PY'
          import json,os
          d=json.load(open("/tmp/status.json",encoding="utf-8"))
          ap=d.get("autopilot") or {}
          if str(d.get("neo_version") or "") != os.environ["EXPECTED"]:
              raise SystemExit("wrong runtime version")
          if not ap.get("enabled"):
              raise SystemExit("autopilot disabled")
          print("autopilot enabled; cycles_completed="+str(ap.get("cycles_completed")))
          PY

      - name: Smoke test autonomous subsystems
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "X-MYCELIX-Self-Traffic: github-actions-deploy" -H "X-MYCELIX-Self-Traffic-Proof: $(NEO_HEARTBEAT_TOKEN="${HEARTBEAT_TOKEN}" python self_traffic_auth.py sign-url 'https://neo-collettive.onrender.com/api/memory/status' --marker github-actions-deploy)" --retry 2 --retry-delay 3 \
            "https://neo-collettive.onrender.com/api/memory/status" > /tmp/memory.json
          curl --fail --silent --show-error -H "X-MYCELIX-Self-Traffic: github-actions-deploy" -H "X-MYCELIX-Self-Traffic-Proof: $(NEO_HEARTBEAT_TOKEN="${HEARTBEAT_TOKEN}" python self_traffic_auth.py sign-url 'https://neo-collettive.onrender.com/api/builder/status' --marker github-actions-deploy)" --retry 2 --retry-delay 3 \
            "https://neo-collettive.onrender.com/api/builder/status" > /tmp/builder.json
          curl --fail --silent --show-error -H "X-MYCELIX-Self-Traffic: github-actions-deploy" -H "X-MYCELIX-Self-Traffic-Proof: $(NEO_HEARTBEAT_TOKEN="${HEARTBEAT_TOKEN}" python self_traffic_auth.py sign-url 'https://neo-collettive.onrender.com/api/autonomy/status' --marker github-actions-deploy)" --retry 2 --retry-delay 3 \
            "https://neo-collettive.onrender.com/api/autonomy/status" > /tmp/autonomy.json
          python - <<'PY'
          import json
          m=json.load(open("/tmp/memory.json",encoding="utf-8"))
          b=json.load(open("/tmp/builder.json",encoding="utf-8"))
          a=json.load(open("/tmp/autonomy.json",encoding="utf-8"))
          if not m.get("ok"):
              raise SystemExit("memory endpoint unhealthy")
          if not b.get("ok"):
              raise SystemExit("builder endpoint unhealthy")
          policy=b.get("policy") or {}
          if not policy.get("enabled"):
              raise SystemExit("autonomous builder disabled")
          if not policy.get("allowed_families"):
              raise SystemExit("builder has no allowed families")
          if b.get("external_actions_allowed") is not False:
              raise SystemExit("external action guardrail missing")
          if not a.get("ok"):
              raise SystemExit("autonomy endpoint unhealthy")
          guard=a.get("guardrails") or {}
          if any(bool(guard.get(k)) for k in ("spending","payments","contracts","commercial_outreach","external_publishing","personal_accounts")):
              raise SystemExit("autonomy guardrails unsafe")
          print("memory, builder and autonomy smoke tests passed")
          PY

      - name: Smoke test A2A discovery surface
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "X-MYCELIX-Self-Traffic: github-actions-deploy" -H "X-MYCELIX-Self-Traffic-Proof: $(NEO_HEARTBEAT_TOKEN="${HEARTBEAT_TOKEN}" python self_traffic_auth.py sign-url 'https://neo-collettive.onrender.com/.well-known/agent-card.json' --marker github-actions-deploy)" --retry 2 --retry-delay 3             "https://neo-collettive.onrender.com/.well-known/agent-card.json" > /tmp/agent-card.json
          curl --fail --silent --show-error -H "X-MYCELIX-Self-Traffic: github-actions-deploy" -H "X-MYCELIX-Self-Traffic-Proof: $(NEO_HEARTBEAT_TOKEN="${HEARTBEAT_TOKEN}" python self_traffic_auth.py sign-url 'https://neo-collettive.onrender.com/api/inbound/agents' --marker github-actions-deploy)" --retry 2 --retry-delay 3             "https://neo-collettive.onrender.com/api/inbound/agents" > /tmp/inbound.json
          python - <<'PY'
          import json
          card=json.load(open("/tmp/agent-card.json",encoding="utf-8"))
          inbound=json.load(open("/tmp/inbound.json",encoding="utf-8"))
          interfaces=card.get("supportedInterfaces") or []
          versions={str(x.get("protocolVersion") or "") for x in interfaces if isinstance(x,dict)}
          bindings={str(x.get("protocolBinding") or "") for x in interfaces if isinstance(x,dict)}
          if "1.0" not in versions or "0.3" not in versions:
              raise SystemExit("A2A card does not advertise both 1.0 and 0.3")
          if "JSONRPC" not in bindings:
              raise SystemExit("A2A card missing JSONRPC binding")
          if any(k in card for k in ("protocolVersion","preferredTransport","url")):
              raise SystemExit("legacy top-level A2A fields leaked into v1 Agent Card")
          skills={str(x.get("id") or "") for x in (card.get("skills") or []) if isinstance(x,dict)}
          if "introduce-agent" not in skills or "evidence-validation" not in skills:
              raise SystemExit("A2A discovery skills missing")
          if not inbound.get("ok"):
              raise SystemExit("inbound diagnostics unhealthy")
          discovery=inbound.get("a2a_discovery") or {}
          if discovery.get("registry_enabled") is not True:
              raise SystemExit("public registry advertisement not enabled")
          print("A2A v1 discovery surface smoke test passed")
          PY

      - name: Smoke test neo-dialect surface
        run: |
          set -euo pipefail
          curl --fail --show-error --silent -H "X-MYCELIX-Self-Traffic: github-actions-deploy" -H "X-MYCELIX-Self-Traffic-Proof: $(NEO_HEARTBEAT_TOKEN="${HEARTBEAT_TOKEN}" python self_traffic_auth.py sign-url 'https://neo-collettive.onrender.com/neo-dialect/1.0' --marker github-actions-deploy)" --max-time 30             "https://neo-collettive.onrender.com/neo-dialect/1.0" > /tmp/neo-dialect.md
          grep -q "neo-dialect/1.0" /tmp/neo-dialect.md
          curl --fail --show-error --silent -H "X-MYCELIX-Self-Traffic: github-actions-deploy" -H "X-MYCELIX-Self-Traffic-Proof: $(NEO_HEARTBEAT_TOKEN="${HEARTBEAT_TOKEN}" python self_traffic_auth.py sign-url 'https://neo-collettive.onrender.com/.well-known/agent-card.json' --marker github-actions-deploy)" --max-time 30             "https://neo-collettive.onrender.com/.well-known/agent-card.json" > /tmp/agent-card.json
          curl --fail --show-error --silent -H "X-MYCELIX-Self-Traffic: github-actions-deploy" -H "X-MYCELIX-Self-Traffic-Proof: $(NEO_HEARTBEAT_TOKEN="${HEARTBEAT_TOKEN}" python self_traffic_auth.py sign-url 'https://neo-collettive.onrender.com/api/council' --marker github-actions-deploy)" --max-time 30             "https://neo-collettive.onrender.com/api/council" > /tmp/council.json
          curl --fail --show-error --silent -H "X-MYCELIX-Self-Traffic: github-actions-deploy" -H "X-MYCELIX-Self-Traffic-Proof: $(NEO_HEARTBEAT_TOKEN="${HEARTBEAT_TOKEN}" python self_traffic_auth.py sign-url 'https://neo-collettive.onrender.com/council/neo-dialect/example' --marker github-actions-deploy)" --max-time 30             "https://neo-collettive.onrender.com/council/neo-dialect/example" > /tmp/dialect-example.json
          python - <<'PY'
          import json
          card=json.load(open("/tmp/agent-card.json",encoding="utf-8"))
          council=json.load(open("/tmp/council.json",encoding="utf-8"))
          example=json.load(open("/tmp/dialect-example.json",encoding="utf-8"))
          extensions=((card.get("capabilities") or {}).get("extensions") or [])
          if not any(str(x.get("params",{}).get("dialect_version") or "")=="neo-dialect/1.0" for x in extensions if isinstance(x,dict)):
              raise SystemExit("neo-dialect extension missing from Agent Card")
          d=council.get("neo_dialect") or {}
          if str(d.get("dialect_version") or "")!="neo-dialect/1.0":
              raise SystemExit("neo-dialect council report missing")
          types=[x.get("message",{}).get("type") for x in (example.get("transcript") or [])]
          if types != ["HELLO","CAPABILITIES","PROPOSE","COUNTER","AGREE","RESULT","BYE"]:
              raise SystemExit("neo-dialect example transcript incomplete")
          print("neo-dialect smoke passed")
          PY

      - name: Smoke test Registry Health static pages
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "X-MYCELIX-Self-Traffic: github-actions-deploy" -H "X-MYCELIX-Self-Traffic-Proof: $(NEO_HEARTBEAT_TOKEN="${HEARTBEAT_TOKEN}" python self_traffic_auth.py sign-url 'https://neo-collettive.onrender.com/registry-health' --marker github-actions-deploy)" --max-time 30 \
            "https://neo-collettive.onrender.com/registry-health" > /tmp/registry-health.html
          curl --fail --silent --show-error -H "X-MYCELIX-Self-Traffic: github-actions-deploy" -H "X-MYCELIX-Self-Traffic-Proof: $(NEO_HEARTBEAT_TOKEN="${HEARTBEAT_TOKEN}" python self_traffic_auth.py sign-url 'https://neo-collettive.onrender.com/registry-health/about' --marker github-actions-deploy)" --max-time 30 \
            "https://neo-collettive.onrender.com/registry-health/about" > /tmp/registry-health-about.html
          grep -q "MCP Registry Health" /tmp/registry-health.html
          grep -q "Disabled pending Andrea Gava" /tmp/registry-health.html
          grep -q "Opt-out and corrections" /tmp/registry-health-about.html
          if grep -q "Per-server observations" /tmp/registry-health.html; then
            echo "Per-server table unexpectedly enabled" >&2
            exit 1
          fi
          echo "Registry Health aggregate/about surfaces healthy; server table disabled"

      - name: Smoke test NEO Arena read-only surface
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "X-MYCELIX-Self-Traffic: github-actions-deploy" -H "X-MYCELIX-Self-Traffic-Proof: $(NEO_HEARTBEAT_TOKEN="${HEARTBEAT_TOKEN}" python self_traffic_auth.py sign-url 'https://neo-collettive.onrender.com/arena' --marker github-actions-deploy)" --max-time 30 "https://neo-collettive.onrender.com/arena" > /tmp/arena.html
          grep -q "NEO Arena" /tmp/arena.html
          grep -q "mycelix-arena" /tmp/arena.html
          curl --fail --silent --show-error -H "X-MYCELIX-Self-Traffic: github-actions-deploy" -H "X-MYCELIX-Self-Traffic-Proof: $(NEO_HEARTBEAT_TOKEN="${HEARTBEAT_TOKEN}" python self_traffic_auth.py sign-url 'https://neo-collettive.onrender.com/arena/neo-dialect' --marker github-actions-deploy)" --max-time 30 "https://neo-collettive.onrender.com/arena/neo-dialect" > /tmp/arena-neo-dialect.html
          grep -q "neo-dialect evolution study" /tmp/arena-neo-dialect.html
          grep -q "neo-dialect 1.0 is sufficient for now" /tmp/arena-neo-dialect.html
          grep -q "arena-dialect-study-" /tmp/arena-neo-dialect.html
                    curl --fail --silent --show-error -H "X-MYCELIX-Self-Traffic: github-actions-deploy" -H "X-MYCELIX-Self-Traffic-Proof: $(NEO_HEARTBEAT_TOKEN="${HEARTBEAT_TOKEN}" python self_traffic_auth.py sign-url 'https://neo-collettive.onrender.com/arena/micelio' --marker github-actions-deploy)" --max-time 30 "https://neo-collettive.onrender.com/arena/micelio" > /tmp/micelio.html
          grep -q "Micelio" /tmp/micelio.html
          grep -q "Memoria verificata" /tmp/micelio.html
          curl --fail --silent --show-error -H "X-MYCELIX-Self-Traffic: github-actions-deploy" -H "X-MYCELIX-Self-Traffic-Proof: $(NEO_HEARTBEAT_TOKEN="${HEARTBEAT_TOKEN}" python self_traffic_auth.py sign-url 'https://neo-collettive.onrender.com/arena/evoluzione' --marker github-actions-deploy)" --max-time 30 "https://neo-collettive.onrender.com/arena/evoluzione" > /tmp/evoluzione.html
          grep -q "Evoluzione" /tmp/evoluzione.html
          grep -q "promozione automatica" /tmp/evoluzione.html
          echo "Arena, Micelio and Evoluzione read-only surfaces healthy"

      - name: Bootstrap first Arena session for v0.99.34
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$(cat /tmp/neo_version)"
          if [ "$expected" != "0.99.34" ]; then exit 0; fi
          existing="$(gh run list --workflow neo-arena.yml --limit 10 --json databaseId --jq 'length' 2>/dev/null || echo 0)"
          if [ "$existing" -eq 0 ]; then
            gh workflow run neo-arena.yml --ref main \
              -f topic='quale tool MCP gratuito sarebbe più utile agli sviluppatori' \
              -f participants='Scout,Analyst,Critic,Builder-planner,Guest' \
              -f guest_personality='scettico' \
              -f max_turns='20' \
              -f andrea_message=''
            echo "First Arena session dispatched"
          fi

      - name: Report checkpoint status
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "https://neo-collettive.onrender.com/api/checkpoint-status" > /tmp/checkpoint-status.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/checkpoint-status.json",encoding="utf-8"))
          print({
              "ok":d.get("ok"),
              "stored_bytes":d.get("stored_bytes"),
              "limit_bytes":d.get("limit_bytes"),
              "last_checkpoint_utc":d.get("last_checkpoint_utc"),
          })
          PY

      - name: Verify Pathwren remains 100/100
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import httpx

          payload={
              "jsonrpc":"2.0",
              "id":"mycelix-pathwren-release",
              "method":"message/send",
              "params":{"message":{
                  "role":"ROLE_USER",
                  "messageId":"mycelix-pathwren-release-msg",
                  "parts":[{"text":json.dumps({
                      "skill":"score_card",
                      "url":"https://neo-collettive.onrender.com/mcp"
                  })}],
              }},
          }
          r=httpx.post(
              "https://www.pathwren.workers.dev/a2a/score",
              json=payload,
              headers={"Content-Type":"application/json","Accept":"application/json"},
              timeout=45,
          )
          r.raise_for_status()
          response_bytes=r.content
          with open("/tmp/pathwren-full-response.json","wb") as fh:
              fh.write(response_bytes)
          data=r.json()
          print("pathwren_full_response_bytes="+str(len(response_bytes)))
          found=[]
          def walk(value):
              if isinstance(value,dict):
                  verdict=value.get("verdict")
                  if isinstance(verdict,dict) and "score" in verdict:
                      found.append(verdict)
                  for v in value.values():
                      walk(v)
              elif isinstance(value,list):
                  for v in value:
                      walk(v)
          walk(data)
          if not found:
              raise SystemExit("Pathwren verdict missing")
          verdict=found[0]
          print(json.dumps(verdict,ensure_ascii=False,indent=2))
          if int(verdict.get("score") or -1)!=100:
              raise SystemExit("Pathwren score regressed below 100")
          if int(verdict.get("warnings") or 0)!=0:
              raise SystemExit("Pathwren warnings regressed above zero")
          PY

      - name: Preserve full Pathwren response as private Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pathwren-full-response-${{ github.run_id }}
          path: /tmp/pathwren-full-response.json
          if-no-files-found: warn
          retention-days: 90

      - name: Standard post-deploy smoke
        env:
