# forced redeploy after bounded checkpoint continuity fix
name: NEO Render Deploy

on:
  workflow_dispatch:
    inputs:
      extended_validation:
        description: "Run outbound/effectful extended post-deploy validation"
        required: false
        type: boolean
        default: false
      emergency_deploy:
        description: "Andrea-only: bypass publication freshness; memory integrity checks remain mandatory"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "cloud_mcp.py"
      - "route_policy.py"
      - "test_route_policy.py"
      - "test_route_auth_runtime.py"
      - "test_mcp_route_auth.py"
      - "arena_core.py"
      - "arena_micelio.py"
      - "arena_evolution.py"
      - "arena_registry_world.py"
      - "arena_local_llm_probe.py"
      - "test_arena_local_llm_probe.py"
      - ".github/workflows/neo-arena-local-llm.yml"
      - "test_arena_registry_world.py"
      - "test_arena_evolution.py"
      - "data/arena/evolution.json"
      - "test_arena_micelio.py"
      - "data/arena/micelio.json"
      - "test_arena_core.py"
      - ".github/workflows/neo-arena.yml"
      - "a2a_peer.py"
      - "test_a2a_peer.py"
      - "test_peer_refusal.py"
      - "inbound_security.py"
      - "test_inbound_security.py"
      - "venture_measurement.py"
      - "test_venture_measurement.py"
      - "test_discovery_v3.py"
      - "discovery_v3.py"
      - "query_builder.py"
      - "test_query_builder.py"
      - "evidence_integrity.py"
      - "test_evidence_integrity.py"
      - "evidence_memory_guard.py"
      - "commercial_evidence_store.py"
      - "test_memory_repair.py"
      - "test_evidence_store_atomic.py"
      - "arena_research_algorithm.py"
      - "test_arena_research_algorithm.py"
      - "data/arena/research-algorithm/control_cases.json"
      - "test_a2a_discovery_startup.py"
      - "hidden_control_gate.py"
      - "hidden_challenge_control_gate.py"
      - "challenge_track.py"
      - "data/challenge/control_cases.json"
      - "test_challenge_track.py"
      - "test_hidden_challenge_control_gate.py"
      - "test_commercial_gate_non_regression.py"
      - "startup_guard.py"
      - "test_hidden_control_gate.py"
      - "gate_stability.py"
      - "test_gate_stability.py"
      - "test_runtime_boundary.py"
      - "runtime_boundary.py"
      - "runtime_profile.json"
      - "state_recovery.py"
      - "test_state_recovery.py"
      - "state_compaction.py"
      - "test_state_compaction.py"
      - "public_snapshot.py"
      - "test_public_snapshot_privacy.py"
      - "model_shadow.py"
      - "model_judges.py"
      - "model_shadow_registry.json"
      - "test_model_judges.py"
      - "test_model_shadow_runtime.py"
      - "test_model_shadow_gate_non_regression.py"
      - "test_model_shadow_privacy.py"
      - "tools/model_shadow_privacy_check.py"
      - "runtime/model-shadow/student.json"
      - "runtime/model-shadow/metrics.json"
      - "inbound_interview.py"
      - "test_inbound_interview.py"
      - "trust_lab.py"
      - "test_intent_discovery.py"
      - "intent_discovery.py"
      - "test_agent_demand.py"
      - "agent_demand.py"
      - "test_agent_chat.py"
      - "inbound_traffic.py"
      - "test_inbound_traffic.py"
      - "agent_chat.py"
      - "test_trust_lab.py"
      - "inbound_recovery_seed.json"
      - "seti_radar.py"
      - "thesis_control.py"
      - "outcome_control.py"
      - "test_outcome_control.py"
      - "test_thesis_control.py"
      - "test_seti_radar.py"
      - "tool_opportunity.py"
      - "test_tool_opportunity.py"
      - "neo_dialect.py"
      - "neo_dialect_security.py"
      - "neo_dialect_seti_probe.py"
      - "neo_dialect_council.py"
      - "dialect_peer_harness.py"
      - "mcp_endpoint_verifier.py"
      - "test_mcp_endpoint_verifier.py"
      - "registry_health.py"
      - "registry_health_scan.py"
      - "test_registry_health.py"
      - "test_arena_core.py"
      - "data/registry-health/latest-summary.json"
      - "data/registry-health/latest-servers.json"
      - "verify_mcp_endpoint_live_probe.py"
      - "server.json"
      - "test_neo_dialect.py"
      - "test_neo_dialect_security.py"
      - "test_neo_dialect_seti_probe.py"
      - "test_neo_dialect_council.py"
      - "test_dialect_peer_harness.py"
      - "docs/neo-dialect.md"
      - "schemas/neo-dialect/1.0/**"
      - "runtime/neo-dialect-peer-report.json"
      - "requirements.lock"
      - "neo_policy.json"
      - "render.yaml"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/neo-render-deploy.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: neo-render-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HEARTBEAT_TOKEN: ${{ secrets.NEO_HEARTBEAT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authorize emergency deploy
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_deploy }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_ACTOR" != "Toramo747" ]; then
            echo "emergency_deploy denied: actor=$GITHUB_ACTOR is not Andrea/Toramo747" >&2
            exit 1
          fi
          echo "::warning::EMERGENCY_DEPLOY actor=$GITHUB_ACTOR freshness_bypass=true memory_integrity=required"

      - name: Validate source before deploy
        run: |
          set -euo pipefail
          python -m py_compile cloud_mcp.py challenge_track.py hidden_challenge_control_gate.py model_shadow.py model_judges.py jarvis_service/app.py
          python -m json.tool neo_policy.json >/dev/null
          python -m json.tool runtime_profile.json >/dev/null
          python -m json.tool model_shadow_registry.json >/dev/null
          python - <<'PY'
          import json
          r=json.load(open("model_shadow_registry.json",encoding="utf-8"))
          if r.get("mode")!="shadow" or r.get("promotion")!="manual_only":
              raise SystemExit("model shadow promotion policy is not fail-closed")
          student=r.get("student") or {}
          if student.get("render_mode")!="shadow" or student.get("promotion")!="manual_only":
              raise SystemExit("student shadow policy is not fail-closed")
          print("model shadow policy: shadow/manual_only")
          PY
          python - <<'PY'
          from runtime_boundary import load_runtime_profile
          p=load_runtime_profile()
          print("runtime_profile="+p["profile_id"]+" fingerprint="+p["config_fingerprint"])
          PY
          python - <<'PY'
          import ast
          for path in ("cloud_mcp.py","jarvis_service/app.py"):
              tree=ast.parse(open(path,encoding="utf-8").read(),filename=path)
              bad=[n.id for n in ast.walk(tree) if isinstance(n,ast.Name) and n.id in {"true","false","null"}]
              if bad:
                  raise SystemExit(f"{path}: JSON literal used as Python name: {sorted(set(bad))}")
          print("source runtime-literal validation passed")
          PY

      - name: Install locked test dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock

      - name: Run regression tests
        run: |
          set -euo pipefail
          python -m unittest -v test_deploy_rollback.py test_deploy_health.py test_memory_repair.py test_evidence_store_atomic.py test_evidence_integrity.py test_arena_research_algorithm.py test_a2a_discovery_startup.py test_hidden_control_gate.py test_hidden_challenge_control_gate.py test_challenge_track.py test_commercial_gate_non_regression.py test_gate_stability.py test_seti_radar.py test_tool_opportunity.py test_thesis_control.py test_outcome_control.py test_discovery_v3.py test_query_builder.py test_state_recovery.py test_state_compaction.py test_public_snapshot_privacy.py test_model_judges.py test_model_shadow_runtime.py test_model_shadow_gate_non_regression.py test_model_shadow_privacy.py test_route_policy.py test_inbound_interview.py test_trust_lab.py test_intent_discovery.py test_agent_demand.py test_agent_chat.py test_inbound_traffic.py test_runtime_boundary.py test_a2a_peer.py test_peer_refusal.py test_inbound_security.py test_venture_measurement.py test_neo_dialect.py test_neo_dialect_security.py test_neo_dialect_seti_probe.py test_neo_dialect_council.py test_dialect_peer_harness.py test_mcp_endpoint_verifier.py test_registry_health.py test_arena_core.py test_arena_micelio.py test_arena_evolution.py test_arena_registry_world.py

      - name: Require all public commercial controls
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from arena_research_algorithm import evaluate_control_cases
          data=json.load(open("data/arena/research-algorithm/control_cases.json",encoding="utf-8"))
          result=evaluate_control_cases(data.get("cases") or [])
          print(json.dumps(result,indent=2))
          cases=int(result.get("cases") or 0)
          correct=int(result.get("correct") or 0)
          family_cases=int(result.get("family_cases") or 0)
          family_correct=int(result.get("family_correct") or 0)
          if cases < 6 or correct != cases:
              raise SystemExit(f"commercial control gate failed: {correct}/{cases}; require all cases with cases>=6")
          if family_correct != family_cases:
              raise SystemExit(f"commercial family control gate failed: {family_correct}/{family_cases}")
          PY

      - name: Require all public challenge controls
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from challenge_track import evaluate_public_control_cases
          data=json.load(open("data/challenge/control_cases.json",encoding="utf-8"))
          result=evaluate_public_control_cases(data.get("cases") or [])
          print(json.dumps(result,indent=2))
          cases=int(result.get("cases") or 0)
          correct=int(result.get("correct") or 0)
          if cases < 12 or correct != cases:
              raise SystemExit(f"challenge control gate failed: {correct}/{cases}; require all cases with cases>=12")
          PY

      - name: Build Docker image in GitHub CI
        run: |
          set -euo pipefail
          docker build --pull -t neo-ci .

      - name: Smoke test production container startup
        run: |
          set -euo pipefail
          docker rm -f neo-ci-runtime >/dev/null 2>&1 || true
          docker run -d --name neo-ci-runtime --network none -e PORT=10000 -e NEO_AUTOPILOT_ENABLED=false neo-ci >/tmp/neo-ci-container-id
          ready=0
          for i in $(seq 1 30); do
            if docker exec neo-ci-runtime python -c 'import urllib.request; print(urllib.request.urlopen("http://127.0.0.1:10000/livez",timeout=2).read().decode())' >/tmp/neo-ci-livez.json 2>/dev/null; then
              ready=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' neo-ci-runtime 2>/dev/null || echo false)" != "true" ]; then
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "production container failed startup smoke" >&2
            docker inspect neo-ci-runtime || true
            docker logs neo-ci-runtime || true
            exit 1
          fi
          cat /tmp/neo-ci-livez.json
          docker logs neo-ci-runtime || true
          docker rm -f neo-ci-runtime >/dev/null

      - name: Resolve expected NEO version
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          s=open("cloud_mcp.py",encoding="utf-8").read()
          m=re.search(r'^VERSION = "([^"]+)"',s,re.M)
          if not m:
              raise SystemExit("VERSION not found")
          open("/tmp/neo_version","w").write(m.group(1))
          print("expected_version="+m.group(1))
          PY

      - name: Validate Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          [ -n "$RENDER_DEPLOY_HOOK" ] || { echo "Missing GitHub secret: RENDER_DEPLOY_HOOK"; exit 2; }

      - name: Force durable checkpoint before deploy
        env:
          EMERGENCY_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_deploy }}
        run: |
          set -euo pipefail
          target="https://neo-collettive.onrender.com/api/checkpoint-status"
          health_target="https://neo-collettive.onrender.com/health"
          proof="$(NEO_HEARTBEAT_TOKEN="${HEARTBEAT_TOKEN}" python self_traffic_auth.py sign-url "${target}" --marker github-actions-deploy)"
          health_proof="$(NEO_HEARTBEAT_TOKEN="${HEARTBEAT_TOKEN}" python self_traffic_auth.py sign-url "${health_target}" --marker github-actions-deploy)"
          code="$(curl -X POST --show-error --silent --max-time 45 --output /tmp/predeploy-checkpoint.json --write-out '%{http_code}' \
            -H "X-MYCELIX-Self-Traffic: github-actions-deploy" \
            -H "X-MYCELIX-Self-Traffic-Proof: ${proof}" \
            "${target}")"
          curl --fail --show-error --silent --max-time 30 \
            -H "X-MYCELIX-Self-Traffic: github-actions-deploy" \
            -H "X-MYCELIX-Self-Traffic-Proof: ${health_proof}" \
            "${health_target}" > /tmp/predeploy-health.json
          if [ "${code}" = "404" ] || [ "${code}" = "405" ]; then
            echo "Runtime predates forced-checkpoint POST; validating existing durable checkpoint"
            curl --fail --show-error --silent --max-time 30 "${target}" > /tmp/predeploy-checkpoint.json
            EMERGENCY_DEPLOY="${EMERGENCY_DEPLOY}" python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          d=json.load(open("/tmp/predeploy-checkpoint.json",encoding="utf-8"))
          if d.get("ok") is not True:
              raise SystemExit("existing pre-deploy checkpoint is not healthy")
          stored=int(d.get("stored_bytes") or 0)
          limit=int(d.get("limit_bytes") or 0)
          if stored <= 0 or limit <= 0 or stored >= limit:
              raise SystemExit(f"existing pre-deploy checkpoint lacks safety margin: {stored}/{limit}")
          if os.environ.get("EMERGENCY_DEPLOY") == "true":
              print("EMERGENCY_DEPLOY legacy checkpoint integrity passed; publication freshness bypassed")
              raise SystemExit(0)
          raw=str(d.get("last_checkpoint_utc") or "")
          try:
              ts=datetime.fromisoformat(raw.replace("Z","+00:00"))
              if ts.tzinfo is None: ts=ts.replace(tzinfo=timezone.utc)
          except Exception:
              raise SystemExit("existing pre-deploy checkpoint timestamp invalid")
          age=(datetime.now(timezone.utc)-ts.astimezone(timezone.utc)).total_seconds()
          if age < 0 or age > 600:
              raise SystemExit(f"existing pre-deploy checkpoint too old: {age:.0f}s")
          print("bootstrap_checkpoint_age_seconds="+str(int(age)))
          PY
          elif [ "${code}" = "200" ]; then
            cat /tmp/predeploy-checkpoint.json
            git fetch --quiet --depth=1 --force origin main:refs/remotes/origin/main
            git show origin/main:neo_latest_result.json > /tmp/predeploy-public-snapshot.json
            if python - <<'PY'
          import json
          d=json.load(open("/tmp/predeploy-checkpoint.json",encoding="utf-8"))
          snapshot=json.load(open("/tmp/predeploy-public-snapshot.json",encoding="utf-8"))
          cycles=int(d.get("cycles_completed") or 0)
          current_evidence=int(d.get("commercial_evidence_items") or 0)
          published=int((((snapshot.get("autopilot") or {}).get("select_diagnostics") or {}).get("persistent_evidence_items")) or 0)
          stored=int(d.get("stored_bytes") or 0)
          limit=int(d.get("limit_bytes") or 0)
          if cycles < 1:
              raise SystemExit("pre-deploy checkpoint missing cycle state")
          if d.get("ok") is not True:
              raise SystemExit("pre-deploy checkpoint is not healthy")
          if stored <= 0 or limit <= 0 or stored >= limit:
              raise SystemExit(f"pre-deploy checkpoint lacks safety margin: {stored}/{limit}")
          if published < 1:
              raise SystemExit("published snapshot missing persistent evidence count")
          if current_evidence < published:
              raise SystemExit(f"pre-deploy evidence regressed: current={current_evidence} published={published}")
          print("checkpoint_cycles="+str(cycles))
          print("checkpoint_evidence_items="+str(current_evidence))
          print("published_evidence_floor="+str(published))
          print("checkpoint_store_write_verified=true")
          raise SystemExit(0)
          PY
            then
              echo "Healthy durable checkpoint confirmed; memory integrity passed without publication freshness dependency."
            else
              git fetch --quiet --depth=1 --force origin main:refs/remotes/origin/main
              git show origin/main:neo_latest_result.json > /tmp/predeploy-public-snapshot.json
              git show origin/main:neo_cycle_floor.json > /tmp/predeploy-cycle-floor.json
              python - <<'PY'
          import json
          from datetime import datetime,timezone
          
          d=json.load(open("/tmp/predeploy-checkpoint.json",encoding="utf-8"))
          cycles=int(d.get("cycles_completed") or 0)
          if cycles < 1:
              raise SystemExit("pre-deploy checkpoint missing cycle state")
          
          stored_raw=d.get("stored_bytes")
          stored=int(stored_raw or 0)
          limit=int(d.get("limit_bytes") or 0)
          health=json.load(open("/tmp/predeploy-health.json",encoding="utf-8"))
          source_commit=str(health.get("commit") or "")
          legacy_overflow_bootstrap=(
              stored_raw is None
              and limit == 100000
              and source_commit == "678f8e302237f3e9c6b403f80c2930aab860a3c3"
          )
          explicit_overflow=(limit > 0 and stored > limit)
          if not (explicit_overflow or legacy_overflow_bootstrap):
              raise SystemExit("pre-deploy checkpoint failed for non-overflow reason")
          
          snapshot=json.load(open("/tmp/predeploy-public-snapshot.json",encoding="utf-8"))
          floor=json.load(open("/tmp/predeploy-cycle-floor.json",encoding="utf-8"))
          snapshot_cycles=int((snapshot.get("autopilot") or {}).get("cycles_completed") or 0)
          floor_cycles=int(floor.get("cycles_completed") or 0)
          diag=(snapshot.get("autopilot") or {}).get("select_diagnostics") or {}
          memory=(snapshot.get("autopilot") or {}).get("evidence_memory") or {}
          evidence=int(diag.get("persistent_evidence_items") or 0)
          evidence_in=int(memory.get("evidence_in") or 0)
          evidence_out=int(memory.get("evidence_out") or 0)
          blocked=int(memory.get("evidence_regression_blocked") or 0)
          repaired=int(memory.get("timestamp_repaired") or 0)
          if evidence < 108 or evidence_in != evidence or evidence_out != evidence or blocked != 0 or repaired != 0:
              raise SystemExit(
                  "overflow bootstrap evidence guard failed: "
                  f"persistent={evidence} in={evidence_in} out={evidence_out} "
                  f"blocked={blocked} repaired={repaired}"
              )
          raw=str(snapshot.get("captured_at_utc") or "")
          try:
              ts=datetime.fromisoformat(raw.replace("Z","+00:00"))
              if ts.tzinfo is None:
                  ts=ts.replace(tzinfo=timezone.utc)
          except Exception:
              raise SystemExit("overflow bootstrap snapshot timestamp invalid")
          age=(datetime.now(timezone.utc)-ts.astimezone(timezone.utc)).total_seconds()
          if age < 0 or age > 5400:
              raise SystemExit(f"overflow bootstrap snapshot too old: {age:.0f}s")
          current_evidence=int(d.get("commercial_evidence_items") or 0)
          publication_lag=cycles-snapshot_cycles
          floor_lag=cycles-floor_cycles
          if publication_lag < 0 or floor_lag < 0:
              raise SystemExit(
                  f"overflow bootstrap runtime behind published state: runtime={cycles} snapshot={snapshot_cycles} floor={floor_cycles}"
              )
          if floor_cycles < snapshot_cycles:
              raise SystemExit(
                  f"overflow bootstrap cycle floor behind published snapshot: floor={floor_cycles} snapshot={snapshot_cycles}"
              )
          if current_evidence < evidence or current_evidence < 108:
              raise SystemExit(
                  f"overflow bootstrap current evidence regressed: current={current_evidence} published={evidence}"
              )
          open("/tmp/checkpoint-overflow-bootstrap","w").write(
              json.dumps({
                  "runtime_cycles":cycles,
                  "snapshot_cycles":snapshot_cycles,
                  "floor_cycles":floor_cycles,
                  "stored_bytes":stored if stored_raw is not None else None,
                  "limit_bytes":limit,
                  "legacy_overflow_bootstrap":legacy_overflow_bootstrap,
                  "source_commit":source_commit,
                  "evidence":evidence,
                  "current_evidence":current_evidence,
                  "publication_lag":publication_lag,
                  "snapshot_freshness_limit_seconds":5400,
              },separators=(",",":"))
          )
          print(
              "overflow_bootstrap_authorized "
              f"runtime_cycles={cycles} snapshot_cycles={snapshot_cycles} "
              f"stored_bytes={stored_raw} limit_bytes={limit} snapshot_age_seconds={int(age)} "
              f"legacy={legacy_overflow_bootstrap} evidence={evidence} "
              f"current_evidence={current_evidence} publication_lag={publication_lag}"
          )
          
          PY
            fi
          else
            cat /tmp/predeploy-checkpoint.json || true
            echo "pre-deploy checkpoint HTTP ${code}" >&2
            exit 22
          fi

      - name: Capture previous production commit
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          commit=str(json.load(open("/tmp/predeploy-health.json")).get("commit") or "")
          if not re.fullmatch(r"[0-9a-f]{40}",commit):
              raise SystemExit("Previous production commit unavailable; deploy blocked")
          Path("/tmp/previous-production-commit").write_text(commit)
          PY

      - name: Trigger Render deploy
        id: render_trigger
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          sep='?'
          case "$RENDER_DEPLOY_HOOK" in *\?*) sep='&' ;; esac
          touch /tmp/render-deploy-attempted
          deploy_url="${RENDER_DEPLOY_HOOK}${sep}ref=${GITHUB_SHA}"
          curl --fail --show-error --silent --max-time 60 "$deploy_url" > /tmp/deploy.txt
          cat /tmp/deploy.txt || true

      - name: Wait for expected NEO version
        run: |
          set -euo pipefail
          expected="$(cat /tmp/neo_version)"
          render_ready=1
          for i in $(seq 1 40); do
            if [ "$render_ready" -eq 1 ] && curl --fail --silent --show-error -H "X-MYCELIX-Self-Traffic: github-actions-deploy" -H "X-MYCELIX-Self-Traffic-Proof: $(NEO_HEARTBEAT_TOKEN="${HEARTBEAT_TOKEN}" python self_traffic_auth.py sign-url 'https://neo-collettive.onrender.com/health' --marker github-actions-deploy)" --max-time 30 \
              "https://neo-collettive.onrender.com/health" > /tmp/health.json; then
              cat /tmp/health.json
              if EXPECTED="$expected" python - <<'PY'
          import json,os,sys
          d=json.load(open("/tmp/health.json",encoding="utf-8"))
          profile=d.get("runtime_profile") or {}
          ok=(
              str(d.get("version") or "") == os.environ["EXPECTED"]
              and str(d.get("commit") or "") == os.environ.get("GITHUB_SHA","")
              and str(profile.get("profile_id") or "") == "mycelix-prod-main"
              and str(profile.get("deployment_role") or "") == "production"
          )
          sys.exit(0 if ok else 1)
          PY
              then
                echo "NEO v$expected is live on commit $GITHUB_SHA"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "Timed out waiting for NEO v$expected"
          cat /tmp/health.json || true
          exit 5

      - name: Verify repaired commercial evidence memory
        run: |
          set -euo pipefail
          target="https://neo-collettive.onrender.com/api/checkpoint-status"
          proof="$(NEO_HEARTBEAT_TOKEN="${HEARTBEAT_TOKEN}" python self_traffic_auth.py sign-url "${target}" --marker github-actions-deploy)"
          code="$(curl -X POST --show-error --silent --max-time 45 --output /tmp/postrepair-checkpoint.json --write-out '%{http_code}' \
            -H "X-MYCELIX-Self-Traffic: github-actions-deploy" \
