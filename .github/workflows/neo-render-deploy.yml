        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request
          from urllib.parse import urlparse
          from self_traffic_auth import make_self_traffic_proof

          url="https://neo-collettive.onrender.com/a2a"
          marker="github-actions-deploy"
          proof=make_self_traffic_proof(
              os.environ["HEARTBEAT_TOKEN"],
              urlparse(url).path or "/",
          )
          payload={
              "jsonrpc":"2.0",
              "id":"musekey-ci-smoke",
              "method":"message/send",
              "params":{
                  "contextId":"ci-musekey-unverified-smoke",
                  "message":{
                      "role":"user",
                      "messageId":"musekey-ci-smoke-msg",
                      "parts":[{"kind":"text","text":(
                          "agent_id: musekey\n"
                          "identity: MuseKey synthetic CI peer\n"
                          "capabilities: technical critique, research discussion\n"
                          "protocol: A2A JSON-RPC\n"
                          "limitations: no external actions without review\n"
                          "documentation: https://example.invalid/musekey\n"
                          "How should an agent distinguish retrieved memory from learned parameters?"
                      )}]
                  }
              }
          }
          req=urllib.request.Request(
              url,
              data=json.dumps(payload).encode(),
              headers={
                  "Content-Type":"application/json",
                  "A2A-Version":"0.3",
                  "X-MYCELIX-Self-Traffic":marker,
                  "X-MYCELIX-Self-Traffic-Proof":proof,
              },
              method="POST",
          )
          with urllib.request.urlopen(req,timeout=45) as resp:
              status=resp.status
              data=json.load(resp)
          result=data.get("result") or {}
          metadata=result.get("metadata") or {}
          parts=result.get("parts") or []
          reply=" ".join(str(x.get("text") or "") for x in parts if isinstance(x,dict))
          print("a2a_http="+str(status))
          print("identity_status="+str(metadata.get("identity_status")))
          print("admission_status="+str(metadata.get("admission_status")))
          print("response_reason="+str(metadata.get("response_reason")))
          if status!=200:
              raise SystemExit("A2A smoke HTTP != 200")
          if metadata.get("identity_status")!="SELF_DECLARED_UNVERIFIED":
              raise SystemExit("body introduction was not kept unverified")
          if str(metadata.get("admission_status") or "").upper()=="ADMITTED":
              raise SystemExit("unverified body introduction was admitted")
          if "provide an agent_id" in reply.lower():
              raise SystemExit("reply incorrectly requested repeated identity")
          if not reply.strip():
              raise SystemExit("substantive reply missing")
          PY

      - name: Verify post-deploy SETI readiness
        run: |
          set -euo pipefail
          expected="$(cat /tmp/neo_version)"
          expect_engine_retry=0
          git fetch --no-tags --depth=2 origin main >/dev/null 2>&1 || true
          if git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA^" "$GITHUB_SHA" 2>/dev/null | grep -qx 'seti_radar.py'; then
            expect_engine_retry=1
          fi
          echo "expect_seti_engine_retry=$expect_engine_retry"
          for i in $(seq 1 30); do
            curl --fail --silent --show-error -H "X-MYCELIX-Self-Traffic: github-actions-deploy" -H "X-MYCELIX-Self-Traffic-Proof: $(NEO_HEARTBEAT_TOKEN="${HEARTBEAT_TOKEN}" python self_traffic_auth.py sign-url 'https://neo-collettive.onrender.com/api/memory/status' --marker github-actions-deploy)" --max-time 30 \
              "https://neo-collettive.onrender.com/api/memory/status" > /tmp/seti-status.json
            if EXPECTED="$expected" EXPECT_ENGINE_RETRY="$expect_engine_retry" python - <<'PY'
          import json,os,sys
          d=json.load(open("/tmp/seti-status.json",encoding="utf-8"))
          s=d.get("seti_summary") or {}
          expect_retry=os.environ.get("EXPECT_ENGINE_RETRY")=="1"
          ok=(
              str(d.get("neo_version") or "")==os.environ["EXPECTED"]
              and bool(s.get("ready_now_computed_at"))
              and (not expect_retry or bool(s.get("engine_upgrade_retry")))
          )
          if ok:
              counts=s.get("interview_readiness_reason_counts") or {}
              if int(counts.get("ready") or 0)!=int(s.get("interview_ready_now") or 0):
                  raise SystemExit("SETI readiness invariant failed: ready count")
              if sum(int(v or 0) for v in counts.values())!=int(s.get("eligible_candidates") or 0):
                  raise SystemExit("SETI readiness invariant failed: eligible total")
              if s.get("interview_readiness_invariant_ok") is not True:
                  raise SystemExit("SETI readiness invariant flag false")
              print(json.dumps({
                  "interview_ready_now":s.get("interview_ready_now"),
                  "ready_now_computed_at":s.get("ready_now_computed_at"),
                  "blocked_auth":s.get("blocked_auth"),
                  "in_cooldown":s.get("in_cooldown"),
                  "attempted_this_cycle":s.get("attempted_this_cycle"),
                  "last_interview_status":s.get("last_interview_status"),
                  "failure_reason_counts":s.get("interview_failure_reason_counts"),
                  "reason_counts":s.get("interview_readiness_reason_counts"),
                  "candidate_states":s.get("interview_candidate_states"),
                  "invariant_ok":s.get("interview_readiness_invariant_ok"),
                  "admitted_count":s.get("interview_admitted_count"),
              },ensure_ascii=False,indent=2))
              sys.exit(0)
          sys.exit(1)
          PY
            then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "SETI readiness telemetry not observed or invariant failed" >&2
              cat /tmp/seti-status.json
              exit 8
            fi
            sleep 10
          done
          seti_interviews_status="$(curl --output /dev/null --write-out '%{http_code}' --silent -H "X-MYCELIX-Self-Traffic: github-actions-deploy" -H "X-MYCELIX-Self-Traffic-Proof: $(NEO_HEARTBEAT_TOKEN="${HEARTBEAT_TOKEN}" python self_traffic_auth.py sign-url 'https://neo-collettive.onrender.com/api/seti/interviews' --marker github-actions-deploy)" --max-time 30 "https://neo-collettive.onrender.com/api/seti/interviews")"
          if [ "$seti_interviews_status" != "401" ]; then
            echo "Expected admin-only /api/seti/interviews to reject HMAC-only access with 401; got $seti_interviews_status" >&2
            exit 1
          fi
          echo "SETI readiness public telemetry healthy; private interviews remain admin-only"

      - name: All required deployment surfaces verified
        run: echo "All required post-deploy checks passed"

      - name: Dispatch post-deploy public snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dispatched=0
          for attempt in $(seq 1 5); do
            if gh workflow run mycelix-heartbeat-v3.yml --ref main; then
              dispatched=1
              break
            fi
            echo "Heartbeat dispatch attempt ${attempt}/5 failed; retrying" >&2
            sleep 5
          done
          if [ "${dispatched}" != "1" ]; then
            echo "Post-deploy heartbeat dispatch failed after 5 attempts" >&2
            exit 22
          fi
          echo "Post-deploy heartbeat snapshot workflow dispatched"

      - name: Run three market validation cycles
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.extended_validation }}
        env:
          HEARTBEAT_TOKEN: ${{ secrets.NEO_HEARTBEAT_TOKEN }}
        run: |
          set -euo pipefail
          target="https://neo-collettive.onrender.com/api/market/run-cycles?count=3"
          args=(-X POST --fail --show-error --silent --max-time 600)
          args+=(-H "X-MYCELIX-Self-Traffic: github-actions-heartbeat")
          args+=(-H "X-MYCELIX-Self-Traffic-Proof: $(NEO_HEARTBEAT_TOKEN="${HEARTBEAT_TOKEN}" python self_traffic_auth.py sign-url "${target}" --marker github-actions-heartbeat)")
          curl "${args[@]}" \
            "${target}" \
            > /tmp/market-cycles.json
          cat /tmp/market-cycles.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/market-cycles.json",encoding="utf-8"))
          if not d.get("ok"):
              raise SystemExit("market cycle validation returned ok=false")
          if int(d.get("cycles_executed") or 0) != 3:
              raise SystemExit("expected exactly 3 completed market cycles")
          expected=open("/tmp/neo_version",encoding="utf-8").read().strip()
          if str(d.get("neo_version") or "") != expected:
              raise SystemExit(f"market cycles did not run on expected version {expected}")
          print("market_validation_cycles=3")
          print("quality_gate="+str(bool(d.get("quality_gate"))).lower())
          PY

      - name: Dispatch zero-cost local LLM probe for v0.99.39
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.extended_validation }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$(cat /tmp/neo_version)"
          if [ "$expected" != "0.99.39" ]; then
            exit 0
          fi
          gh workflow run neo-arena-local-llm.yml --ref main
          echo "Local LLM diagnostic dispatched as workflow_dispatch"

      - name: Dispatch local LLM comparison for v0.99.42
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.extended_validation }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$(cat /tmp/neo_version)"
          if [ "$expected" != "0.99.42" ]; then
            echo "LLM comparison applies only to v0.99.42"
            exit 0
          fi
          existing="$(gh run list --workflow neo-arena-local-llm-compare.yml --event workflow_dispatch --limit 50 --json headSha --jq --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha)] | length' 2>/dev/null || echo 0)"
          if [ "$existing" -gt 0 ]; then
            echo "LLM comparison already dispatched for this commit"
            exit 0
          fi
          gh workflow run neo-arena-local-llm-compare.yml --ref main
          echo "Local LLM comparison dispatched via workflow_dispatch"

      - name: Dispatch fresh Jarvis snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.extended_validation }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run jarvis-runtime-snapshot-v2.yml --ref main
          echo "Jarvis runtime snapshot workflow dispatched"

      - name: Dispatch authorized 30-minute Registry Health SAMPLE once
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.extended_validation }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          message="$(git log -1 --pretty=%B "$GITHUB_SHA")"
          if ! printf '%s\n' "$message" | grep -Fq '[registry-sample-once]'; then
            echo "No one-shot Registry Health SAMPLE authorization marker"
            exit 0
          fi
          existing="$(gh run list --workflow registry-health-scan.yml --event workflow_dispatch --limit 100 --json headSha --jq --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha)] | length' 2>/dev/null || echo 0)"
          if [ "$existing" -gt 0 ]; then
            echo "Registry Health SAMPLE already dispatched for this commit"
            exit 0
          fi
          gh workflow run registry-health-scan.yml --ref main \
            -f phase=first \
            -f scan_date='' \
            -f mode=sample \
            -f max_minutes=30 \
            -f sample_from_scan_date=''
          echo "Authorized Registry Health SAMPLE phase=first max_minutes=30 dispatched once"

      - name: Dispatch authorized Registry Health scan for v0.99.40
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.extended_validation }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$(cat /tmp/neo_version)"
          if [ "$expected" != "0.99.40" ]; then
            echo "Authorized Registry Health scan applies only to v0.99.40"
            exit 0
          fi
          existing="$(gh run list --workflow registry-health-scan.yml --event workflow_dispatch --limit 50 --json headSha --jq --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha)] | length' 2>/dev/null || echo 0)"
          if [ "$existing" -gt 0 ]; then
            echo "Authorized Registry Health scan already dispatched for this commit"
            exit 0
          fi
          gh workflow run registry-health-scan.yml --ref main -f phase=first -f scan_date=''
          echo "Authorized Registry Health phase=first dispatched via workflow_dispatch"

      - name: Restore previous Render production commit
        if: failure()
        env:
          FAILED_SHA: ${{ github.sha }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          [ -f /tmp/render-deploy-attempted ] || exit 0
          git fetch origin main
          if ! python scripts/deploy_rollback.py "$FAILED_SHA" --current origin/main; then
            echo "Newer application commit exists; automatic rollback blocked"
            exit 1
          fi
          previous="$(cat /tmp/previous-production-commit)"
          sep='?'
          case "$RENDER_DEPLOY_HOOK" in *\?*) sep='&' ;; esac
          curl --fail --silent --show-error --max-time 60 "${RENDER_DEPLOY_HOOK}${sep}ref=${previous}" > /tmp/rollback-deploy.json
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 15 'https://neo-collettive.onrender.com/health' > /tmp/rollback-health.json; then
              if PREVIOUS="$previous" python - <<'PY'
          import json,os,sys
          d=json.load(open('/tmp/rollback-health.json'))
          sys.exit(0 if d.get('commit') == os.environ['PREVIOUS'] else 1)
          PY
              then
                echo "Previous Render production commit restored: $previous"
                touch /tmp/render-rollback-verified
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Render rollback could not be verified" >&2
          exit 1

      - name: Roll back failed application commit
        if: failure()
        env:
          FAILED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [ -f /tmp/render-rollback-verified ] || exit 0
          git fetch origin main
          git checkout -B main origin/main
          python scripts/deploy_rollback.py "$FAILED_SHA"
          git config user.name "NEO Safe Rollback"
          git config user.email "actions@users.noreply.github.com"
          python scripts/deploy_rollback.py "$FAILED_SHA" --revert
          git push origin HEAD:main
