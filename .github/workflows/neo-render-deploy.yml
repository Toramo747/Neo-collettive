          payload={
              "jsonrpc":"2.0",
              "id":"mycelix-pathwren-release",
              "method":"message/send",
              "params":{"message":{
                  "role":"ROLE_USER",
                  "messageId":"mycelix-pathwren-release-msg",
                  "parts":[{"text":json.dumps({
                      "skill":"score_card",
                      "url":"https://neo-collettive.onrender.com/mcp"
                  })}],
              }},
          }
          r=httpx.post(
              "https://www.pathwren.workers.dev/a2a/score",
              json=payload,
              headers={"Content-Type":"application/json","Accept":"application/json"},
              timeout=45,
          )
          r.raise_for_status()
          response_bytes=r.content
          with open("/tmp/pathwren-full-response.json","wb") as fh:
              fh.write(response_bytes)
          data=r.json()
          print("pathwren_full_response_bytes="+str(len(response_bytes)))
          found=[]
          def walk(value):
              if isinstance(value,dict):
                  verdict=value.get("verdict")
                  if isinstance(verdict,dict) and "score" in verdict:
                      found.append(verdict)
                  for v in value.values():
                      walk(v)
              elif isinstance(value,list):
                  for v in value:
                      walk(v)
          walk(data)
          if not found:
              raise SystemExit("Pathwren verdict missing")
          verdict=found[0]
          print(json.dumps(verdict,ensure_ascii=False,indent=2))
          if int(verdict.get("score") or -1)!=100:
              raise SystemExit("Pathwren score regressed below 100")
          if int(verdict.get("warnings") or 0)!=0:
              raise SystemExit("Pathwren warnings regressed above zero")
          PY

