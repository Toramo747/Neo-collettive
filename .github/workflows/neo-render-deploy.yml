name: NEO Render Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloud_mcp.py"
      - "render.yaml"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/neo-render-deploy.yml"

permissions:
  contents: read

concurrency:
  group: neo-render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate Render secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          [ -n "$RENDER_API_KEY" ] || { echo "Missing GitHub secret: RENDER_API_KEY"; exit 2; }
          [ -n "$RENDER_SERVICE_ID" ] || { echo "Missing GitHub secret: RENDER_SERVICE_ID"; exit 2; }

      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --output /tmp/deploy.json --write-out "%{http_code}" \
            -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data "{\"commitId\":\"$COMMIT_SHA\",\"clearCache\":\"do_not_clear\"}")
          cat /tmp/deploy.json
          case "$code" in
            201|202) ;;
            *) echo "Render deploy trigger failed with HTTP $code"; exit 3 ;;
          esac
          python - <<'PY'
          import json
          d=json.load(open("/tmp/deploy.json",encoding="utf-8"))
          deploy=d.get("deploy") if isinstance(d,dict) and isinstance(d.get("deploy"),dict) else d
          deploy_id=(deploy or {}).get("id")
          if not deploy_id:
              raise SystemExit("Render response missing deploy id")
          open("/tmp/deploy_id","w").write(str(deploy_id))
          print("deploy_id="+str(deploy_id))
          PY

      - name: Wait for Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          deploy_id="$(cat /tmp/deploy_id)"
          for i in $(seq 1 30); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id" > /tmp/status.json
            status=$(python - <<'PY'
          import json
          d=json.load(open("/tmp/status.json",encoding="utf-8"))
          x=d.get("deploy") if isinstance(d,dict) and isinstance(d.get("deploy"),dict) else d
          print((x or {}).get("status") or "")
          PY
          )
            echo "Render deploy status: $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|deactivated) cat /tmp/status.json; exit 4 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for Render deploy"
          cat /tmp/status.json || true
          exit 5

      - name: Verify NEO runtime version
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            "https://neo-collettive.onrender.com/health" > /tmp/health.json
          cat /tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/health.json",encoding="utf-8"))
          version=str(d.get("version") or "")
          if version != "0.41.0":
              raise SystemExit("Unexpected runtime version: "+version)
          print("NEO runtime verified: "+version)
          PY
