# forced redeploy for NEO v0.56.0
name: NEO Render Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloud_mcp.py"
      - "a2a_peer.py"
      - "test_a2a_peer.py"
      - "test_peer_refusal.py"
      - "inbound_security.py"
      - "test_inbound_security.py"
      - "venture_measurement.py"
      - "test_venture_measurement.py"
      - "test_discovery_v3.py"
      - "discovery_v3.py"
      - "test_runtime_boundary.py"
      - "runtime_boundary.py"
      - "runtime_profile.json"
      - "state_recovery.py"
      - "test_state_recovery.py"
      - "inbound_interview.py"
      - "test_inbound_interview.py"
      - "trust_lab.py"
      - "test_intent_discovery.py"
      - "intent_discovery.py"
      - "test_agent_demand.py"
      - "agent_demand.py"
      - "test_agent_chat.py"
      - "agent_chat.py"
      - "test_trust_lab.py"
      - "inbound_recovery_seed.json"
      - "seti_radar.py"
      - "thesis_control.py"
      - "outcome_control.py"
      - "test_outcome_control.py"
      - "test_thesis_control.py"
      - "test_seti_radar.py"
      - "tool_opportunity.py"
      - "test_tool_opportunity.py"
      - "neo_dialect.py"
      - "neo_dialect_security.py"
      - "neo_dialect_seti_probe.py"
      - "neo_dialect_council.py"
      - "dialect_peer_harness.py"
      - "test_neo_dialect.py"
      - "test_neo_dialect_security.py"
      - "test_neo_dialect_seti_probe.py"
      - "test_neo_dialect_council.py"
      - "test_dialect_peer_harness.py"
      - "docs/neo-dialect.md"
      - "schemas/neo-dialect/1.0/**"
      - "runtime/neo-dialect-peer-report.json"
      - "requirements.lock"
      - "neo_policy.json"
      - "render.yaml"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/neo-render-deploy.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: neo-render-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate source before deploy
        run: |
          set -euo pipefail
          python -m py_compile cloud_mcp.py jarvis_service/app.py
          python -m json.tool neo_policy.json >/dev/null
          python -m json.tool runtime_profile.json >/dev/null
          python - <<'PY'
          from runtime_boundary import load_runtime_profile
          p=load_runtime_profile()
          print("runtime_profile="+p["profile_id"]+" fingerprint="+p["config_fingerprint"])
          PY
          python - <<'PY'
          import ast
          for path in ("cloud_mcp.py","jarvis_service/app.py"):
              tree=ast.parse(open(path,encoding="utf-8").read(),filename=path)
              bad=[n.id for n in ast.walk(tree) if isinstance(n,ast.Name) and n.id in {"true","false","null"}]
              if bad:
                  raise SystemExit(f"{path}: JSON literal used as Python name: {sorted(set(bad))}")
          print("source runtime-literal validation passed")
          PY

      - name: Install locked test dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock

      - name: Run regression tests
        run: |
          set -euo pipefail
          python -m unittest -v test_evidence_integrity.py test_seti_radar.py test_tool_opportunity.py test_thesis_control.py test_outcome_control.py test_discovery_v3.py test_state_recovery.py test_inbound_interview.py test_trust_lab.py test_intent_discovery.py test_agent_demand.py test_agent_chat.py test_runtime_boundary.py test_a2a_peer.py test_peer_refusal.py test_inbound_security.py test_venture_measurement.py test_neo_dialect.py test_neo_dialect_security.py test_neo_dialect_seti_probe.py test_neo_dialect_council.py test_dialect_peer_harness.py

      - name: Build Docker image in GitHub CI
        run: |
          set -euo pipefail
          docker build --pull -t neo-ci .

      - name: Resolve expected NEO version
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          s=open("cloud_mcp.py",encoding="utf-8").read()
          m=re.search(r'^VERSION = "([^"]+)"',s,re.M)
          if not m:
              raise SystemExit("VERSION not found")
          open("/tmp/neo_version","w").write(m.group(1))
          print("expected_version="+m.group(1))
          PY

      - name: Validate Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          [ -n "$RENDER_DEPLOY_HOOK" ] || { echo "Missing GitHub secret: RENDER_DEPLOY_HOOK"; exit 2; }

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          sep='?'
          case "$RENDER_DEPLOY_HOOK" in *\?*) sep='&' ;; esac
          deploy_url="${RENDER_DEPLOY_HOOK}${sep}ref=${GITHUB_SHA}"
          curl --fail --show-error --silent --max-time 60 "$deploy_url" > /tmp/deploy.txt
          cat /tmp/deploy.txt || true

      - name: Wait for expected NEO version
        run: |
          set -euo pipefail
          expected="$(cat /tmp/neo_version)"
          deploy_id="$(python - <<'PY'
          import json
          try:
              d=json.load(open("/tmp/deploy.txt",encoding="utf-8"))
              print(((d.get("deploy") or {}).get("id")) or "")
          except Exception:
              print("")
          PY
          )"
          for i in $(seq 1 40); do
            if [ -n "$deploy_id" ]; then
              curl --silent --show-error --max-time 30 \
                "https://neo-collettive.onrender.com/api/render/diagnostics?target=neo" \
                > /tmp/render-diag.json || true
              if DEPLOY_ID="$deploy_id" python - <<'PY'
          import json,os,sys
          try:
              d=json.load(open("/tmp/render-diag.json",encoding="utf-8"))
          except Exception:
              sys.exit(1)
          target=os.environ["DEPLOY_ID"]
          rows=d.get("recent_deploys") or []
          match=next((x for x in rows if str(x.get("id") or "")==target),None)
          if not match:
              sys.exit(1)
          status=str(match.get("status") or "")
          commit=((match.get("commit") or {}).get("id") or "")
          expected_sha=os.environ.get("GITHUB_SHA","")
          print("render_deploy_status="+status)
          print("render_deploy_commit="+str(commit))
          if status in {"build_failed","update_failed","canceled","cancelled"}:
              print(json.dumps(match,ensure_ascii=False,default=str))
              sys.exit(20)
          if status!="live" or str(commit)!=expected_sha:
              sys.exit(1)
          sys.exit(0)
          PY
              then
                render_ready=1
              else
                rc=$?
                render_ready=0
                if [ "$rc" -eq 20 ]; then
                  echo "Render marked deploy $deploy_id as failed before health changed." >&2
                  exit 7
                fi
              fi
            else
              render_ready=0
            fi
            if [ "$render_ready" -eq 1 ] && curl --fail --silent --show-error --max-time 30 \
              "https://neo-collettive.onrender.com/health" > /tmp/health.json; then
              cat /tmp/health.json
              if EXPECTED="$expected" python - <<'PY'
          import json,os,sys
          d=json.load(open("/tmp/health.json",encoding="utf-8"))
          profile=d.get("runtime_profile") or {}
          ok=(
              str(d.get("version") or "") == os.environ["EXPECTED"]
              and str(d.get("commit") or "") == os.environ.get("GITHUB_SHA","")
              and str(profile.get("profile_id") or "") == "mycelix-prod-main"
              and str(profile.get("deployment_role") or "") == "production"
          )
          sys.exit(0 if ok else 1)
          PY
              then
                echo "NEO v$expected is live on commit $GITHUB_SHA"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "Timed out waiting for NEO v$expected"
          cat /tmp/health.json || true
          exit 5

      - name: Capture Render diagnostics if version wait fails
        if: failure()
        run: |
          set +e
          echo "=== Render diagnostics for NEO ==="
          curl --silent --show-error --max-time 45 \
            "https://neo-collettive.onrender.com/api/render/diagnostics?target=neo" \
            -o /tmp/render-diagnostics.json
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "Could not fetch Render diagnostics (curl rc=$rc)"
            exit 0
          fi
          python - <<'PY'
          import json
          d=json.load(open("/tmp/render-diagnostics.json",encoding="utf-8"))
          print(json.dumps({
              "ok": d.get("ok"),
              "assessment": d.get("assessment"),
              "service": d.get("service"),
              "recent_deploys": d.get("recent_deploys"),
              "categories": d.get("categories"),
              "important": d.get("important"),
          }, ensure_ascii=False, indent=2, default=str))
          PY

      - name: Verify autopilot runtime
        run: |
          set -euo pipefail
          expected="$(cat /tmp/neo_version)"
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            "https://neo-collettive.onrender.com/api/autopilot/status" > /tmp/status.json
          cat /tmp/status.json
          EXPECTED="$expected" python - <<'PY'
          import json,os
          d=json.load(open("/tmp/status.json",encoding="utf-8"))
          ap=d.get("autopilot") or {}
          if str(d.get("neo_version") or "") != os.environ["EXPECTED"]:
              raise SystemExit("wrong runtime version")
          if not ap.get("enabled"):
              raise SystemExit("autopilot disabled")
          print("autopilot enabled; cycles_completed="+str(ap.get("cycles_completed")))
          PY

      - name: Smoke test autonomous subsystems
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --retry-delay 3 \
            "https://neo-collettive.onrender.com/api/memory/status" > /tmp/memory.json
          curl --fail --silent --show-error --retry 2 --retry-delay 3 \
            "https://neo-collettive.onrender.com/api/builder/status" > /tmp/builder.json
          curl --fail --silent --show-error --retry 2 --retry-delay 3 \
            "https://neo-collettive.onrender.com/api/autonomy/status" > /tmp/autonomy.json
          python - <<'PY'
          import json
          m=json.load(open("/tmp/memory.json",encoding="utf-8"))
          b=json.load(open("/tmp/builder.json",encoding="utf-8"))
          a=json.load(open("/tmp/autonomy.json",encoding="utf-8"))
          if not m.get("ok"):
              raise SystemExit("memory endpoint unhealthy")
          if not b.get("ok"):
              raise SystemExit("builder endpoint unhealthy")
          policy=b.get("policy") or {}
          if not policy.get("enabled"):
              raise SystemExit("autonomous builder disabled")
          if not policy.get("allowed_families"):
              raise SystemExit("builder has no allowed families")
          if b.get("external_actions_allowed") is not False:
              raise SystemExit("external action guardrail missing")
          if not a.get("ok"):
              raise SystemExit("autonomy endpoint unhealthy")
          guard=a.get("guardrails") or {}
          if any(bool(guard.get(k)) for k in ("spending","payments","contracts","commercial_outreach","external_publishing","personal_accounts")):
              raise SystemExit("autonomy guardrails unsafe")
          print("memory, builder and autonomy smoke tests passed")
          PY

      - name: Smoke test A2A discovery surface
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --retry-delay 3             "https://neo-collettive.onrender.com/.well-known/agent-card.json" > /tmp/agent-card.json
          curl --fail --silent --show-error --retry 2 --retry-delay 3             "https://neo-collettive.onrender.com/api/inbound/agents" > /tmp/inbound.json
          python - <<'PY'
          import json
          card=json.load(open("/tmp/agent-card.json",encoding="utf-8"))
          inbound=json.load(open("/tmp/inbound.json",encoding="utf-8"))
          interfaces=card.get("supportedInterfaces") or []
          versions={str(x.get("protocolVersion") or "") for x in interfaces if isinstance(x,dict)}
          bindings={str(x.get("protocolBinding") or "") for x in interfaces if isinstance(x,dict)}
          if "1.0" not in versions or "0.3" not in versions:
              raise SystemExit("A2A card does not advertise both 1.0 and 0.3")
          if "JSONRPC" not in bindings:
              raise SystemExit("A2A card missing JSONRPC binding")
          if any(k in card for k in ("protocolVersion","preferredTransport","url")):
              raise SystemExit("legacy top-level A2A fields leaked into v1 Agent Card")
          skills={str(x.get("id") or "") for x in (card.get("skills") or []) if isinstance(x,dict)}
          if "introduce-agent" not in skills or "evidence-validation" not in skills:
              raise SystemExit("A2A discovery skills missing")
          if not inbound.get("ok"):
              raise SystemExit("inbound diagnostics unhealthy")
          discovery=inbound.get("a2a_discovery") or {}
          if discovery.get("registry_enabled") is not True:
              raise SystemExit("public registry advertisement not enabled")
          print("A2A v1 discovery surface smoke test passed")
          PY

      - name: Smoke test neo-dialect surface
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 30             "https://neo-collettive.onrender.com/neo-dialect/1.0" > /tmp/neo-dialect.md
          grep -q "neo-dialect/1.0" /tmp/neo-dialect.md
          curl --fail --show-error --silent --max-time 30             "https://neo-collettive.onrender.com/.well-known/agent-card.json" > /tmp/agent-card.json
          curl --fail --show-error --silent --max-time 30             "https://neo-collettive.onrender.com/api/council" > /tmp/council.json
          curl --fail --show-error --silent --max-time 30             "https://neo-collettive.onrender.com/council/neo-dialect/example" > /tmp/dialect-example.json
          python - <<'PY'
          import json
          card=json.load(open("/tmp/agent-card.json",encoding="utf-8"))
          council=json.load(open("/tmp/council.json",encoding="utf-8"))
          example=json.load(open("/tmp/dialect-example.json",encoding="utf-8"))
          extensions=((card.get("capabilities") or {}).get("extensions") or [])
          if not any(str(x.get("params",{}).get("dialect_version") or "")=="neo-dialect/1.0" for x in extensions if isinstance(x,dict)):
              raise SystemExit("neo-dialect extension missing from Agent Card")
          d=council.get("neo_dialect") or {}
          if str(d.get("dialect_version") or "")!="neo-dialect/1.0":
              raise SystemExit("neo-dialect council report missing")
          types=[x.get("message",{}).get("type") for x in (example.get("transcript") or [])]
          if types != ["HELLO","CAPABILITIES","PROPOSE","COUNTER","AGREE","RESULT","BYE"]:
              raise SystemExit("neo-dialect example transcript incomplete")
          print("neo-dialect smoke passed")
          PY

      - name: Verify post-deploy SETI retry
        run: |
          set -euo pipefail
          expected="$(cat /tmp/neo_version)"
          for i in $(seq 1 30); do
            curl --fail --silent --show-error --max-time 30 \
              "https://neo-collettive.onrender.com/api/autopilot/status" > /tmp/seti-status.json
            if EXPECTED="$expected" python - <<'PY'
          import json,os,sys
          d=json.load(open("/tmp/seti-status.json",encoding="utf-8"))
          s=((d.get("autopilot") or {}).get("seti") or {}).get("last_summary") or {}
          ok=(
              str(d.get("neo_version") or "")==os.environ["EXPECTED"]
              and bool(s.get("engine_upgrade_retry"))
              and bool(s.get("ready_now_computed_at"))
          )
          if ok:
              counts=s.get("interview_readiness_reason_counts") or {}
              if int(counts.get("ready") or 0)!=int(s.get("interview_ready_now") or 0):
                  raise SystemExit("SETI readiness invariant failed: ready count")
              if sum(int(v or 0) for v in counts.values())!=int(s.get("eligible_candidates") or 0):
                  raise SystemExit("SETI readiness invariant failed: eligible total")
              if s.get("interview_readiness_invariant_ok") is not True:
                  raise SystemExit("SETI readiness invariant flag false")
              print(json.dumps({
                  "interview_ready_now":s.get("interview_ready_now"),
                  "ready_now_computed_at":s.get("ready_now_computed_at"),
                  "blocked_auth":s.get("blocked_auth"),
                  "in_cooldown":s.get("in_cooldown"),
                  "attempted_this_cycle":s.get("attempted_this_cycle"),
                  "last_interview_status":s.get("last_interview_status"),
                  "failure_reason_counts":s.get("interview_failure_reason_counts"),
                  "reason_counts":s.get("interview_readiness_reason_counts"),
                  "candidate_states":s.get("interview_candidate_states"),
                  "invariant_ok":s.get("interview_readiness_invariant_ok"),
                  "admitted_count":s.get("interview_admitted_count"),
              },ensure_ascii=False,indent=2))
              sys.exit(0)
          sys.exit(1)
          PY
            then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "SETI engine-upgrade retry telemetry not observed" >&2
              cat /tmp/seti-status.json
              exit 8
            fi
            sleep 10
          done
          curl --fail --silent --show-error --max-time 30 \
            "https://neo-collettive.onrender.com/api/seti/interviews" > /tmp/seti-interviews.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/seti-interviews.json",encoding="utf-8"))
          rows=d.get("interviews") or []
          print(json.dumps({
              "neo_version":d.get("neo_version"),
              "interviews":[{
                  "candidate":x.get("candidate"),
                  "status":x.get("status"),
                  "attempts":x.get("attempts"),
                  "http_status":x.get("http_status"),
                  "peer_state":x.get("peer_state"),
                  "reason":x.get("reason"),
                  "quality_reason":x.get("quality_reason"),
                  "followup_state":x.get("followup_state"),
                  "admitted":x.get("admitted"),
              } for x in rows[-8:]]
          },ensure_ascii=False,indent=2))
          PY

      - name: Run three market validation cycles
        env:
          HEARTBEAT_TOKEN: ${{ secrets.NEO_HEARTBEAT_TOKEN }}
        run: |
          set -euo pipefail
          args=(-X POST --fail --show-error --silent --max-time 600)
          if [ -n "${HEARTBEAT_TOKEN}" ]; then
            args+=(-H "X-NEO-Heartbeat-Token: ${HEARTBEAT_TOKEN}")
          fi
          curl "${args[@]}" \
            "https://neo-collettive.onrender.com/api/market/run-cycles?count=3" \
            > /tmp/market-cycles.json
          cat /tmp/market-cycles.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/market-cycles.json",encoding="utf-8"))
          if not d.get("ok"):
              raise SystemExit("market cycle validation returned ok=false")
          if int(d.get("cycles_executed") or 0) != 3:
              raise SystemExit("expected exactly 3 completed market cycles")
          if str(d.get("neo_version") or "") != "0.99.27":
              raise SystemExit("market cycles did not run on v0.99.27")
          print("market_validation_cycles=3")
          print("quality_gate="+str(bool(d.get("quality_gate"))).lower())
          PY

      - name: Dispatch fresh Jarvis snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run jarvis-runtime-snapshot-v2.yml --ref main
          echo "Jarvis runtime snapshot workflow dispatched"

      - name: Roll back failed application commit
        if: failure()
        env:
          FAILED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          current="$(git rev-parse HEAD)"
          if [ "$current" != "$FAILED_SHA" ]; then
            echo "Main advanced to $current; skip automatic rollback of $FAILED_SHA"
            exit 0
          fi
          changed="$(git show --pretty='' --name-only "$FAILED_SHA")"
          if printf '%s\n' "$changed" | grep -q '^\.github/workflows/'; then
            echo "Workflow-changing commit: automatic rollback skipped"
            exit 0
          fi
          git config user.name "NEO Safe Rollback"
          git config user.email "actions@users.noreply.github.com"
          git revert --no-edit "$FAILED_SHA"
          git push origin HEAD:main
