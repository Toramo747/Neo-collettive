name: NEO Render Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloud_mcp.py"
      - "render.yaml"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/neo-render-deploy.yml"

permissions:
  contents: read

concurrency:
  group: neo-render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Validate Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          [ -n "$RENDER_DEPLOY_HOOK" ] || { echo "Missing GitHub secret: RENDER_DEPLOY_HOOK"; exit 2; }

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 60 "$RENDER_DEPLOY_HOOK" > /tmp/deploy.txt
          cat /tmp/deploy.txt || true

      - name: Wait for NEO v0.41.0
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 30               "https://neo-collettive.onrender.com/health" > /tmp/health.json; then
              cat /tmp/health.json
              if python - <<'PY'
          import json,sys
          d=json.load(open("/tmp/health.json",encoding="utf-8"))
          sys.exit(0 if str(d.get("version") or "") == "0.41.0" else 1)
          PY
              then
                echo "NEO v0.41.0 is live"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "Timed out waiting for NEO v0.41.0"
          cat /tmp/health.json || true
          exit 5

      - name: Verify autopilot runtime
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 5             "https://neo-collettive.onrender.com/api/autopilot/status" > /tmp/status.json
          cat /tmp/status.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/status.json",encoding="utf-8"))
          ap=d.get("autopilot") or {}
          if str(d.get("neo_version") or "") != "0.41.0":
              raise SystemExit("wrong runtime version")
          if not ap.get("enabled"):
              raise SystemExit("autopilot disabled")
          print("autopilot enabled; cycles_completed="+str(ap.get("cycles_completed")))
          PY
