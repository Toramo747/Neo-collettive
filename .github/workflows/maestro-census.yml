name: Maestro Phase 1 Census (read-only)
on:
  push:
    branches:
      - arena/maestro-label-census
    paths:
      - tools/maestro_label_census.py
      - .github/workflows/maestro-census.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maestro-census
  cancel-in-progress: false
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet httpx
      # Public APIs only; prints counts as notices (no text, URLs, ids, users).
      - name: Count natural demand labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/maestro_label_census.py | grep '^::'
