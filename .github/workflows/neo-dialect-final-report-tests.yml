name: NEO Dialect Final Report Tests

on:
  push:
    paths:
      - "docs/neo-dialect/evolution-report.md"
      - "data/arena/neo-dialect-evolution-report.json"
      - "test_neo_dialect_final_report.py"
      - "cloud_mcp.py"
      - ".github/workflows/neo-dialect-final-report-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate final report and Arena publication
        run: |
          python -m py_compile cloud_mcp.py
          python -m unittest -v test_neo_dialect_final_report.py
      - name: Assert official 1.0 spec and schemas unchanged
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only HEAD^ HEAD -- docs/neo-dialect.md schemas/neo-dialect/1.0 neo_dialect.py)"
