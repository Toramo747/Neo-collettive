name: Research Gamete Fresh Screen
on:
  push:
    branches: [experiment/research-autocorrection-fresh-screen]
    paths:
      - "experiments/research-fresh-screen/**"
      - "test_research_fresh_screen.py"
      - ".github/workflows/research-fresh-screen.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shadow-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
      - name: Run isolation tests
        run: python -m unittest -v test_research_autocorrection test_research_fresh_screen
      - name: Plan only
        run: python experiments/research-fresh-screen/screen.py
      - name: Execute one bounded fresh-source screen
        run: timeout 810 python experiments/research-fresh-screen/screen.py --execute
      - name: Enforce no validation claims or production changes
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/oxibay-research-gamete-fresh-screen.json'))
          assert len(p['results'])==9
          assert p['development_screen_only'] is True
          assert p['validated_independent_rounds']==0
          assert p['automatic_promotion'] is False
          assert p['production_state_write'] is False
          assert p['raw_external_text_persisted'] is False
          assert p['synthetic_controls_pass'] is True
          assert all(x['promotion_eligible'] is False for x in p['results'])
          print({'evaluated_gametes':8,'screen_positive':sum(x['screen_verdict']=='SCREEN_POSITIVE_NOT_VALIDATED' for x in p['results']),'validated':0})
          PY
          git diff --exit-code -- data/arena neo_latest_result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-gamete-fresh-screen-aggregates
          path: /tmp/oxibay-research-gamete-fresh-screen.json
          if-no-files-found: warn
          retention-days: 30
