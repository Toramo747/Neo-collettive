name: Verify MCP Endpoints Live

on:
  workflow_run:
    workflows: ["NEO Render Deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Run seven-target live verifier probe
        run: python verify_mcp_endpoint_live_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-mcp-endpoint-live
          path: runtime/verify-mcp-endpoint-live.json
          if-no-files-found: error
