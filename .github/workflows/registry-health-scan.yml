name: Registry Health Scan

on:
  push:
    paths:
      - ".github/workflows/registry-health-scan.yml"
      - ".github/registry-health-finalize-trigger.txt"
  schedule:
    - cron: "20 18 27 9 *"
  workflow_dispatch:
    inputs:
      phase:
        description: "First census/probe or second confirmation probe"
        required: true
        default: first
        type: choice
        options:
          - first
          - finalize-first
          - second
      scan_date:
        description: "Optional YYYY-MM-DD scan directory for second phase"
        required: false
        default: ""
        type: string
      mode:
        description: "Full Registry census or time-bounded random sample"
        required: true
        default: sample
        type: choice
        options:
          - sample
          - full
      max_minutes:
        description: "Maximum wall-clock minutes for sample mode"
        required: true
        default: "30"
        type: string
      sample_from_scan_date:
        description: "Optional prior SAMPLE YYYY-MM-DD whose exact server list must be replayed"
        required: false
        default: ""
        type: string
  # Monthly cadence is intentionally disabled pending Andrea Gava approval.
  # schedule:
  #   - cron: "17 3 1 * *"

permissions:
  contents: write

concurrency:
  group: registry-health-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock

      - name: Verify scanner before network use
        run: |
          set -euo pipefail
          python -m py_compile registry_health.py registry_health_scan.py mcp_endpoint_verifier.py
          python -m unittest -v test_registry_health.py test_mcp_endpoint_verifier.py

      - name: Resolve scan phase
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$(date -u +%F)" != "2026-09-27" ]; then
              echo "One-time second probe schedule is inactive outside 2026-09-27"
              exit 0
            fi
            phase="second"
          elif [ "${{ github.event_name }}" = "push" ]; then
            message="$(git log -1 --pretty=%B "$GITHUB_SHA")"
            if printf '%s\n' "$message" | grep -Fq '[registry-finalize-first]'; then
              phase="finalize-first"
            else
              echo "Push does not authorize Registry Health execution"
              exit 0
            fi
          else
            phase="${{ inputs.phase }}"
          fi
          echo "REGISTRY_HEALTH_PHASE=$phase" >> "$GITHUB_ENV"
          echo "effective_phase=$phase"

      - name: Run Registry Health phase
        shell: bash
        env:
          REGISTRY_HEALTH_PUBLISH_CHECKPOINTS: "1"
        run: |
          set -euo pipefail
          args=("$REGISTRY_HEALTH_PHASE")
          if [ "$REGISTRY_HEALTH_PHASE" = "first" ]; then
            args+=("--mode" "${{ inputs.mode }}" "--max-minutes" "${{ inputs.max_minutes }}")
            if [ -n "${{ inputs.sample_from_scan_date }}" ]; then
              args+=("--sample-from-scan-date" "${{ inputs.sample_from_scan_date }}")
            fi
          fi
          if [ "$REGISTRY_HEALTH_PHASE" = "finalize-first" ]; then
            args+=("--scan-date" "2026-09-27")
          fi
          if [ "$REGISTRY_HEALTH_PHASE" = "second" ]; then
            scan_date="${{ inputs.scan_date }}"
            if [ -z "$scan_date" ]; then scan_date="2026-09-27"; fi
            args+=("--scan-date" "$scan_date")
          fi
          python registry_health_scan.py "${args[@]}" | tee /tmp/registry-health-run.log

      - name: Assert dataset persistence contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          from registry_health_scan import DATA_ROOT,persistence_contract
          candidates=sorted(
              p for p in DATA_ROOT.iterdir()
              if p.is_dir() and re.fullmatch(r"\d{4}-\d{2}-\d{2}",p.name)
              and (p/"scan-state.json").exists()
          )
          if not candidates:
              raise SystemExit("dated Registry Health directory missing")
          result=persistence_contract(candidates[-1],require_final=False)
          print(json.dumps(result,indent=2))
          PY

      - name: Assert scan isolation and safety telemetry
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open("data/registry-health/latest-summary.json",encoding="utf-8"))
          ext=d.get("external_verifier_metrics") or {}
          internal=d.get("internal_verifier_metrics") or {}
          if int(ext.get("calls") or 0) != 0:
              raise SystemExit("registry scan contaminated external verify_mcp_endpoint metrics")
          if str(internal.get("scope") or "") != "internal_registry_health":
              raise SystemExit("internal registry-health usage scope missing")
          if internal.get("payment_signal") is not False:
              raise SystemExit("internal scan unexpectedly marked as payment signal")
          rows=json.load(open("data/registry-health/latest-servers.json",encoding="utf-8")).get("servers") or []
          for row in rows:
              for key in ("probe1","probe2"):
                  probe=row.get(key)
                  if not isinstance(probe,dict):
                      continue
                  if probe.get("remote_tools_called") is True:
                      raise SystemExit("remote tools/call detected")
                  if probe.get("credentials_forwarded") is True:
                      raise SystemExit("credential forwarding detected")
                  if probe.get("usage_scope") not in (None,"internal_registry_health"):
                      raise SystemExit("unexpected verifier usage scope")
          print(json.dumps({
              "phase":d.get("phase"),
              "servers_total":d.get("servers_total"),
              "remote_verifiable":d.get("remote_verifiable"),
              "package_only":d.get("package_only"),
              "scanned":d.get("scanned"),
              "external_calls":ext.get("calls"),
              "internal_calls":internal.get("calls"),
          },indent=2))
          PY

      - name: Commit Registry Health dataset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MYCELIX Registry Health"
          git config user.email "actions@users.noreply.github.com"
          git add data/registry-health
          if [ -d docs/reports ]; then git add docs/reports; fi
          if git diff --cached --quiet; then
            echo "No Registry Health dataset changes"
          else
            git commit -m "registry health data: ${REGISTRY_HEALTH_PHASE} probe $(date -u +%F)"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                break
              fi
              git rebase --abort >/dev/null 2>&1 || true
              if [ "$attempt" -eq 3 ]; then
                echo "Could not publish Registry Health dataset commit" >&2
                exit 1
              fi
              sleep $((attempt * 3))
            done
          fi

      - name: Sync Arena from persisted Registry observation
        if: env.REGISTRY_HEALTH_PHASE == 'second'
        run: |
          set -euo pipefail
          python arena_micelio.py --data-dir data/arena
          python arena_evolution.py --data-dir data/arena
          python - <<'PY'
          import json
          evo=json.load(open("data/arena/evolution.json",encoding="utf-8"))
          mic=json.load(open("data/arena/micelio.json",encoding="utf-8"))
          ext=[x for x in (evo.get("predictions") or []) if x.get("prediction_scope")=="external_registry"]
          by={}
          for x in ext: by[x.get("agent")]=by.get(x.get("agent"),0)+1
          for agent in ("Scout","Analyst","Critic","Builder-planner"):
              if by.get(agent,0) < 10:
                  raise SystemExit("Arena external prediction minimum not met for "+agent)
          facts=[x for x in (mic.get("beliefs") or []) if x.get("source_scope")=="registry_health" and x.get("status")=="ACTIVE"]
          provisional=[x for x in (mic.get("beliefs") or []) if x.get("source_scope")=="registry_health" and x.get("status")=="ACTIVE" and not x.get("evidence")]
          if provisional:
              raise SystemExit("unproven Registry fact entered micelio")
          print(json.dumps({"external_predictions":len(ext),"by_agent":by,"registry_active_facts":len(facts)},indent=2))
          PY

      - name: Commit Arena outputs from FINAL Registry data
        if: env.REGISTRY_HEALTH_PHASE == 'second'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MYCELIX Registry Health"
          git config user.email "actions@users.noreply.github.com"
          git add data/arena
          git diff --cached --quiet && exit 0
          git commit -m "arena: ingest FINAL registry health $(date -u +%F) [skip render]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify Registry Health data persisted on main
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          import json,re,subprocess
          names=subprocess.check_output(["git","ls-tree","-r","--name-only","origin/main","data/registry-health"],text=True).splitlines()
          dated={}
          for name in names:
              m=re.match(r"data/registry-health/(\d{4}-\d{2}-\d{2})/(.+)$",name)
              if m: dated.setdefault(m.group(1),set()).add(m.group(2))
          if not dated: raise SystemExit("no persisted dated Registry Health scan on main")
          day=sorted(dated)[-1]
          required={"registry-snapshot.json","registry-health.json","registry-health.csv","summary.json","scan-state.json"}
          missing=required-dated[day]
          if missing: raise SystemExit("persisted dated scan incomplete: "+",".join(sorted(missing)))
          top=set(x for x in names if x.count("/")==2)
          for required_top in ("data/registry-health/latest-summary.json","data/registry-health/latest-servers.json"):
              if required_top not in top: raise SystemExit("missing persisted "+required_top)
          print(json.dumps({"persisted_scan_date":day,"files":len(dated[day])},indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/registry-health/
            docs/reports/
          if-no-files-found: warn
          retention-days: 30
