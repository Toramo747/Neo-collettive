name: MYCELIX Market Mind Deep (Kaggle GPU, private)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mycelix-market-mind-deep
  cancel-in-progress: false
jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --quiet "kaggle>=1.8.0"
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.MODEL_LABEL_REPO }}
          token: ${{ secrets.MODEL_LABEL_REPO_TOKEN }}
          path: private-labels
      # Free Kaggle GPU, private kernel. Weekly cap 25h (tracked privately).
      # Logs: counts and timings only.
      - name: Deep reflection on Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -uo pipefail
          python tools/mi_deep.py quota private-labels || { echo "weekly cap reached"; exit 0; }
          python tools/mi_deep.py build private-labels kernel "$KAGGLE_USERNAME"; rc=$?
          [ "$rc" = "3" ] && exit 0
          [ "$rc" = "0" ] || exit 1
          start=$(date +%s)
          kaggle kernels push -p kernel >/dev/null 2>&1 || { echo "::error title=Deep mind::push failed"; exit 1; }
          status=""
          for i in $(seq 1 160); do
            sleep 30
            status=$(kaggle kernels status "$KAGGLE_USERNAME/neo-market-mind" 2>&1 | grep -oiE 'complete|error|cancel[a-z]*' | head -1 || true)
            [ -n "$status" ] && break
          done
          minutes=$(( ($(date +%s) - start) / 60 ))
          echo "::notice title=Deep mind::status=${status:-timeout} wall_minutes=$minutes"
          kaggle kernels output "$KAGGLE_USERNAME/neo-market-mind" -p out >/dev/null 2>&1 || true
          [ -f out/deep.json ] || { echo "::warning title=Deep mind::no output"; exit 0; }
          python tools/mi_deep.py collect private-labels out/deep.json "$minutes"
          rm -rf out kernel
          git -C private-labels config user.name "MYCELIX Market Mind"
          git -C private-labels config user.email "actions@users.noreply.github.com"
          git -C private-labels add market-intuition/deep_inbox market-intuition/deep_usage.json
          git -C private-labels commit --quiet -m "market mind: deep reflection" || exit 0
          for attempt in 1 2 3 4; do
            git -C private-labels pull --quiet --rebase && git -C private-labels push --quiet && exit 0
            sleep $((attempt*5))
          done
          exit 1
