name: Kaggle kernel diag (read-only, sanitized)
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "kernel slug"
        required: false
        default: neo-common-mind
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --quiet "kaggle>=1.8.0"
      - env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          SLUG: ${{ inputs.slug }}
        run: |
          set +e
          st=$(kaggle kernels status "$KAGGLE_USERNAME/$SLUG" 2>&1 | tr -dc 'a-zA-Z0-9 ._:-' | head -c 200)
          echo "::notice title=kernel status::$st"
          kaggle kernels output "$KAGGLE_USERNAME/$SLUG" -p out >/dev/null 2>&1
          ls out | tr '\n' ' ' | sed 's/^/::notice title=outputs::/'; echo
          python - <<'PY'
          import glob, json, re
          for f in glob.glob("out/*.log"):
              try:
                  rows = json.load(open(f))
              except Exception:
                  rows = [{"data": l} for l in open(f, errors="replace")]
              text = "".join(str(r.get("data", "")) for r in rows if isinstance(r, dict))
              hits = [l.strip()[:160] for l in text.splitlines() if re.search(r"Error|Traceback|Exception|Killed|exited|timed out", l)]
              print("::notice title=log::lines=%d bytes=%d" % (text.count("\n"), len(text)))
              for h in hits[-12:]:
                  print("::warning title=log error::" + re.sub(r"https?://\S+", "<url>", h))
          PY
