name: NEO Arena

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Arena topic"
        required: true
        default: "quale tool MCP gratuito sarebbe più utile agli sviluppatori"
        type: string
      participants:
        description: "Comma-separated participants"
        required: true
        default: "Scout,Analyst,Critic,Builder-planner,Guest,Andrea"
        type: string
      guest_personality:
        description: "Guest personality"
        required: true
        default: "scettico"
        type: choice
        options: [collaborativo, scettico, confuso, ostile]
      max_turns:
        description: "Maximum turns (default 20, max 50)"
        required: true
        default: "20"
        type: string
      andrea_message:
        description: "Optional Andrea message"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: neo-arena
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ARENA_NAMESPACE: mycelix-arena
      ARENA_TOPIC: ${{ github.event_name == 'workflow_dispatch' && inputs.topic || 'MYCELIX autonomous arena: find falsifiable improvements without production mutation' }}
      ARENA_PARTICIPANTS: ${{ github.event_name == 'workflow_dispatch' && inputs.participants || 'Scout,Analyst,Critic,Builder-planner,Guest' }}
      ARENA_GUEST: ${{ github.event_name == 'workflow_dispatch' && inputs.guest_personality || 'scettico' }}
      ARENA_MAX_TURNS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_turns || '20' }}
      ARENA_ANDREA_MESSAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.andrea_message || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
      - name: Verify Arena isolation and protocol
        run: |
          set -euo pipefail
          python -m py_compile arena_core.py arena_micelio.py arena_evolution.py arena_registry_world.py neo_dialect.py
          python -m unittest -v test_arena_core.py test_arena_micelio.py test_arena_evolution.py test_arena_registry_world.py test_neo_dialect.py test_neo_dialect_security.py
      - name: Validate input bounds
        run: |
          python - <<'PY'
          import os
          n=int(os.environ["ARENA_MAX_TURNS"])
          if n < 4 or n > 50:
              raise SystemExit("max_turns must be between 4 and 50")
          PY
      - name: Run isolated deterministic Arena session
        run: |
          set -euo pipefail
          python arena_core.py             --topic "$ARENA_TOPIC"             --participants "$ARENA_PARTICIPANTS"             --guest-personality "$ARENA_GUEST"             --max-turns "$ARENA_MAX_TURNS"             --andrea-message "$ARENA_ANDREA_MESSAGE"             | tee /tmp/arena-result.json
      - name: Sync and reverify isolated micelio
        run: |
          set -euo pipefail
          python arena_micelio.py --data-dir data/arena
          python - <<'PY'
          import json
          d=json.load(open("data/arena/micelio.json",encoding="utf-8"))
          if d.get("namespace")!="mycelix-arena": raise SystemExit("micelio namespace mismatch")
          bad=[x for x in (d.get("beliefs") or []) if not x.get("evidence") and x.get("status")=="ACTIVE"]
          if bad: raise SystemExit("unproven belief became active")
          print("Micelio verification boundary passed")
          PY
      - name: Evaluate Arena strategy predictions
        run: |
          set -euo pipefail
          python arena_evolution.py --data-dir data/arena
          python - <<'PY'
          import json
          d=json.load(open("data/arena/evolution.json",encoding="utf-8"))
          if d.get("namespace")!="mycelix-arena": raise SystemExit("evolution namespace mismatch")
          if (d.get("production_proposal") or {}).get("automatic_promotion") is not False:
              raise SystemExit("automatic production promotion enabled")
          if any(bool(x.get("production_promoted")) for x in (d.get("variants") or [])):
              raise SystemExit("variant auto-promoted")
          ext=[x for x in (d.get("predictions") or []) if x.get("prediction_scope")=="external_registry"]
          if ext:
              by={}
              for x in ext: by[x.get("agent")]=by.get(x.get("agent"),0)+1
              for agent in ("Scout","Analyst","Critic","Builder-planner"):
                  if by.get(agent,0)<10: raise SystemExit("external prediction minimum not met for "+agent)
          controls=[x for x in (d.get("predictions") or []) if x.get("prediction_scope")=="system_control"]
          if any(float(x.get("score_weight") or 0.0)!=0.0 for x in controls):
              raise SystemExit("system control prediction has nonzero evolution weight")
          print("Evolution external-world boundary passed")
          PY
      - name: Assert production isolation
        run: |
          python - <<'PY'
          import json,glob
          rows=glob.glob("data/arena/sessions/*.json")
          if not rows: raise SystemExit("session output missing")
          d=json.load(open(sorted(rows)[-1],encoding="utf-8"))
          b=d.get("boundary") or {}
          required={
            "production_state_write":False,
            "tool_opportunity_influence":"NONE",
            "commercial_evidence_influence":"NONE",
            "seti_peer_memory_influence":"NONE",
            "external_usage_metrics_influence":"NONE",
            "external_agent_contact":False,
            "production_variant_promotion":False,
          }
          for k,v in required.items():
              if b.get(k)!=v: raise SystemExit(f"isolation failure: {k}")
          if d.get("namespace")!="mycelix-arena": raise SystemExit("wrong namespace")
          print("Arena isolation verified")
          PY
      - name: Publish precomputed read-only Arena data
        run: |
          set -euo pipefail
          git config user.name "MYCELIX Arena"
          git config user.email "actions@users.noreply.github.com"
          git add data/arena
          git commit -m "arena session: $ARENA_TOPIC [skip render]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*3))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neo-arena-${{ github.run_id }}
          path: data/arena/
          retention-days: 30
