name: Snapshot v0.99.18 final state
on:
  push:
    branches: [verify-v09918-snap2]
permissions:
  contents: read
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read status
        run: |
          curl -fsS --max-time 20 https://neo-collettive.onrender.com/api/autopilot/status > /tmp/s.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/s.json"))
          ap=d.get("autopilot") or {}; s=ap.get("seti") or {}; sm=s.get("last_summary") or {}
          out={k:v for k,v in {
            "neo_version":d.get("neo_version"),"cycles_completed":ap.get("cycles_completed"),
            "running":ap.get("running"),"last_started_utc":ap.get("last_started_utc"),
            "last_finished_utc":ap.get("last_finished_utc"),"last_error":ap.get("last_error"),
            "seti_engine_version":s.get("engine_version"),"seti_last_scan_utc":s.get("last_scan_utc"),
            "seti_last_error":s.get("last_error"),"aicomglobal_status":sm.get("aicomglobal_status"),
            "aicomglobal_attempted":sm.get("aicomglobal_attempted"),
            "aicomglobal_candidates":sm.get("aicomglobal_candidates"),
            "aicomglobal_sources":sm.get("aicomglobal_candidate_sources"),
            "peer_registry_count":sm.get("peer_registry_count"),
            "peer_registry_status_counts":sm.get("peer_registry_status_counts"),
            "interview_status":sm.get("last_interview_status"),
            "eligible_candidates":sm.get("eligible_candidates"),
            "interview_ready_now":sm.get("interview_ready_now"),
            "query_executed_count":len(((ap.get("query_execution") or {}).get("executed") or [])),
          }.items()}
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
