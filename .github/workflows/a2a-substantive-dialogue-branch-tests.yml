name: A2A Substantive Dialogue Branch Tests

on:
  push:
    branches:
      - mycelix-a2a-substantive-dialogue-20260929

permissions:
  contents: read

jobs:
  stdlib-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile changed stdlib modules
        run: python -m compileall -q public_snapshot.py inbound_traffic.py intent_discovery.py inbound_security.py
      - name: Run safety and telemetry tests without network dependencies
        run: python -m unittest -v test_public_snapshot_privacy.py test_inbound_traffic.py test_intent_discovery.py test_inbound_security.py
