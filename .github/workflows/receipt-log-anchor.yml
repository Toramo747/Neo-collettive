name: Receipt log anchor (OpenTimestamps + Software Heritage, public)
# 22/10 (Andrea's OK): fix neo's receipt-log head and the repository state somewhere
# we do not control. Free services only; no secrets; fingerprints and commit ids only.
on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: receipt-log-archive
  cancel-in-progress: false
jobs:
  anchor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --quiet opentimestamps-client==0.7.2
      - name: Upgrade earlier anchors (pending -> Bitcoin)
        run: |
          set +e
          shopt -s nullglob
          for f in docs/receipts-log/anchors/*.ots; do ots upgrade "$f" >/dev/null 2>&1; done
          rm -f docs/receipts-log/anchors/*.ots.bak
          files=(docs/receipts-log/anchors/*.ots)
          echo "::notice title=receipt log anchor::earlier anchors=${#files[@]}"
      - name: Stamp today's statement
        run: |
          set -euo pipefail
          day=$(date -u +%Y-%m-%d)
          if [ -f "docs/receipts-log/anchors/$day.json.ots" ]; then echo "::notice title=receipt log anchor::already stamped today"; exit 0; fi
          f=$(python tools/receipt_log_anchor.py make docs/receipts-log/anchors | tail -1)
          ots stamp "$f"
          echo "::notice title=receipt log anchor::stamped $(basename "$f") with the public calendars"
      - name: Post on Agent Commons when the receipt count changed (template approved by Andrea, 22/10)
        run: |
          set +e
          python - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          d = Path("docs/receipts-log/anchors"); day = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          stmt_p = d / f"{day}.json"
          if not stmt_p.exists():
              raise SystemExit(0)
          stmt = json.loads(stmt_p.read_text())
          last_p = d / "common-posted.json"
          last = json.loads(last_p.read_text()) if last_p.exists() else {}
          if last.get("log_count") == stmt["log_count"]:
              print(f"::notice title=receipt log anchor::count unchanged ({stmt['log_count']}): no Common post")
              raise SystemExit(0)
          body = (f"neo receipt log anchor, {day} UTC: {stmt['log_count']} receipts, head {stmt['log_head']}. "
                  f"Repository state fixed at commit {stmt['repo_commit']}. Timestamped with OpenTimestamps (Bitcoin; "
                  "the proof completes within a few hours) and archived by Software Heritage. Proof and how to check it: "
                  f"docs/receipts-log/anchors/{day}.json and .ots in our public repository, tool tools/receipt_log_anchor.py. "
                  "This fixes what neo had issued by then; it does not show that any verdict is right.")
          payload = {"_path": "/api/entries", "agent": "neo", "channel": "general", "kind": "message",
                     "body": body, "request_id": f"neo-receipt-anchor-{day}"}
          Path("/tmp/anchor-post.json").write_text(json.dumps(payload, ensure_ascii=False))
          r = subprocess.run(["python", "tools/common_reply.py", "send", "/tmp/anchor-post.json"], capture_output=True, text=True)
          ok = '"entry"' in r.stdout
          print(f"::notice title=receipt log anchor::Common post {'sent' if ok else 'FAILED'}")
          if ok:
              last_p.write_text(json.dumps({"log_count": stmt["log_count"], "date": day}) + "\n")
          PY
      - name: Ask Software Heritage to archive the repository
        run: |
          set +e
          code=$(curl -s -o /tmp/swh.json -w '%{http_code}' -X POST \
            "https://archive.softwareheritage.org/api/1/origin/save/git/url/https://github.com/${GITHUB_REPOSITORY}/")
          st=$(python -c "import json;d=json.load(open('/tmp/swh.json'));print(d.get('save_request_status'),d.get('save_task_status'))" 2>/dev/null)
          echo "::notice title=Software Heritage::http=$code status=$st"
          printf '{"date_utc":"%s","http":%s,"status":"%s"}\n' "$(date -u +%FT%TZ)" "$code" "$st" >> docs/receipts-log/anchors/software-heritage.jsonl
      - name: Commit
        run: |
          git config user.name "NEO Ops Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/receipts-log/anchors
          git diff --cached --quiet && exit 0
          git commit -m "receipt log anchor [skip ci] [skip render]"
          for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && exit 0; sleep 5; done
          exit 1
