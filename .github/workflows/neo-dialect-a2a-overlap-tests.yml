name: NEO Dialect A2A Overlap Tests

on:
  push:
    paths:
      - "docs/neo-dialect/a2a-overlap.md"
      - "test_neo_dialect_a2a_overlap_docs.py"
      - ".github/workflows/neo-dialect-a2a-overlap-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate A2A overlap document
        run: python -m unittest -v test_neo_dialect_a2a_overlap_docs.py
      - name: Assert production specification is not changed by this point
        run: |
          set -euo pipefail
          git diff HEAD^ HEAD -- docs/neo-dialect.md schemas/neo-dialect/1.0 neo_dialect.py
          test -z "$(git diff --name-only HEAD^ HEAD -- docs/neo-dialect.md schemas/neo-dialect/1.0 neo_dialect.py)"
