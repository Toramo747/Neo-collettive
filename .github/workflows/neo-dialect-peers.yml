name: NEO Dialect Real Peer Harness

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  peer-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GITHUB_MODELS_TOKEN: ${{ github.token }}
      GITHUB_MODELS_ENDPOINT: "https://models.github.ai/inference"
      NEO_DIALECT_GITHUB_MODELS_ONLY: "1"
      NEO_DIALECT_FREE_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Unit test harness
        run: python -m unittest -v test_neo_dialect.py test_dialect_peer_harness.py test_neo_dialect_security.py
      - name: Run GitHub Models peers
        id: real
        continue-on-error: true
        run: python dialect_peer_harness.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neo-dialect-peer-report
          path: neo_dialect_peer_report.json
          if-no-files-found: warn
      - name: Report harness status
        if: steps.real.outcome != 'success'
        run: |
          echo "GitHub Models harness did not complete. Inspect neo-dialect-peer-report artifact."
          exit 1
