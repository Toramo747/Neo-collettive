name: MCP Endpoint Verifier Tests

on:
  push:
    branches: [main]
    paths:
      - "mcp_endpoint_verifier.py"
      - "test_mcp_endpoint_verifier.py"
      - ".github/workflows/mcp-endpoint-verifier-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Compile verifier
        run: python -m py_compile mcp_endpoint_verifier.py test_mcp_endpoint_verifier.py
      - name: Run verifier security tests
        run: python -m unittest -v test_mcp_endpoint_verifier.py
