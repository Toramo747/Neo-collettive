name: AgentWorld Passive Research Probe

on:
  push:
    branches:
      - research/agentworld-probe
    paths:
      - "tools/agentworld_probe/**"
      - "test_agentworld_probe.py"
      - ".github/workflows/agentworld-passive-probe.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

concurrency:
  group: agentworld-passive-research
  cancel-in-progress: false

jobs:
  passive-sample:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hydrate samples from dedicated data branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin refs/heads/research/agentworld-data >/dev/null 2>&1; then
            git fetch --no-tags origin               refs/heads/research/agentworld-data:refs/remotes/origin/research/agentworld-data
            rm -rf research/agentworld
            mkdir -p research
            git checkout refs/remotes/origin/research/agentworld-data -- research/agentworld

            if [ -d research/agentworld/agentworld ] && [ ! -f research/agentworld/samples.jsonl ]; then
              normalize_tmp="$(mktemp -d)"
              cp -a research/agentworld/agentworld/. "$normalize_tmp/"
              rm -rf research/agentworld
              mkdir -p research/agentworld
              cp -a "$normalize_tmp/." research/agentworld/
            fi
          fi

      - name: Enforce probe policy tests
        run: python -m unittest -v test_agentworld_probe.py

      - name: Run one isolated GET-only sample
        run: python tools/agentworld_probe/probe.py scheduled

      - name: Verify no query-bearing document endpoint is encoded
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          needle = "/.well-known/agentworld.json" + "?"
          for path in (Path("tools/agentworld_probe"), Path("test_agentworld_probe.py")):
              files = [path] if path.is_file() else list(path.rglob("*"))
              for file in files:
                  if file.is_file() and needle in file.read_text(encoding="utf-8", errors="ignore"):
                      raise SystemExit(f"forbidden query-bearing endpoint pattern found in {file}")
          PY

      - name: Publish research outputs to dedicated orphan data branch
        shell: bash
        run: |
          set -euo pipefail

          tmpdir="$(mktemp -d)"
          mkdir -p "$tmpdir/research"
          cp -a research/agentworld "$tmpdir/research/agentworld"

          # Source worktree is disposable after outputs are copied to tmp.
          # Reset before switching branches so generated files can never be committed to the source branch.
          git reset --hard HEAD
          git clean -fd

          if git ls-remote --exit-code --heads origin refs/heads/research/agentworld-data >/dev/null 2>&1; then
            git fetch --no-tags origin               refs/heads/research/agentworld-data:refs/remotes/origin/research/agentworld-data
            git checkout -B research/agentworld-data refs/remotes/origin/research/agentworld-data
            git rm -rf . >/dev/null 2>&1 || true
          else
            git checkout --orphan research/agentworld-data
            git rm -rf . >/dev/null 2>&1 || true
          fi

          rm -rf research/agentworld
          mkdir -p research/agentworld
          cp -a "$tmpdir/research/agentworld/." research/agentworld/
          git add research/agentworld

          unexpected="$(git ls-files | grep -v '^research/agentworld/' || true)"
          if [ -n "$unexpected" ]; then
            echo "Refusing to publish non-AgentWorld paths to data branch:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 3
          fi

          git diff --cached --quiet && exit 0
          git config user.name "MYCELIX Passive Research"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Record AgentWorld passive research sample"
          git push origin HEAD:research/agentworld-data
