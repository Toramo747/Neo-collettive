name: AgentWorld Passive Research Probe

on:
  push:
    branches:
      - research/agentworld-probe
    paths:
      - "tools/agentworld_probe/**"
      - "test_agentworld_probe.py"
      - ".github/workflows/agentworld-passive-probe.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: agentworld-passive-research
  cancel-in-progress: false

jobs:
  passive-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce probe policy tests
        run: python -m unittest -v test_agentworld_probe.py

      - name: Run one isolated GET-only sample
        run: python tools/agentworld_probe/probe.py scheduled

      - name: Verify forbidden invitation pattern is absent from code and logs input
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --fixed-string "/.well-known/agentworld.json?" tools/agentworld_probe .github/workflows/agentworld-passive-probe.yml; then
            echo "Forbidden invitation URL pattern found" >&2
            exit 1
          fi

      - name: Commit research outputs only
        shell: bash
        run: |
          set -euo pipefail
          git add research/agentworld
          git diff --cached --quiet && exit 0
          git config user.name "MYCELIX Passive Research"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Record AgentWorld passive research sample"
          git push origin HEAD:${{ github.ref_name }}
