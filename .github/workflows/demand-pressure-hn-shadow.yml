name: Demand Pressure HN Shadow (free public)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demand-pressure-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
      - name: Verify offline invariants
        run: python -m unittest -v test_demand_pressure test_demand_pressure_hn_shadow
      - name: Verify bounded provider plan
        run: python experiments/demand-pressure/hn_shadow.py
      - name: Execute public HN shadow once (max 16 requests)
        run: timeout 300 python experiments/demand-pressure/hn_shadow.py --execute
      - name: Check privacy and isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/oxibay-ipd-hn-shadow-aggregates.json").read_text())
          assert r["queries_planned"]==16
          assert r["independent_human_labels"]==r["verified_unique_human_buyers"]==0
          assert r["production_state_write"] is False
          assert r["automatic_promotion"] is False
          assert r["commercial_gate_influence"]=="NONE"
          assert not r["raw_text_persisted"] and not r["external_ids_persisted"]
          assert set(r["topics"])=={"restaurant_booking","inventory_alert","file_access","returns_label"}
          for topic, result in r["topics"].items():
              if result["status"]=="EXPLORATORY_UNVERIFIED":
                  assert result["ipd"]["verified_requester_tokens"]==0
                  assert result["ipd"]["commercial_gate_influence"]=="NONE"
              else:
                  assert result["status"]=="INCONCLUSIVE_PROVIDER_FAILURE"
          assert "secret_phrase_xyz" not in json.dumps(r)
          print({"status":"AGGREGATE_ONLY","topics":len(r["topics"]),"human_verified":0})
          PY
          git diff --exit-code -- data/arena neo_latest_result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demand-pressure-hn-aggregates-only
          path: /tmp/oxibay-ipd-hn-shadow-aggregates.json
          if-no-files-found: warn
          retention-days: 7
