name: MYCELIX v0.99.14 validation

on:
  push:
    branches: [mycelix-demand-guards-v09914]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install -q -r requirements.txt pytest

      - name: Compile changed modules
        run: |
          set -euo pipefail
          python -m py_compile             cloud_mcp.py evidence_integrity.py ingestion_diagnostics.py             quarantine_revalidation.py query_builder.py

      - name: Run full pytest suite with network blocked
        run: |
          set -euo pipefail
          python - <<'PY'
          import socket
          import pytest

          def blocked(*args, **kwargs):
              raise RuntimeError("network disabled during tests")

          socket.create_connection=blocked
          socket.socket.connect=blocked
          raise SystemExit(pytest.main(["-q"]))
          PY

      - name: Audit real snapshot migration
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from evidence_integrity import migrate_evidence_memory

          snap=json.load(open("neo_latest_result.json",encoding="utf-8"))
          rows=(snap.get("autopilot") or {}).get("commercial_evidence_memory") or []
          migrated,meta=migrate_evidence_memory(
              rows,
              enforce_family_match=True,
              strong_pain_only=True,
              seller_launch_guard=True,
              vendor_content_guard=True,
              web_buyer_voice_guard=True,
              supply_offer_guard=True,
              query_echo_guard=True,
          )
          reasons=Counter(str(r.get("quarantine_reason") or "gate_eligible") for r in migrated)
          positive={"PAIN","BUY_INTENT","PAID_DEMAND"}
          unsafe=[
              r for r in migrated
              if str(r.get("signal_reverted") or "") in {"supply_offer","vendor_content","seller_launch","web_buyer_voice_missing"}
              and positive.intersection(set(r.get("signal_types") or []))
          ]
          if unsafe:
              raise SystemExit("guarded rows retain positive demand")
          print("snapshot_rows="+str(len(rows)))
          print("migration_changed="+str(meta.get("changed") or 0))
          print("quarantine_reasons="+json.dumps(dict(sorted(reasons.items())),sort_keys=True))
          print("guarded_positive_rows=0")
          PY

      - name: Verify version and gate constants
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          src=open("cloud_mcp.py",encoding="utf-8").read()
          m=re.search(r'^VERSION = "([^"]+)"',src,re.M)
          if not m or m.group(1)!="0.99.14":
              raise SystemExit("wrong VERSION")
          required=(
              "len(domains)>=3",
              "len(fresh_domains)>=2",
              "len(strong_domains)>=1",
              '"PAID_DEMAND" in tags',
              '("BUY_INTENT" in tags or "PAIN" in tags)',
          )
          for item in required:
              if item not in src:
                  raise SystemExit("gate condition missing: "+item)
          print("version=0.99.14")
          print("gate_thresholds_unchanged=true")
          PY
