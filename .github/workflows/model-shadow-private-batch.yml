name: Model Shadow Private Batch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/model-shadow-private-batch.yml"
      - "tools/model_shadow_resumable.py"
      - "tools/model_shadow_publish_gate.py"
      - "tools/model_shadow_batch.py"
      - "tools/model_shadow_diagnostics.py"
      - "tools/model_archive_import.py"
      - "tools/model_eval_sync.py"
      - "model_shadow_registry.json"
  workflow_dispatch:
    inputs:
      collect_only:
        description: "Import real observations privately without training or publishing"
        required: false
        type: boolean
        default: false
      publish_student:
        description: "Legacy input; eligible shadow students are published automatically, and this input cannot bypass quality gates"
        required: false
        type: boolean
        default: false
      publish_clusters:
        description: "Send HMAC-only challenge cluster map to Render"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: model-shadow-private-batch
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check private archive configuration
        id: config
        env:
          MODEL_LABEL_REPO: ${{ vars.MODEL_LABEL_REPO }}
          MODEL_LABEL_REPO_TOKEN: ${{ secrets.MODEL_LABEL_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$MODEL_LABEL_REPO" ] || [ -z "$MODEL_LABEL_REPO_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo '{"private_archive":"not_configured","batch":"skipped"}'
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo '{"private_archive":"configured"}'
          fi

      - name: Checkout private label archive
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.MODEL_LABEL_REPO }}
          token: ${{ secrets.MODEL_LABEL_REPO_TOKEN }}
          path: private-labels
          fetch-depth: 0

      - name: Drain existing labels before importing another corpus
        id: backlog
        if: steps.config.outputs.configured == 'true'
        run: python tools/model_shadow_resumable.py --private-dir private-labels --check-import --github-output "$GITHUB_OUTPUT"

      - name: Import real observations only into private archive
        if: steps.config.outputs.configured == 'true' && (steps.backlog.outputs.import_allowed == 'true' || inputs.collect_only == true)
        env:
          NEO_HEARTBEAT_TOKEN: ${{ secrets.NEO_HEARTBEAT_TOKEN }}
        run: |
          set -euo pipefail
          python tools/model_archive_import.py private-labels
          git -C private-labels config user.name "NEO Private Label Bot"
          git -C private-labels config user.email "actions@users.noreply.github.com"
          git -C private-labels add train.jsonl public.jsonl ARCHIVE_GUIDE.md
          if ! git -C private-labels diff --cached --quiet; then
            git -C private-labels commit --quiet -m "import real shadow observations and archive contract"
            git -C private-labels push --quiet
          fi

      - name: Remove tracked hidden set from private archive
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          git -C private-labels config user.name "NEO Private Label Bot"
          git -C private-labels config user.email "actions@users.noreply.github.com"
          if git -C private-labels ls-files --error-unmatch hidden.jsonl >/dev/null 2>&1; then
            git -C private-labels rm --cached -f hidden.jsonl
            rm -f private-labels/hidden.jsonl
            git -C private-labels commit --quiet -m "remove hidden evaluation set from version control"
            git -C private-labels push --quiet
          else
            rm -f private-labels/hidden.jsonl
          fi

      - name: Sync public and temporary hidden evaluation sets
        if: steps.config.outputs.configured == 'true'
        env:
          NEO_HEARTBEAT_TOKEN: ${{ secrets.NEO_HEARTBEAT_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/model-shadow-eval"
          python tools/model_eval_sync.py private-labels "$RUNNER_TEMP/model-shadow-eval/hidden.jsonl"
          ln -s "$RUNNER_TEMP/model-shadow-eval/hidden.jsonl" private-labels/hidden.jsonl
          if git -C private-labels ls-files --error-unmatch hidden.jsonl >/dev/null 2>&1; then
            echo "hidden.jsonl must never be tracked" >&2
            exit 1
          fi

      - name: Check training prerequisites before heavy downloads
        id: training
        if: steps.config.outputs.configured == 'true'
        env:
          COLLECT_ONLY: ${{ inputs.collect_only || false }}
        run: |
          python - <<'PYCODE'
          import json,os
          from pathlib import Path
          path=Path('private-labels/train.jsonl')
          count=sum(bool(line.strip()) for line in path.read_text().splitlines())
          ready=count>=4 and os.getenv('COLLECT_ONLY','false').lower()!='true'
          with open(os.environ['GITHUB_OUTPUT'],'a') as fh:
              fh.write('ready='+str(ready).lower()+'\n')
          print(json.dumps({'train_cases':count,'training_ready':ready}))
          PYCODE

      - uses: actions/setup-python@v5
        if: steps.training.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Cache pinned model downloads
        if: steps.training.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hf-cache
          key: model-shadow-v1-${{ runner.os }}-${{ hashFiles('model_shadow_registry.json') }}
          restore-keys: |
            model-shadow-v1-${{ runner.os }}-

      - name: Install CPU batch dependencies
        if: steps.training.outputs.ready == 'true'
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_AVX512=OFF -DGGML_AVX512_VBMI=OFF -DGGML_AVX512_VNNI=OFF -DGGML_AVX512_BF16=OFF -DGGML_AVX_VNNI=OFF -DGGML_LLAMAFILE=OFF"
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check "numpy==2.3.3" "transformers==4.57.1" "sentence-transformers==5.1.1" "huggingface-hub==0.35.3" "sentencepiece==0.2.1" "protobuf==6.33.0"
          python -m pip install --disable-pip-version-check --no-cache-dir --no-binary=llama-cpp-python "llama-cpp-python==0.3.16"

      - name: Run pinned multi-judge batch
        id: judge
        if: steps.training.outputs.ready == 'true'
        env:
          HF_HOME: ${{ runner.temp }}/hf-cache
          HF_HUB_DISABLE_XET: "1"
          MODEL_SHADOW_STAGE_PATH: /tmp/model-shadow-stage.json
          MODEL_CLUSTER_HMAC_KEY: ${{ secrets.MODEL_CLUSTER_HMAC_KEY }}
          NEO_HEARTBEAT_TOKEN: ${{ secrets.NEO_HEARTBEAT_TOKEN }}
        run: |
          set -euo pipefail
          ulimit -c 0
          git -C private-labels config user.name "NEO Private Label Bot"
          git -C private-labels config user.email "actions@users.noreply.github.com"
          batch_started_seconds=$SECONDS
          # Catch up in bounded segments, preserving each segment remotely.
          # Stop starting new work after 70 minutes, leaving room for evaluation
          # and cleanup within the job's existing 120-minute timeout.
          for segment in 1 2 3 4 5 6 7 8; do
            rm -f /tmp/model-shadow-stage.json
            if python tools/model_shadow_resumable.py --private-dir private-labels --output-dir runtime/model-shadow --max-judge-cases 50 --review-sample > /tmp/model-shadow-metrics.json 2>/tmp/model-shadow-private-errors; then
              :
            else
              batch_exit_code=$?
              cat /tmp/model-shadow-metrics.json
              python tools/model_shadow_diagnostics.py --exit-code "$batch_exit_code" --stage-path /tmp/model-shadow-stage.json
              exit 1
            fi
            python -m json.tool /tmp/model-shadow-metrics.json >/dev/null
            cat /tmp/model-shadow-metrics.json
            for file in train_labeled.jsonl weekly_review_queue.jsonl weekly_review.html drift_history.jsonl model_shadow_state.json private_batch_report.json; do
              if [ -f "private-labels/$file" ]; then
                git -C private-labels add "$file"
              fi
            done
            if ! git -C private-labels diff --cached --quiet; then
              git -C private-labels commit --quiet -m "checkpoint completed shadow batch segment"
              git -C private-labels push --quiet
            fi
            if [ "$((SECONDS - batch_started_seconds))" -ge 4200 ]; then
              break
            fi
            if ! python - <<'PYCODE'
          import json
          metrics=json.load(open('/tmp/model-shadow-metrics.json',encoding='utf-8'))
          more=(metrics.get('batch_complete') is False
                and int(metrics.get('batch_remaining') or 0)>0
                and int(metrics.get('batch_processed') or 0)>0)
          raise SystemExit(0 if more else 1)
          PYCODE
            then
              break
            fi
          done

      - name: Privacy-check publicable outputs
        if: steps.training.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          from pathlib import Path
          from tools.model_shadow_privacy_check import check_file
          for path in Path('runtime/model-shadow').glob('*.json'):
              check_file(path)
          PYCODE

      - name: Preserve completed labels privately even when a later case fails
        if: always() && steps.training.outputs.ready == 'true' && (steps.judge.conclusion == 'success' || steps.judge.conclusion == 'failure')
        working-directory: private-labels
        run: |
          set -euo pipefail
          git config user.name "NEO Private Label Bot"
          git config user.email "actions@users.noreply.github.com"
          for file in train_labeled.jsonl weekly_review_queue.jsonl weekly_review.html drift_history.jsonl model_shadow_state.json; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo '{"private_archive_update":"unchanged"}'
          else
            git commit --quiet -m "shadow labels and weekly review"
            git push --quiet
            echo '{"private_archive_update":"published"}'
          fi

      - name: Check and publish eligible shadow student
        id: shadow_publish
        if: steps.training.outputs.ready == 'true'
        run: python tools/model_shadow_publish_gate.py --metrics runtime/model-shadow/metrics.json --student runtime/model-shadow/student.json --github-output "$GITHUB_OUTPUT"

      - name: Publish eligible student to shadow runtime
        if: github.ref == 'refs/heads/main' && steps.shadow_publish.outputs.publishable == 'true'
        run: |
          set -euo pipefail
          git config user.name "NEO Model Shadow"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/model-shadow/student.json runtime/model-shadow/metrics.json
          if git diff --cached --quiet; then
            echo '{"student_publish":"unchanged"}'
            exit 0
          fi
          git commit -m "model-shadow: publish evaluated shadow student"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo '{"student_publish":"published","mode":"shadow","production_promotion":false}'
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: Send HMAC-only clusters after explicit manual request
        if: steps.training.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.publish_clusters == true
        env:
          HEARTBEAT_TOKEN: ${{ secrets.NEO_HEARTBEAT_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f runtime/model-shadow/challenge-cluster-map.json ]; then
            echo '{"cluster_map_available":false}'
            exit 0
          fi
          target="https://neo-collettive.onrender.com/api/model-shadow/challenge-clusters"
          proof="$(NEO_HEARTBEAT_TOKEN="$HEARTBEAT_TOKEN" python self_traffic_auth.py sign-url "$target" --marker github-actions-model-shadow)"
          curl --fail --silent --show-error --max-time 45 -X POST -H "content-type: application/json" -H "X-MYCELIX-Self-Traffic: github-actions-model-shadow" -H "X-MYCELIX-Self-Traffic-Proof: $proof" --data-binary @runtime/model-shadow/challenge-cluster-map.json "$target" > /tmp/model-shadow-cluster-response.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/model-shadow-cluster-response.json",encoding="utf-8"))
          print({k:d.get(k) for k in ("ok","mode","mapping_count","cluster_count","review_required","checkpoint_ok")})
          if d.get("ok") is not True or d.get("mode")!="shadow":
              raise SystemExit("shadow cluster upload failed")
          PY
