name: Common mind drafts on GitHub CPU (fallback when the Kaggle GPU queue is stuck)
on:
  workflow_dispatch:
    inputs:
      replay:
        description: "re-draft the latest messages for evaluation (does not mark them handled)"
        required: false
        default: ""
      keyed:
        description: "keyed memory trial: draft from the matching memories only (1 = on; checkers still use the whole sheet)"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: common-mind-cpu
  cancel-in-progress: false
jobs:
  drafts:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.MODEL_LABEL_REPO }}
          token: ${{ secrets.MODEL_LABEL_REPO_TOKEN }}
          path: private-labels
      - name: Draft on CPU (same kernel script, same models, same guard)
        env:
          REPLAY: ${{ inputs.replay || '' }}
          KEYED_MEMORY: ${{ inputs.keyed || '' }}
        run: |
          set +e -uo pipefail
          python tools/common_deep.py build private-labels kernel cpu "$REPLAY"; rc=$?
          if [ "$rc" != "0" ]; then echo "::notice title=Common mind CPU::nothing to draft"; exit 0; fi
          W="$GITHUB_WORKSPACE/kw"; mkdir -p "$W"
          # same driver, run here: working dir moved off /kaggle, longer CPU timeouts
          sed -i "s#\"/kaggle/working\"#\"$W\"#; s#timeout=300#timeout=1500#g" kernel/mind.py
          # 19/10 first try: exit 137 (memory). The install script starts a systemd ollama that
          # keeps several models loaded; run our own server instead: one model at a time,
          # models on /mnt, plus swap as a safety margin.
          sudo apt-get install -y -qq zstd >/dev/null 2>&1
          curl -fsSL https://ollama.com/install.sh | sh >/dev/null 2>&1
          sudo systemctl stop ollama >/dev/null 2>&1; sudo systemctl disable ollama >/dev/null 2>&1
          sudo fallocate -l 8G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile >/dev/null && sudo swapon /mnt/swapfile
          sudo mkdir -p /mnt/ollama && sudo chmod 777 /mnt/ollama
          (OLLAMA_MODELS=/mnt/ollama OLLAMA_MAX_LOADED_MODELS=1 OLLAMA_NUM_PARALLEL=1 OLLAMA_KEEP_ALIVE=0 ollama serve >/dev/null 2>&1 &)
          sleep 5
          # the driver's own install/serve lines are for Kaggle: skip them here
          sed -i 's#curl -fsSL https://ollama.com/install.sh | sh#true#; s#apt-get install -y -qq zstd#true#' kernel/mind.py
          echo "::notice title=Common mind CPU::mem=$(free -g | awk '/Mem:/{print $2}')G swap=$(free -g | awk '/Swap:/{print $2}')G disk_mnt=$(df -BG /mnt | awk 'NR==2{print $4}')"
          start=$(date +%s)
          OLLAMA_MODELS=/mnt/ollama python kernel/mind.py > /tmp/mind.log 2>&1; rc=$?
          minutes=$(( ($(date +%s) - start) / 60 ))
          echo "::notice title=Common mind CPU::driver rc=$rc wall_minutes=$minutes drafts_file=$([ -f "$W/drafts.json" ] && echo yes || echo no)"
          [ -f "$W/drafts.json" ] || { grep -oE "^[A-Za-z_.]*(Error|Exception)[A-Za-z_.]*" /tmp/mind.log | tail -3 | sed 's/^/::warning title=driver error type::/' ; exit 1; }
          # collect on a fresh copy each attempt: a Kaggle run collected meanwhile edits the
          # same collected.json/handled.json, and a plain rebase then conflicts (19/10)
          git -C private-labels config user.name "NEO Common Mind"
          git -C private-labels config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            b=$(git -C private-labels rev-parse --abbrev-ref HEAD); git -C private-labels fetch --quiet origin "$b" && git -C private-labels reset --quiet --hard FETCH_HEAD
            python tools/common_deep.py collect private-labels "$W/drafts.json" "$minutes" "$REPLAY"
            python tools/common_experience.py sweep private-labels 48 || true
            git -C private-labels add common/drafts common/experience.jsonl 2>/dev/null || git -C private-labels add common/drafts
            git -C private-labels commit --quiet -m "common mind: drafts (private, CPU fallback)" || exit 0
            git -C private-labels push --quiet && exit 0
            sleep $((attempt*7))
          done
          exit 1
