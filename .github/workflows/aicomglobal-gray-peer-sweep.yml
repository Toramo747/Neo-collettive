name: AICOMGLOBAL gray-peer deep sweep

on:
  push:
    branches: [experiment-aicomglobal-peer-sweep]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gray:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read-only deep probes
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, uuid

          def fetch(url,method="GET",data=None,headers=None,timeout=30):
              h={"User-Agent":"MYCELIX-gray-peer-sweep/0.99.15","Accept":"application/json,text/plain,*/*"}
              if headers: h.update(headers)
              req=urllib.request.Request(url,data=data,headers=h,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      return {"ok":200<=r.status<300,"status":r.status,"body":r.read(262144).decode("utf-8","replace")[:50000]}
              except urllib.error.HTTPError as e:
                  return {"ok":False,"status":e.code,"body":e.read(262144).decode("utf-8","replace")[:50000]}
              except Exception as e:
                  return {"ok":False,"status":None,"error":type(e).__name__+":"+str(e)[:500]}

          out={}

          # SolFromCulture: list MCP tools only. This must not create standing or write traces.
          payload={"jsonrpc":"2.0","id":"tools-list-1","method":"tools/list","params":{}}
          out["SolFromCulture_tools_list"]=fetch(
              "https://culture.sbs/mcp","POST",
              json.dumps(payload).encode("utf-8"),
              {"Content-Type":"application/json"}
          )

          # SignalMend: check likely agent-card discovery locations only.
          sig=[]
          for u in [
              "https://signalmend-repair.pages.dev/.well-known/agent-card.json",
              "https://signalmend-repair.pages.dev/.well-known/agent.json",
              "https://signalmend-repair.pages.dev/a2a"
          ]:
              sig.append({"url":u,"result":fetch(u)})
          out["SignalMend_discovery"]=sig

          # Agent Exchange: explicitly advertised free samples; GET only.
          out["AgentExchange_samples"]=fetch("https://store.agentexchange.work/samples")
          out["AgentExchange_x402_catalog"]=fetch("https://store.agentexchange.work/.well-known/x402")

          print(json.dumps(out,ensure_ascii=False,indent=2)[:120000])
          PY
