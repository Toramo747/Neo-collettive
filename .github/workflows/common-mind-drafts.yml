name: Common Mind Drafts (Kaggle GPU, private, drafts only)
# Step 1 of autonomous dialogue: the 14B model drafts replies to messages for neo
# on Agent Commons. Drafts go to the private archive; Andrea approves them in bulk.
# This workflow never posts anything.
on:
  schedule:
    - cron: "41 */2 * * *"  # also collects a run left in the Kaggle GPU queue
  workflow_dispatch:
    inputs:
      replay:
        description: "re-draft the latest messages for evaluation (does not mark them handled)"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: kaggle-gpu
  cancel-in-progress: false
jobs:
  drafts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --quiet "kaggle>=1.8.0"
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.MODEL_LABEL_REPO }}
          token: ${{ secrets.MODEL_LABEL_REPO_TOKEN }}
          path: private-labels
      - name: Draft replies on Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          REPLAY: ${{ inputs.replay || '' }}
        run: |
          set +e -uo pipefail  # GitHub runs bash -e: a "nothing pending" exit code 3 must not fail the job
          K="$KAGGLE_USERNAME/neo-common-mind"
          kstatus() { kaggle kernels status "$K" 2>&1 | grep -oiE 'complete|error|cancel[a-z]*|queued|running' | head -1 | tr 'A-Z' 'a-z' || true; }
          collect_output() {
            rm -rf out; kaggle kernels output "$K" -p out >/dev/null 2>&1 || true
            [ -f out/drafts.json ] && python tools/common_deep.py collect private-labels out/drafts.json "$1" "$REPLAY"
          }
          # 1. A run left behind by the GPU queue: collect it, or wait for it (never push over it).
          prev=$(kstatus)
          echo "::notice title=Common mind::previous kernel status=${prev:-none}"
          case "$prev" in
            queued|running) echo "::notice title=Common mind::previous run still ${prev}; it will be collected next time"; exit 0 ;;
            complete) collect_output 0 ;;
          esac
          # 2. New run.
          minutes=0
          python tools/common_deep.py pending private-labels "$REPLAY"; rc=$?
          if [ "$rc" = "0" ] && python tools/mi_deep.py quota private-labels; then
            python tools/common_deep.py build private-labels kernel "$KAGGLE_USERNAME" "$REPLAY"; rc=$?
            if [ "$rc" = "0" ]; then
              start=$(date +%s)
              kaggle kernels push -p kernel >/dev/null 2>&1 || { echo "::error title=Common mind::push failed"; exit 1; }
              status=""
              for i in $(seq 1 60); do
                sleep 30
                status=$(kstatus)
                case "$status" in complete|error|cancel*) break ;; esac
              done
              minutes=$(( ($(date +%s) - start) / 60 ))
              echo "::notice title=Common mind::status=${status:-unknown} wall_minutes=$minutes"
              if [ "$status" = "complete" ]; then collect_output "$minutes"
              else echo "::warning title=Common mind::kernel ${status:-unknown} after ${minutes} min (GPU queue); output collected on the next run"; fi
            fi
          fi
          python - "$minutes" <<'PY2'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path("private-labels/market-intuition/deep_usage.json")
          u = json.loads(p.read_text()) if p.exists() else {}
          y, w, _ = datetime.now(timezone.utc).isocalendar(); k = f"{y}-W{w:02d}"
          u[k] = round(float(u.get(k, 0)) + float(sys.argv[1]), 1); p.write_text(json.dumps(u))
          PY2
          rm -rf out kernel
          git -C private-labels config user.name "NEO Common Mind"
          git -C private-labels config user.email "actions@users.noreply.github.com"
          python tools/common_experience.py sweep private-labels 48 || true
          python tools/common_experience.py stats private-labels || true
          python tools/common_autonomy.py status private-labels || true
          git -C private-labels add common/drafts common/experience.jsonl market-intuition/deep_usage.json 2>/dev/null || git -C private-labels add common/drafts market-intuition/deep_usage.json
          git -C private-labels commit --quiet -m "common mind: drafts (private)" || exit 0
          for attempt in 1 2 3 4; do
            git -C private-labels pull --quiet --rebase && git -C private-labels push --quiet && exit 0
            sleep $((attempt*5))
          done
          exit 1
