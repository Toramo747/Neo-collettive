name: MYCELIX Mind Distill (Kaggle GPU, private)
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "harvest | label | label-fetch | train | train-log | eval"
        required: true
        default: harvest
permissions:
  contents: read
concurrency:
  group: mycelix-mind-distill
  cancel-in-progress: false
jobs:
  distill:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --quiet "kaggle>=1.8.0"
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.MODEL_LABEL_REPO }}
          token: ${{ secrets.MODEL_LABEL_REPO_TOKEN }}
          path: private-labels
      # Texts, labels and kernels stay private; logs print counts only.
      - name: Run stage
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          STAGE: ${{ inputs.stage }}
        run: |
          set -uo pipefail
          K="$KAGGLE_USERNAME/neo-mind-distill-label"
          case "$STAGE" in
            harvest)
              python tools/mi_distill.py harvest private-labels || exit 1 ;;
            label)
              python tools/mi_deep.py quota private-labels || { echo "weekly GPU cap reached"; exit 0; }
              python tools/mi_distill.py label-build private-labels kernel "$KAGGLE_USERNAME" || exit 1
              start=$(date +%s)
              kaggle kernels push -p kernel >/dev/null 2>&1 || { echo "::error title=Distill::push failed"; exit 1; }
              status=""
              for i in $(seq 1 640); do
                sleep 30
                status=$(kaggle kernels status "$K" 2>&1 | grep -oiE 'complete|error|cancel[a-z]*' | head -1 || true)
                [ -n "$status" ] && break
                [ $(( ($(date +%s) - start) / 60 )) -ge 330 ] && break
              done
              minutes=$(( ($(date +%s) - start) / 60 ))
              echo "::notice title=Distill label::status=${status:-still_running} wall_minutes=$minutes"
              kaggle kernels output "$K" -p out >/dev/null 2>&1 || true
              [ -f out/labels.json ] && python tools/mi_distill.py label-collect private-labels out/labels.json
              python - "$minutes" <<'PY'
          import json, sys
          from pathlib import Path
          from datetime import datetime, timezone
          p = Path("private-labels/market-intuition/deep_usage.json")
          u = json.loads(p.read_text()) if p.exists() else {}
          y, w, _ = datetime.now(timezone.utc).isocalendar()
          k = f"{y}-W{w:02d}"
          u[k] = round(float(u.get(k, 0)) + float(sys.argv[1]), 1)
          p.write_text(json.dumps(u))
          PY
              ;;
            label-fetch)
              kaggle kernels output "$K" -p out >/dev/null 2>&1 || true
              [ -f out/labels.json ] && python tools/mi_distill.py label-collect private-labels out/labels.json ;;
            train)
              T="$KAGGLE_USERNAME/neo-mind-distill-train"
              python tools/mi_deep.py quota private-labels || { echo "weekly GPU cap reached"; exit 0; }
              python tools/mi_distill.py train-build private-labels kernel "$KAGGLE_USERNAME" || exit 1
              start=$(date +%s)
              kaggle kernels push -p kernel >/dev/null 2>&1 || { echo "::error title=Distill::push failed"; exit 1; }
              status=""
              for i in $(seq 1 640); do
                sleep 30
                status=$(kaggle kernels status "$T" 2>&1 | grep -oiE 'complete|error|cancel[a-z]*' | head -1 || true)
                [ -n "$status" ] && break
                [ $(( ($(date +%s) - start) / 60 )) -ge 330 ] && break
              done
              minutes=$(( ($(date +%s) - start) / 60 ))
              kaggle kernels output "$T" -p out --file-pattern 'train\.json' >/dev/null 2>&1 || kaggle kernels output "$T" -p out >/dev/null 2>&1 || true
              summary=$(python -c "import json;d=json.load(open('out/train.json'));print(d)" 2>/dev/null || echo none)
              echo "::notice title=Distill train::status=${status:-still_running} wall_minutes=$minutes summary=$summary"
              python - "$minutes" <<'PY'
          import json, sys
          from pathlib import Path
          from datetime import datetime, timezone
          p = Path("private-labels/market-intuition/deep_usage.json")
          u = json.loads(p.read_text()) if p.exists() else {}
          y, w, _ = datetime.now(timezone.utc).isocalendar()
          k = f"{y}-W{w:02d}"
          u[k] = round(float(u.get(k, 0)) + float(sys.argv[1]), 1)
          p.write_text(json.dumps(u))
          PY
              ;;
            train-log)
              T="$KAGGLE_USERNAME/neo-mind-distill-train"
              kaggle kernels output "$T" -p out >/dev/null 2>&1 || true
              ls -la out | head -20
              python - <<'PY'
          import glob, json, re
          for f in glob.glob("out/*.log"):
              raw = open(f).read()
              try:
                  lines = [x.get("data", "") for x in json.loads(raw)]
              except Exception:
                  lines = raw.splitlines()
              text = "".join(lines)
              tail = [l for l in text.splitlines() if l.strip()][-25:]
              for l in tail:
                  l = re.sub(r"https?://\S+", "<url>", l)[:300]
                  print("::warning title=train log::" + l)
          PY
              exit 0 ;;
            eval)
              T="$KAGGLE_USERNAME/neo-mind-distill-train"
              kaggle kernels output "$T" -p out >/dev/null 2>&1 || true
              gguf=$(find out -name '*.gguf' | grep -i 'q4_k_m' | head -1)
              [ -n "$gguf" ] || gguf=$(find out -name '*.gguf' | head -1)
              [ -n "$gguf" ] || { echo "::error title=Distill eval::no gguf in kernel output: $(find out -maxdepth 2 | head -15 | tr '\n' ' ')"; exit 1; }
              timeout 120 bash -c 'curl -fsSL https://ollama.com/install.sh | sh'
              nohup ollama serve >/tmp/ollama.log 2>&1 &
              for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
              ollama pull qwen2.5:3b-instruct-q4_K_M >/dev/null
              echo "::notice title=Distill eval gguf::$(basename "$gguf") $(du -h "$gguf" | cut -f1)"
              ollama show --modelfile qwen2.5:3b-instruct-q4_K_M | sed -E "s#^FROM .*#FROM $PWD/$gguf#" > Modelfile.student
              create=$(ollama create neo-mind-student -f Modelfile.student 2>&1 | tail -3 | tr '\n' ' ')
              echo "::notice title=Distill eval create::${create:0:300}"
              python tools/mi_distill_eval.py private-labels qwen2.5:3b-instruct-q4_K_M neo-mind-student 2> /tmp/eval.err
              rc=$?
              if [ $rc -ne 0 ]; then echo "::error title=Distill eval::$(tail -5 /tmp/eval.err | tr '\n' ' ' | cut -c1-500)"; exit 1; fi
              ;;
            *) echo "unknown stage"; exit 1 ;;
          esac
          rm -rf out kernel
          git -C private-labels config user.name "MYCELIX Mind Distill"
          git -C private-labels config user.email "actions@users.noreply.github.com"
          git -C private-labels add market-intuition
          git -C private-labels commit --quiet -m "mind distill: $STAGE" || exit 0
          for attempt in 1 2 3 4; do
            git -C private-labels pull --quiet --rebase && git -C private-labels push --quiet && exit 0
            sleep $((attempt*5))
          done
          exit 1
