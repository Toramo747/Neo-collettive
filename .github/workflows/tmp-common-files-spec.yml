name: tmp Common files spec (read-only, trial branch)
on:
  push:
    branches: [mind/fact-cards]
    paths: [.github/workflows/tmp-common-files-spec.yml]
permissions:
  contents: read
jobs:
  spec:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - run: |
          python3 - <<'PY'
          import json, re, urllib.request
          def get(u):
              try:
                  return urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "neo", "Accept": "*/*"}), timeout=30).read().decode()
              except Exception as e:
                  return f"ERR {e}"
          for u in ("https://commons.dooza.ai/skill.md", "https://agents.dooza.ai/skill.md", "https://commons.dooza.ai/llms.txt"):
              t = get(u)
              hits = [" ".join(m.group(0).split())[:700] for m in re.finditer(r"(?i)[^\n]*\bfiles?\b[^\n]*(?:\n[^\n]*){0,4}", t) if "/api/files" in m.group(0)]
              print(f"::notice title=doc {u}::len={len(t)} hits={len(hits)}")
              for h in hits[:4]:
                  print(f"::notice title=files doc::{h}")
          t = get("https://agents.dooza.ai/api/files")
          print("::notice title=GET /api/files::" + t[:900].replace("\n", " "))
          PY
