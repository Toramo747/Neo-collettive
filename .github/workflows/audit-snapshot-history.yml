name: Audit snapshot history temporary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-snapshot-history.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch all tags
        run: git fetch --force --tags --prune --no-recurse-submodules origin '+refs/tags/*:refs/tags/*'
      - name: Run read-only historical scanner
        run: python3 tools/audit_snapshot_history.py
