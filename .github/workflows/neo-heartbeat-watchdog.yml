name: MYCELIX Heartbeat Watchdog

on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/neo-heartbeat-watchdog.yml"

permissions:
  actions: write
  contents: read

jobs:
  ensure-heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check MYCELIX freshness
        env:
          STATUS_URL: https://neo-collettive.onrender.com/api/autopilot/status
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 2 --retry-delay 5 --max-time 45 "$STATUS_URL" > /tmp/status.json

          python - <<'PY'
          import json
          from datetime import datetime, timezone

          d=json.load(open("/tmp/status.json",encoding="utf-8"))
          ap=d.get("autopilot") or {}
          last=ap.get("last_finished_utc")
          stale=True
          age_minutes=None

          if last:
              try:
                  dt=datetime.fromisoformat(str(last).replace("Z","+00:00"))
                  age_minutes=(datetime.now(timezone.utc)-dt.astimezone(timezone.utc)).total_seconds()/60
                  stale=age_minutes>20
              except Exception:
                  stale=True

          with open("/tmp/stale","w",encoding="utf-8") as f:
              f.write("1" if stale else "0")

          print({
              "neo_version": d.get("neo_version"),
              "last_finished_utc": last,
              "age_minutes": None if age_minutes is None else round(age_minutes,1),
              "running": ap.get("running"),
              "last_error": ap.get("last_error"),
              "stale": stale,
          })
          PY

      - name: Dispatch primary heartbeat if stale
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$(cat /tmp/stale)" != "1" ]; then
            echo "Primary heartbeat is fresh; no dispatch needed."
            exit 0
          fi

          curl --fail --show-error --silent             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/actions/workflows/neo-heartbeat.yml/dispatches"             -d '{"ref":"main"}'

          echo "Primary MYCELIX heartbeat dispatched because runtime was stale."
