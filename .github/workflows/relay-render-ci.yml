name: Relay Render adapter CI
on:
  push:
    branches: ["feat/relay-isolated-pilot"]
  pull_request:
    paths:
      - "relay_*.py"
      - "test_relay_*.py"
      - "Dockerfile.relay-render"
      - "requirements-relay-render.txt"
      - "render-relay.yaml"
      - ".github/workflows/relay-render-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: relay-render-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert existing production configuration unchanged
        env:
          PILOT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          protected=(cloud_mcp.py discovery_v3.py state_recovery.py inbound_interview.py intent_discovery.py seti_radar.py agent_chat.py agent_demand.py runtime_boundary.py runtime_profile.json neo_policy.json neo_latest_result.json neo_cycle_floor.json requirements.txt Dockerfile render.yaml .github/workflows/mycelix-heartbeat-v2.yml .github/workflows/mycelix-heartbeat-v3.yml .github/workflows/mycelix-heartbeat-watchdog-v2.yml .github/workflows/neo-render-deploy.yml)
          # Compare our branch, not main's later runtime snapshots, with its original baseline.
          git diff --exit-code --name-only 1752e1cf7d0c8050d29aa035b117a5984d799ccf "$PILOT_HEAD" -- "${protected[@]}"
          # On PRs also prove the synthetic merge preserves the exact current base files.
          if [ -n "$PR_BASE" ]; then
            git diff --exit-code --name-only "$PR_BASE" HEAD -- "${protected[@]}"
          fi
      - name: Install standalone dependencies and validation tooling
        run: python -m pip install -r requirements-relay-render.txt PyYAML jsonschema
      - name: Compile and run Render isolation and storage tests
        run: |
          python -m py_compile relay_render.py relay_render_backup.py relay_render_smoke.py
          python -m unittest -v test_relay_render
      - name: Validate optional Blueprint against Render schema
        run: |
          curl --fail --silent --show-error --max-time 30 https://render.com/schema/render.yaml.json -o /tmp/render-schema.json
          python - <<'PY'
          import json, yaml, jsonschema
          with open('render-relay.yaml') as fh:
              blueprint=yaml.safe_load(fh)
          with open('/tmp/render-schema.json') as fh:
              jsonschema.validate(blueprint,json.load(fh))
          service=blueprint['services'][0]
          assert len(blueprint['services']) == 1
          assert service['name'] == 'mycelix-relay-pilot'
          assert service['autoDeployTrigger'] == 'off'
          assert service['disk']['mountPath'] == '/var/data'
          assert service['numInstances'] == 1
          assert service['dockerfilePath'] == './Dockerfile.relay-render'
          env={x['key']: x for x in service['envVars']}
          assert env['MYCELIX_RELAY_ENABLED']['value'] == '0'
          assert env['MYCELIX_RELAY_STORAGE_CONFIRMED']['value'] == '0'
          print('Standalone Blueprint valid; activation remains off.')
          PY
      - name: Build standalone image without the NEO core
        run: |
          docker build -f Dockerfile.relay-render -t mycelix-relay-render-ci .
          docker run --rm --network none --entrypoint python mycelix-relay-render-ci -c "import importlib.util; assert importlib.util.find_spec('cloud_mcp') is None; from relay_render import RenderRelay; assert not RenderRelay().enabled"
      - name: Verify real volume persistence across container replacement
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, secrets
          os.umask(0o077)
          with open('/tmp/mycelix-relay-ci.env','w') as fh:
              fh.write('MYCELIX_RELAY_ENABLED=1\nMYCELIX_RELAY_STORAGE_CONFIRMED=1\nMYCELIX_RELAY_INVITE='+secrets.token_urlsafe(32)+'\n')
          PY
          docker volume create mycelix-relay-ci >/dev/null
          start_relay() {
            docker run -d --name mycelix-relay-ci --read-only --tmpfs /tmp \
              --security-opt=no-new-privileges --cap-drop ALL \
              --env-file /tmp/mycelix-relay-ci.env \
              -v mycelix-relay-ci:/var/data -p 127.0.0.1:19100:10000 \
              mycelix-relay-render-ci >/dev/null
          }
          start_relay
          python relay_render_smoke.py before
          docker stop -t 30 mycelix-relay-ci >/dev/null
          docker rm mycelix-relay-ci >/dev/null
          start_relay
          python relay_render_smoke.py after
      - name: Remove only CI test resources
        if: always()
        run: |
          docker rm -f mycelix-relay-ci 2>/dev/null || true
          docker volume rm mycelix-relay-ci 2>/dev/null || true
          rm -f /tmp/mycelix-relay-ci.env /tmp/mycelix-relay-smoke-client.json
