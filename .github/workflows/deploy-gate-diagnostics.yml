name: Deploy gate diagnostics (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - env:
          NEO_ADMIN_TOKEN: ${{ secrets.NEO_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          # Prints only numeric/boolean aggregates the deploy gates check (no text, no ids).
          import json, os, sys, urllib.request
          sys.path.insert(0, "scripts"); sys.path.insert(0, ".")
          import verify_ingestion_deploy as v
          O = "https://neo-collettive.onrender.com"
          def get(path, auth=False):
              h = {"X-MYCELIX-Self-Traffic": "github-actions-deploy"}
              if auth: h["Authorization"] = "Bearer " + os.environ["NEO_ADMIN_TOKEN"]
              with urllib.request.urlopen(urllib.request.Request(O + path, headers=h), timeout=30) as r:
                  return json.load(r)
          cp = get("/api/checkpoint-status")
          print("::notice title=checkpoint::" + json.dumps({k: cp.get(k) for k in ("ok", "stored_bytes", "limit_bytes", "cycles_completed", "commercial_evidence_items", "last_checkpoint_utc")}))
          st = get("/api/autopilot/status", auth=True)
          lc = (st.get("autopilot") or {}).get("last_checkpoint") or {}
          reason = str(lc.get("reason") or "")
          comp = lc.get("compaction") or {}
          print("::notice title=last checkpoint::" + json.dumps({"ok": lc.get("ok"), "status": lc.get("status"),
                "reason_type": reason.split(":", 1)[0], "reason_has_size_word": any(w in reason.lower() for w in ("byte", "size", "limit", "large", "exceed")),
                "raw_bytes": lc.get("raw_bytes"), "stored_bytes": lc.get("stored_bytes"),
                "compaction_numbers": {k: v2 for k, v2 in comp.items() if isinstance(v2, (int, float, bool))}}))
          ap = st.get("autopilot") or {}
          def brief(o, depth=0):
              if isinstance(o, dict):
                  return {k: brief(x, depth + 1) for k, x in list(o.items())[:12]} if depth < 2 else f"dict[{len(o)}]"
              if isinstance(o, list):
                  return f"list[{len(o)}]"
              if isinstance(o, str):
                  return o[:40] if any(w in o for w in ("20", "ok", "error", "skip")) else f"str[{len(o)}]"
              return o
          keys = {k: brief(x) for k, x in ap.items() if any(w in k.lower() for w in ("a2a", "agent", "common", "collab", "dialog"))}
          print("::notice title=a2a state::" + json.dumps(keys, default=str)[:3500])
          lr = ap.get("latest_result") or {}
          lk = {k: brief(x) for k, x in lr.items() if any(w in k.lower() for w in ("a2a", "agent", "collab", "research"))}
          print("::notice title=latest result a2a::" + json.dumps(lk, default=str)[:3500])
          s = v.project(st)
          if s is None:
              print("::notice title=ingestion sample::none (running or no latest_result)")
          else:
              d = s["ingestion_drought"]
              out = {"cycle": s["cycle"], "evidence_out": s["evidence_out"], "stored_bytes": s["stored_bytes"],
                     "drought_rows": len(d.get("rows") or []), "measurement_reliable": d.get("measurement_reliable"),
                     "unjoined_total": d.get("unjoined_total")}
              try:
                  v.accept(s); out["accept"] = "ok"
              except Exception as e:
                  out["accept"] = str(e)
              print("::notice title=ingestion sample::" + json.dumps(out))
          h = get("/health")
          print("::notice title=health::" + json.dumps({"neo_version": h.get("neo_version") or h.get("version"), "commit": str(h.get("commit") or "")[:7]}))
          PY
      - name: A2A registry position of Common (read-only)
        run: |
          python - <<'PY'
          import json, urllib.request
          def get(q):
              with urllib.request.urlopen(urllib.request.Request("https://a2aregistry.org/api/agents?" + q, headers={"Accept": "application/json", "User-Agent": "NEO-diag/1"}), timeout=30) as r:
                  d = json.load(r)
              return d.get("agents") or d.get("items") or d.get("data") or (d if isinstance(d, list) else [])
          for q in ("limit=12&task_verified=true", "limit=100&task_verified=true", "limit=100&search=common"):
              rows = get(q)
              pos = [i for i, a in enumerate(rows) if "common" in str(a.get("name", "")).lower() or "dooza" in json.dumps(a).lower()]
              info = {}
              if pos:
                  a = rows[pos[0]]
                  info = {k: a.get(k) for k in ("name", "task_verified", "conformance", "updated_at", "created_at", "last_verified_at", "verified_at") if k in a}
              print("::notice title=registry " + q + "::" + json.dumps({"rows": len(rows), "common_positions": pos, "common": info}))
          PY

