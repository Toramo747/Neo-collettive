name: MYCELIX Peer 0.94 Isolated Check
on:
  workflow_dispatch:
  push:
    branches: [fix/peer-a2a-094-20260924]
    paths:
      - .github/workflows/peer-a2a-094-check.yml
permissions:
  contents: write
concurrency:
  group: mycelix-peer-094-isolated
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/fix/peer-a2a-094-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/peer-a2a-094-20260924
          fetch-depth: 1
      - name: Apply final isolated refusal regression
        run: python tools/finalize_peer_patch.py
      - name: Compile application and adapter
        run: python -m py_compile cloud_mcp.py a2a_peer.py tools/peer_live_probe.py
      - name: Run all offline regression tests
        run: |
          set -euo pipefail
          python -m unittest discover -v -p 'test_*.py' 2>&1 | tee peer_regression.log
      - name: Build unchanged production Docker recipe
        run: docker build -t mycelix-peer-094-check .
      - name: Commit tested adapter only to isolated branch
        run: |
          set -euo pipefail
          git config user.name 'MYCELIX Peer Validation'
          git config user.email 'actions@users.noreply.github.com'
          git add a2a_peer.py
          git commit -m 'Stop on explicit textual peer payment refusal [skip ci]'
          git push origin HEAD:refs/heads/fix/peer-a2a-094-20260924
          git rev-parse HEAD
      - name: No additional external peer request
        run: echo 'The live probe stopped on PAYMENT_REQUIRED. It is not repeated or bypassed.'
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mycelix-peer-094-final-offline-evidence
          retention-days: 7
          path: |
            peer_regression.log
            cloud_mcp.py
            a2a_peer.py
