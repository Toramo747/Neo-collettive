name: Self Traffic HMAC Tests

on:
  push:
    branches: [mycelix-self-traffic-hardening-20260928]
    paths:
      - "self_traffic_auth.py"
      - "cloud_mcp.py"
      - "inbound_traffic.py"
      - "test_inbound_traffic.py"
      - "test_inbound_e2e.py"
      - "test_heartbeat_workflow.py"
      - "test_self_traffic_auth.py"
      - ".github/workflows/mycelix-heartbeat-v3.yml"
      - ".github/workflows/neo-render-deploy.yml"
      - ".github/workflows/self-traffic-auth-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install locked test dependencies
        run: python -m pip install -r requirements.lock
      - name: Run self-traffic hardening tests
        run: python -m unittest -v test_self_traffic_auth.py test_inbound_traffic.py test_inbound_e2e.py test_heartbeat_workflow.py
