name: MYCELIX v0.99.17 activation validation

on:
  push:
    branches: [mycelix-aicomglobal-activate-v09917]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: python -m pip install -q -r requirements.txt pytest
      - name: Compile
        run: python -m py_compile cloud_mcp.py seti_radar.py aicomglobal_adapter.py
      - name: Relevant tests
        run: python -m unittest -v test_seti_radar.py test_aicomglobal_adapter.py test_a2a_peer.py
      - name: Activation invariant
        run: |
          python - <<'PY'
          import cloud_mcp, seti_radar
          assert cloud_mcp.VERSION=="0.99.17"
          assert seti_radar.SETI_ENGINE_VERSION==15
          assert cloud_mcp.AICOMGLOBAL_READONLY_ENABLED is True
          print("version=0.99.17")
          print("seti_engine_version=15")
          print("aicomglobal_readonly_enabled=true")
          PY
