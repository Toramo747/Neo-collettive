name: MCP Registry Manifest Validate

on:
  push:
    branches: [main]
    paths:
      - "server.json"
      - ".github/workflows/publish-mcp-registry.yml"
      - ".github/workflows/mcp-registry-manifest-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install official MCP publisher
        run: |
          set -euo pipefail
          curl -L --fail --show-error --silent             "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz"             | tar xz mcp-publisher
      - name: Validate server.json against official Registry
        run: ./mcp-publisher validate server.json
