name: Inbound Audience (read-only, aggregate)
on:
  push:
    branches: [ops/inbound-audience]
    paths: [.github/inbound-audience-trigger.txt]
permissions:
  contents: read
jobs:
  audience:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Fetch live status (self-traffic marked) and print aggregates only
        env:
          ADMIN_TOKEN: ${{ secrets.NEO_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 60 -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H "X-MYCELIX-Self-Traffic: github-actions-heartbeat" \
            "https://neo-collettive.onrender.com/api/autopilot/status" > /tmp/status.json
          python tools/inbound_audience.py /tmp/status.json
          rm -f /tmp/status.json
