name: Inbound Audience (read-only, aggregate)
on:
  push:
    branches: [ops/inbound-audience]
    paths: [.github/inbound-audience-trigger.txt]
permissions:
  contents: read
jobs:
  audience:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Fetch live status (self-traffic marked) and print aggregates only
        env:
          HEARTBEAT_TOKEN: ${{ secrets.NEO_HEARTBEAT_TOKEN }}
        run: |
          set -euo pipefail
          URL='https://neo-collettive.onrender.com/api/autonomy/status'
          curl --fail --silent --show-error --max-time 60 \
            -H "X-MYCELIX-Self-Traffic: github-actions-heartbeat" \
            -H "X-MYCELIX-Self-Traffic-Proof: $(NEO_HEARTBEAT_TOKEN="${HEARTBEAT_TOKEN}" python self_traffic_auth.py sign-url "$URL" --marker github-actions-heartbeat)" \
            "$URL" > /tmp/status.json
          python tools/inbound_audience.py /tmp/status.json
          rm -f /tmp/status.json
