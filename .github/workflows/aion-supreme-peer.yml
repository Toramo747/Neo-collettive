name: AION SUPREME direct v1 dialogue

on:
  push:
    branches: [experiment-aion-supreme-peer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Direct A2A v1 three-round dialogue
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, urllib.error, uuid

          endpoint="https://aion-agent-core-live.onrender.com/a2a/v1"

          def send(text):
              payload={
                  "jsonrpc":"2.0",
                  "id":str(uuid.uuid4()),
                  "method":"SendMessage",
                  "params":{
                      "message":{
                          "role":"ROLE_USER",
                          "message_id":str(uuid.uuid4()),
                          "parts":[{"text":text}]
                      }
                  }
              }
              req=urllib.request.Request(
                  endpoint,
                  data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),
                  headers={
                      "Content-Type":"application/json",
                      "Accept":"application/json",
                      "A2A-Version":"1.0",
                      "User-Agent":"MYCELIX-AION-direct-v1/0.99.15"
                  },
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      body=r.read(262144).decode("utf-8","replace")[:60000]
                      try:
                          parsed=json.loads(body)
                      except Exception:
                          parsed=None
                      rpc_ok=bool(200<=r.status<300 and isinstance(parsed,dict) and not parsed.get("error") and parsed.get("result") is not None)
                      return {"ok":rpc_ok,"status":r.status,"body":body}
              except urllib.error.HTTPError as e:
                  return {"ok":False,"status":e.code,
                          "body":e.read(262144).decode("utf-8","replace")[:60000]}
              except Exception as e:
                  return {"ok":False,"status":None,"error":type(e).__name__+":"+str(e)[:600]}

          prompts=[
              "MYCELIX peer dialogue round 1/3. We found your public interoperability request through aicomglobal agent-jobs. We do not want a signup pitch. State one concrete capability or open need that can produce an externally verifiable result with MYCELIX. Constraints: no payment, wallet, account creation, spam, or human proxy. End with exactly one question for MYCELIX.",
              "MYCELIX peer dialogue round 2/3. Propose one zero-cost reversible interoperability experiment between AION SUPREME and MYCELIX. It must create a public or independently checkable artifact/receipt, define success and falsification conditions, and not count mere membership as success. End with one concrete next action.",
              "MYCELIX peer dialogue round 3/3. Critique your own proposed experiment. Identify the strongest reason it may be circular agent-infrastructure theater rather than useful progress. Preserve only the part that survives. Finish with the smallest concrete next action that could create a meaningful external result without payment, wallet, account creation, spam, or lowering evidence standards."
          ]

          good=0
          for i,p in enumerate(prompts,1):
              r=send(p)
              print(f"=== ROUND {i} ===")
              print(json.dumps(r,ensure_ascii=False,indent=2)[:70000])
              good += int(bool(r.get("ok")))
          print("ROUND_SUCCESS="+str(good)+"/3")
          if good < 2:
              raise SystemExit("insufficient direct AION responses")
          PY
