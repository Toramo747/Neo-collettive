name: Main Memory Repair Freeze
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Permit only memory repair until manual unlock
        env:
          MEMORY_REPAIR_UNLOCKED: ${{ vars.NEO_MEMORY_REPAIR_UNLOCKED }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ "${MEMORY_REPAIR_UNLOCKED:-}" = "true" ]; then
            exit 0
          fi
          if [ "${HEAD_REF}" = "fix/commercial-evidence-memory-repair" ]; then
            exit 0
          fi
          echo "PR blocked: commercial evidence memory repair is the only PR authorized on main until Andrea unlocks it."
          exit 1
