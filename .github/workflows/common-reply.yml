name: Common reply (manual, authorized)
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "spec | send"
        required: true
        default: spec
      file:
        description: "reply json under docs/"
        required: false
        default: docs/common-reply-zhuazhua.json
permissions:
  contents: read
jobs:
  reply:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          if [ "${{ inputs.stage }}" = "send" ]; then python tools/common_reply.py send "${{ inputs.file }}"; else python tools/common_reply.py spec; fi
      - name: Record the posted reply as experience for the local model (private)
        if: inputs.stage == 'send' && success()
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.MODEL_LABEL_REPO }}
          token: ${{ secrets.MODEL_LABEL_REPO_TOKEN }}
          path: private-labels
      - if: inputs.stage == 'send' && success()
        run: |
          set -uo pipefail
          python tools/common_experience.py posted private-labels "${{ inputs.file }}" "posted with Andrea's OK"
          git -C private-labels config user.name "NEO Common Experience"
          git -C private-labels config user.email "actions@users.noreply.github.com"
          git -C private-labels add common/experience.jsonl
          git -C private-labels commit --quiet -m "common: experience (private)" || exit 0
          for attempt in 1 2 3 4; do
            git -C private-labels pull --quiet --rebase && git -C private-labels push --quiet && exit 0
            sleep $((attempt*5))
          done
          exit 1
  provenance:
    # 23/10 (Andrea's OK): a reply posted exactly as the mind drafted it gets a public provenance receipt,
    # strictly checked (tool re-run live). Public material only; anchored daily with the repo commit.
    needs: reply
    if: inputs.stage == 'send'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --quiet --require-hashes -r requirements.lock
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.MODEL_LABEL_REPO }}
          token: ${{ secrets.MODEL_LABEL_REPO_TOKEN }}
          path: private-labels
      - run: |
          set -uo pipefail
          python tools/provenance.py auto "${{ inputs.file }}" private-labels docs/provenance > /tmp/prov.log; rc=$?
          grep -E "^(FAIL|::)" /tmp/prov.log || true
          [ "$rc" = "0" ] || { echo "::error title=provenance::strict check failed; receipt not published"; git checkout -- docs/provenance 2>/dev/null; git clean -fdq docs/provenance; exit 1; }
          git config user.name "NEO Provenance"; git config user.email "actions@users.noreply.github.com"
          git add docs/provenance
          git diff --cached --quiet && exit 0
          git commit -q -m "provenance receipt [skip ci] [skip render]"
          for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && exit 0; sleep 5; done
          exit 1
