name: Registry Health Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "registry_health.py"
      - "registry_health_scan.py"
      - "test_registry_health.py"
      - "mcp_endpoint_verifier.py"
      - "test_mcp_endpoint_verifier.py"
      - ".github/workflows/registry-health-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
      - name: Compile registry health code
        run: python -m py_compile registry_health.py registry_health_scan.py mcp_endpoint_verifier.py
      - name: Run registry health and verifier tests
        run: python -m unittest -v test_registry_health.py test_mcp_endpoint_verifier.py
