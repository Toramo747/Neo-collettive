name: Maestro v2 Embeddings (private, preregistered)
on:
  push:
    branches: [arena/maestro-v2]
    paths: [tools/maestro_v2_embeddings.py, .github/workflows/maestro-v2.yml]
permissions:
  contents: read
concurrency:
  group: maestro-v2
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet sentence-transformers scikit-learn==1.5.2 scipy joblib
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.MODEL_LABEL_REPO }}
          token: ${{ secrets.MODEL_LABEL_REPO_TOKEN }}
          path: private-labels
      # Data, metrics and any model stay in the private archive; logs are aggregate only.
      - run: python tools/maestro_v2_embeddings.py private-labels | grep '^::'
      - name: Persist in private archive
        run: |
          git -C private-labels config user.name "NEO Maestro Bot"
          git -C private-labels config user.email "actions@users.noreply.github.com"
          git -C private-labels add maestro
          git -C private-labels commit --quiet -m "maestro v2: preregistered embedding evaluation"
          git -C private-labels push --quiet
