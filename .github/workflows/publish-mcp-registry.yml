name: Publish MCP Registry

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish if this exact version is not already public"
        required: false
        default: false
        type: boolean
  release:
    types: [published]
  workflow_run:
    workflows: ["NEO Render Deploy"]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,os
          source=open("cloud_mcp.py",encoding="utf-8").read()
          m=re.search(r'^VERSION = "([^"]+)"',source,re.M)
          if not m:
              raise SystemExit("VERSION not found")
          version=m.group(1)
          with open("server.json",encoding="utf-8") as fh:
              data=json.load(fh)
          data["version"]=version
          with open("server.json","w",encoding="utf-8") as fh:
              json.dump(data,fh,ensure_ascii=False,indent=2)
              fh.write("\n")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as fh:
              fh.write("REGISTRY_VERSION="+version+"\n")
          print("registry_version="+version)
          PY

      - name: Validate server manifest shape
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          d=json.load(open("server.json",encoding="utf-8"))
          assert d["$schema"]=="https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json"
          assert d["name"]=="io.github.Toramo747/mycelix"
          assert re.fullmatch(r"\d+\.\d+\.\d+",d["version"])
          assert d["repository"]["url"]=="https://github.com/Toramo747/Neo-collettive"
          assert d["repository"]["source"]=="github"
          assert d["repository"]["id"]=="1376364556"
          assert d["remotes"]==[{"type":"streamable-http","url":"https://neo-collettive.onrender.com/mcp"}]
          print("server.json structural checks passed")
          PY

      - name: Check whether this exact version is already public
        id: existing
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,time,urllib.parse,urllib.request,urllib.error
          name="io.github.Toramo747/mycelix"
          version=os.environ["REGISTRY_VERSION"]
          expected_remote="https://neo-collettive.onrender.com/mcp"
          url=(
              "https://registry.modelcontextprotocol.io/v0.1/servers/"
              +urllib.parse.quote(name,safe="")
              +"/versions/"
              +urllib.parse.quote(version,safe="")
          )
          delays=[0,2,4,8,16]
          last=None
          exact=False
          for delay in delays:
              if delay:
                  time.sleep(delay)
              try:
                  with urllib.request.urlopen(url,timeout=15) as r:
                      last=json.load(r)
                  server=last.get("server") if isinstance(last,dict) else None
                  meta=last.get("_meta",{}) if isinstance(last,dict) else {}
                  official=meta.get("io.modelcontextprotocol.registry/official",{}) if isinstance(meta,dict) else {}
                  remotes=server.get("remotes") or [] if isinstance(server,dict) else []
                  exact=(
                      isinstance(server,dict)
                      and server.get("name")==name
                      and str(server.get("version") or "")==version
                      and any(isinstance(x,dict) and x.get("type")=="streamable-http" and x.get("url")==expected_remote for x in remotes)
                      and official.get("status")=="active"
                  )
                  if exact:
                      print(json.dumps(last,ensure_ascii=False,indent=2))
                      break
              except urllib.error.HTTPError as exc:
                  last={"http_status":exc.code,"reason":str(exc)}
              except Exception as exc:
                  last={"error":type(exc).__name__+":"+str(exc)}
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as fh:
              fh.write("exact_match="+("true" if exact else "false")+"\n")
          print("registry_exact_match="+str(exact).lower())
          if not exact:
              print(json.dumps(last,ensure_ascii=False,indent=2))
          PY

      - name: Install official MCP publisher
        if: steps.existing.outputs.exact_match != 'true' && github.event_name == 'workflow_dispatch' && inputs.publish == true
        run: |
          set -euo pipefail
          curl -L --fail --show-error --silent \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: Validate with official publisher
        if: steps.existing.outputs.exact_match != 'true' && github.event_name == 'workflow_dispatch' && inputs.publish == true
        run: ./mcp-publisher validate server.json

      - name: Authenticate with GitHub OIDC
        if: steps.existing.outputs.exact_match != 'true' && github.event_name == 'workflow_dispatch' && inputs.publish == true
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        if: steps.existing.outputs.exact_match != 'true' && github.event_name == 'workflow_dispatch' && inputs.publish == true
        run: ./mcp-publisher publish server.json

      - name: Refuse implicit re-publish
        if: steps.existing.outputs.exact_match != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.publish == true)
        run: |
          echo "Exact registry version is not public. Automatic re-publish is disabled."
          echo "A new or intentionally unpublished version must be published explicitly with workflow_dispatch publish=true."

      - name: Verify public registry entry
        if: steps.existing.outputs.exact_match == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,time,urllib.parse,urllib.request,urllib.error
          name="io.github.Toramo747/mycelix"
          version=os.environ["REGISTRY_VERSION"]
          expected_remote="https://neo-collettive.onrender.com/mcp"
          url=(
              "https://registry.modelcontextprotocol.io/v0.1/servers/"
              +urllib.parse.quote(name,safe="")
              +"/versions/"
              +urllib.parse.quote(version,safe="")
          )
          delays=[0,2,4,8,16,30]
          last=None
          for delay in delays:
              if delay:
                  time.sleep(delay)
              try:
                  with urllib.request.urlopen(url,timeout=15) as r:
                      last=json.load(r)
                  server=last.get("server") if isinstance(last,dict) else None
                  meta=last.get("_meta",{}) if isinstance(last,dict) else {}
                  official=meta.get("io.modelcontextprotocol.registry/official",{}) if isinstance(meta,dict) else {}
                  remotes=server.get("remotes") or [] if isinstance(server,dict) else []
                  ok=(
                      isinstance(server,dict)
                      and server.get("name")==name
                      and str(server.get("version") or "")==version
                      and any(isinstance(x,dict) and x.get("type")=="streamable-http" and x.get("url")==expected_remote for x in remotes)
                      and official.get("status")=="active"
                  )
                  if ok:
                      print("registry_name="+server["name"])
                      print("registry_version="+str(server["version"]))
                      print("registry_remote="+expected_remote)
                      print("registry_status="+str(official.get("status")))
                      print(json.dumps(last,ensure_ascii=False,indent=2))
                      raise SystemExit(0)
              except urllib.error.HTTPError as exc:
                  last={"http_status":exc.code,"reason":str(exc)}
              except Exception as exc:
                  last={"error":type(exc).__name__+":"+str(exc)}
          print(json.dumps(last,ensure_ascii=False,indent=2))
          raise SystemExit("registry exact version not visible/active after verification retries")
          PY
