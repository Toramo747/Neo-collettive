name: Verify v0.99.19 runtime pinpoint
on:
  push:
    branches: [verify-v09919-runtime]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot runtime
        run: |
          for i in $(seq 1 30); do
            curl -fsS --max-time 30 'https://neo-collettive.onrender.com/api/autopilot/status' > /tmp/status.json
            python - <<'PY'
import json
d=json.load(open("/tmp/status.json"))
ap=d.get("autopilot") or {}
print(json.dumps({
  "neo_version":d.get("neo_version"),
  "running":ap.get("running"),
  "cycles_completed":ap.get("cycles_completed"),
  "last_started_utc":ap.get("last_started_utc"),
  "last_finished_utc":ap.get("last_finished_utc"),
  "last_error":ap.get("last_error"),
  "last_status":ap.get("last_status"),
  "latest_result_present":bool(ap.get("latest_result")),
},sort_keys=True))
PY
            if python - <<'PY'
import json,sys
d=json.load(open("/tmp/status.json")); ap=d.get("autopilot") or {}
err=str(ap.get("last_error") or "")
done=(str(d.get("neo_version") or "")=="0.99.19" and not ap.get("running") and (bool(err) or int(ap.get("cycles_completed") or 0)>=367))
sys.exit(0 if done else 1)
PY
            then exit 0; fi
            sleep 10
          done
          exit 1
