name: Temporary director valid shadow test
on:
  push:
    branches:
      - fix-director-valid-shadow-20260929
    paths:
      - ".github/workflows/temporary-director-valid-shadow.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regression
        run: python -m unittest -v test_director_valid_shadow.py
