name: MYCELIX Warp Propulsion Research Arena

on:
  push:
    paths:
      - ".github/workflows/mycelix-warp-propulsion-arena.yml"
      - "arena_warp_propulsion.py"
      - "test_arena_warp_propulsion.py"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mycelix-warp-propulsion-arena
  cancel-in-progress: false

jobs:
  theoretical-evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate arena
        run: |
          set -euo pipefail
          python -m py_compile arena_warp_propulsion.py
          python -m unittest -v test_arena_warp_propulsion.py

      - name: Run bounded theoretical generation
        run: |
          set -euo pipefail
          python arena_warp_propulsion.py --data-dir data/arena/warp-propulsion --population 48 --seed ${{ github.run_number }} | tee /tmp/warp-arena.json

      - name: Assert isolation and scientific boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open("data/arena/warp-propulsion/latest.json",encoding="utf-8"))
          b=r.get("boundary") or {}
          expected={
              "production_state_write":False,
              "production_runtime_influence":"NONE",
              "automatic_physical_claims":False,
              "automatic_engineering_promotion":False,
              "promotion":"HUMAN_SCIENTIFIC_REVIEW_ONLY",
          }
          for k,v in expected.items():
              if b.get(k)!=v:
                  raise SystemExit(f"boundary failure: {k}={b.get(k)!r}")
          if r.get("mode")!="THEORETICAL_SHADOW":
              raise SystemExit("wrong arena mode")
          print(json.dumps({
              "generation":r.get("generation"),
              "population":r.get("population"),
              "best":r.get("best"),
              "hard_flagged":r.get("hard_flagged"),
          },indent=2))
          PY

      - name: Publish arena state
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "MYCELIX Warp Research Arena"
          git config user.email "actions@users.noreply.github.com"
          git add data/arena/warp-propulsion
          if git diff --cached --quiet; then
            echo "No warp arena changes"
            exit 0
          fi
          git commit -m "warp propulsion arena generation [skip render]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*3))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mycelix-warp-propulsion-${{ github.run_id }}
          path: data/arena/warp-propulsion/
          if-no-files-found: warn
          retention-days: 30
