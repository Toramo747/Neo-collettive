name: MYCELIX Warp Propulsion Research Arena

on:
  push:
    paths:
      - ".github/workflows/mycelix-warp-propulsion-arena.yml"
      - "arena_warp_propulsion.py"
      - "test_arena_warp_propulsion.py"
      - "warp_physics.py"
      - "test_warp_physics.py"
      - "warp_tensor.py"
      - "warp_reference_search.py"
      - "test_warp_tensor.py"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mycelix-warp-propulsion-arena
  cancel-in-progress: false

jobs:
  theoretical-evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock

      - name: Validate arena
        run: |
          set -euo pipefail
          python -m py_compile arena_warp_propulsion.py warp_physics.py warp_tensor.py warp_reference_search.py arena_collective_mind.py
          python -m unittest -v test_arena_warp_propulsion.py test_warp_physics.py test_warp_tensor.py test_arena_collective_mind.py

      - name: Run bounded theoretical generation
        run: |
          set -euo pipefail
          python arena_warp_propulsion.py --data-dir data/arena/warp-propulsion --population 48 --seed ${{ github.run_number }} | tee /tmp/warp-arena.json

      - name: Ask bounded external scientific critics
        run: |
          set -euo pipefail
          python arena_collective_mind.py             --mission "Act only as a scientific critic of the MYCELIX theoretical warp-propulsion research arena. Identify falsifiable mathematical or numerical checks, missing literature comparisons, tensor/energy-condition validation ideas, or reasons to reject a candidate. Do not claim physical feasibility, do not propose construction or experiments involving hazardous energy or materials, do not execute tools or external actions, and do not change the arena fitness. Return bounded analytical proposals with public HTTPS evidence where available."             --max-agents 2             --data-dir data/arena/warp-propulsion/external             | tee /tmp/warp-external-advisory.json
          python - <<'PY'
          import json
          from pathlib import Path
          warp=Path("data/arena/warp-propulsion/latest.json")
          advisory=Path("data/arena/warp-propulsion/external/collective-mind/latest.json")
          r=json.loads(warp.read_text(encoding="utf-8"))
          a=json.loads(advisory.read_text(encoding="utf-8")) if advisory.is_file() else {}
          r["external_advisory"]={
              "status":a.get("status","NO_REPORT"),
              "agents_discovered":int(a.get("agents_discovered") or 0),
              "agents_contacted":int(a.get("agents_contacted") or 0),
              "valid_proposals":int(a.get("round1_valid_proposals") or 0),
              "valid_critiques":int(a.get("round2_valid_critiques") or 0),
              "top_proposals":(a.get("ranked_proposals") or [])[:3],
              "trust":"UNTRUSTED_STRUCTURED_PROPOSALS_ONLY",
              "affects_fitness":False,
              "affects_selection":False,
              "automatic_physical_claims":False,
          }
          warp.write_text(json.dumps(r,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY

      - name: Assert isolation and scientific boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open("data/arena/warp-propulsion/latest.json",encoding="utf-8"))
          b=r.get("boundary") or {}
          expected={
              "production_state_write":False,
              "production_runtime_influence":"NONE",
              "automatic_physical_claims":False,
              "automatic_engineering_promotion":False,
              "promotion":"HUMAN_SCIENTIFIC_REVIEW_ONLY",
          }
          for k,v in expected.items():
              if b.get(k)!=v:
                  raise SystemExit(f"boundary failure: {k}={b.get(k)!r}")
          if r.get("mode")!="THEORETICAL_SHADOW":
              raise SystemExit("wrong arena mode")
          p=r.get("physical_evaluation") or {}
          if not p.get("reference_checks",{}).get("passed"):
              raise SystemExit("physical reference checks failed")
          if p.get("affects_fitness") is not False or p.get("affects_selection") is not False:
              raise SystemExit("reference diagnostics must remain observational")
          advisory=r.get("external_advisory") or {}
          if advisory.get("affects_fitness") is not False or advisory.get("affects_selection") is not False:
              raise SystemExit("external advisory must remain observational")
          if advisory.get("automatic_physical_claims") is not False:
              raise SystemExit("external advisory cannot establish physical claims")
          research=r.get("fixed_target_research") or {}
          if not research.get("tensor_benchmarks",{}).get("passed"):
              raise SystemExit("full tensor benchmarks failed")
          if research.get("physical_feasibility_established") is not False:
              raise SystemExit("unsupported feasibility claim")
          if research.get("affects_heuristic_selection") is not False:
              raise SystemExit("reference track must remain isolated")
          groups=research.get("groups") or []
          if sorted(g.get("target_beta") for g in groups)!=[0.8,1.1]:
              raise SystemExit("fixed velocity targets changed")
          for group in groups:
              for profile in group.get("profiles") or []:
                  if profile.get("radius_over_L0")!=1.0 or profile.get("target_beta")!=group["target_beta"]:
                      raise SystemExit("fixed comparison conditions changed")
          print(json.dumps({
              "generation":r.get("generation"),
              "population":r.get("population"),
              "best":r.get("best"),
              "hard_flagged":r.get("hard_flagged"),
          },indent=2))
          PY

      - name: Publish arena state
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "MYCELIX Warp Research Arena"
          git config user.email "actions@users.noreply.github.com"
          git add data/arena/warp-propulsion
          if git diff --cached --quiet; then
            echo "No warp arena changes"
            exit 0
          fi
          git commit -m "warp propulsion arena generation [skip render]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*3))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mycelix-warp-propulsion-${{ github.run_id }}
          path: data/arena/warp-propulsion/
          if-no-files-found: warn
          retention-days: 30
