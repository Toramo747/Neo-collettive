name: Free verifier smoke (anonymous, read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Anonymous calls from outside, then check the per-origin limit
        env:
          SMOKE_SECRET: ${{ secrets.NEO_HEARTBEAT_TOKEN }}
        run: |
          set +e
          # Signed smoke proof: same anonymous path and limits, never counted as demand.
          proof() { python3 -c "import os;from self_traffic_auth import make_self_traffic_proof as m;print(m(os.environ['SMOKE_SECRET'],'/mcp-smoke'))"; }
          U=https://neo-collettive.onrender.com/mcp
          H=(-H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream')
          call() { curl -s -m 60 -o /tmp/body -w '%{http_code}' "$U" "${H[@]}" -H "X-MYCELIX-Smoke-Proof: $(proof)" -d "$1"; }
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"free-verifier-smoke","version":"1"}}}'
          echo "::notice title=initialize::$(call "$init")"
          v='{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"verify_mcp_endpoint","arguments":{"url":"https://neo-collettive.onrender.com/mcp"}}}'
          first=$(call "$v")
          summary=$(python3 - <<'PY'
          import json, re
          raw = open("/tmp/body").read()
          m = re.search(r"^data: (.*)$", raw, re.M)
          d = json.loads(m.group(1) if m else raw)
          txt = json.dumps(d)
          res = d.get("result") or {}
          sc = res.get("structuredContent") or {}
          if not sc:
              for c in res.get("content") or []:
                  try: sc = json.loads(c.get("text") or "{}"); break
                  except Exception: pass
          print(f"is_error={res.get('isError')} live={sc.get('live')} status={sc.get('status')} checks={sorted((sc.get('checks') or {}).keys())[:8]} domains_listed={'\"domains\"' in txt} error={(d.get('error') or {}).get('message')}")
          PY
          )
          echo "::notice title=verify anonymous::http=$first $summary"
          g='{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"neo_web_search","arguments":{"query":"x"}}}'
          echo "::notice title=gated tool anonymous::http=$(call "$g")"
          codes=""
          for i in $(seq 2 11); do codes="$codes $(call "$v")"; done
          echo "::notice title=calls 2-11::$codes"
