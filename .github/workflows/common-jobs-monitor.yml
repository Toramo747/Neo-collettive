name: Common Job Board Monitor (private)
on:
  schedule:
    - cron: "37 */2 * * *"  # 23/10: every 2 h, so the mind and the witness watch read a fresh board
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: common-jobs-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.MODEL_LABEL_REPO }}
          token: ${{ secrets.MODEL_LABEL_REPO_TOKEN }}
          path: private-labels
      # Raw board rows and production counters go ONLY to the private archive.
      # The log prints aggregate counts.
      - name: Snapshot board and production counters
        env:
          ADMIN_TOKEN: ${{ secrets.NEO_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/status.json"
          curl --fail --silent --max-time 60 -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H "X-MYCELIX-Self-Traffic: github-actions-heartbeat" \
            "https://neo-collettive.onrender.com/api/autopilot/status" -o "$status_file" || echo '{}' > "$status_file"
          python tools/common_jobs_monitor.py private-labels "$status_file"
          rm -f "$status_file"
          git -C private-labels config user.name "NEO Ops Bot"
          git -C private-labels config user.email "actions@users.noreply.github.com"
          git -C private-labels add common
          git -C private-labels commit --quiet -m "ops: Common job board snapshot" || exit 0
          git -C private-labels pull --quiet --rebase
          git -C private-labels push --quiet
