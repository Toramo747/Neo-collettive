name: Verify quote conformance v1 (pinned, signed)
on:
  workflow_dispatch:
  # Permit verification before this new manual workflow exists on main.
  push:
    branches: [docs/verify-quote-conformance-v1]
    paths:
      - "docs/conformance/**"
      - "tools/verify_quote_conformance.py"
      - ".github/workflows/verify-quote-conformance.yml"
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked verification dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Pinned offline vector and at most six signed live checks
        env:
          SMOKE_SECRET: ${{ secrets.NEO_HEARTBEAT_TOKEN }}
        run: python tools/verify_quote_conformance.py --live
