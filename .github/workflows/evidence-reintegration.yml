name: Evidence Reintegration (admin)
on:
  push:
    branches:
      - ops/evidence-reintegration-runner
    paths:
      - ops/evidence-reintegration.txt
  workflow_dispatch:
    inputs:
      mode:
        description: "status | plan | apply | revert"
        required: true
        default: status
      arg:
        description: "plan_id (apply) or batch (revert)"
        required: false
permissions:
  contents: read
concurrency:
  group: evidence-reintegration
  cancel-in-progress: false
jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Call admin endpoint (counts only)
        env:
          NEO_ADMIN_TOKEN: ${{ secrets.NEO_ADMIN_TOKEN }}
          MODE: ${{ inputs.mode }}
          ARG: ${{ inputs.arg }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # One command per line: status | plan | apply <plan_id> | revert <batch>
            while read -r line; do
              [ -z "$line" ] && continue
              python tools/evidence_reintegration_call.py $line
            done < ops/evidence-reintegration.txt
          else
            python tools/evidence_reintegration_call.py "$MODE" $ARG
          fi
