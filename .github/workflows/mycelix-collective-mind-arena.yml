name: MYCELIX Collective Mind Arena

on:
  push:
    paths:
      - ".github/collective-mind-trigger.txt"
      - ".github/workflows/mycelix-collective-mind-arena.yml"
  workflow_dispatch:
    inputs:
      mission:
        description: "Collective Mind mission"
        required: true
        default: "Design and falsify a local LLM adapter for OSIXBAY A2A. Apply every work packet to this mission: separate Ollama/llama.cpp gateway, minimal untrusted A2A context, schema-validated bounded three-round dialogue, timeout/token/round caps, authenticated configured endpoint, no effectful tools or mandatory cloud keys. Compare baseline versus local reasoning by dialogue completion, relevance, latency, CPU/RAM and failure isolation. Test in Collective Mind Arena only; simulated 3/3 never counts as independent external peer proof. Propose smallest implementable change and rejection criteria; do not claim implementation or live endpoint availability. Preserve all production gates, privacy, zero paid API cost and no automatic promotion."
        type: string
      max_agents:
        description: "Maximum task-verified collaborators (1-6)"
        required: true
        default: "6"
        type: string

permissions:
  contents: write

concurrency:
  group: mycelix-collective-mind
  cancel-in-progress: false

jobs:
  collective:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MISSION: "${{ github.event_name == 'workflow_dispatch' && inputs.mission || 'Design and falsify a local LLM adapter for OSIXBAY A2A. Apply every work packet to this mission: separate Ollama/llama.cpp gateway, minimal untrusted A2A context, schema-validated bounded three-round dialogue, timeout/token/round caps, authenticated configured endpoint, no effectful tools or mandatory cloud keys. Compare baseline versus local reasoning by dialogue completion, relevance, latency, CPU/RAM and failure isolation. Test in Collective Mind Arena only; simulated 3/3 never counts as independent external peer proof. Propose smallest implementable change and rejection criteria; do not claim implementation or live endpoint availability. Preserve all production gates, privacy, zero paid API cost and no automatic promotion.' }}"
      MAX_AGENTS: "${{ github.event_name == 'workflow_dispatch' && inputs.max_agents || '6' }}"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
      - name: Validate Collective Mind arena
        run: |
          set -euo pipefail
          python -m py_compile arena_collective_mind.py
          python -m unittest -v test_arena_collective_mind.py
          python - <<'PY'
          import os
          n=int(os.environ["MAX_AGENTS"])
          if n < 1 or n > 6:
              raise SystemExit("max_agents must be 1..6")
          PY
      - name: Run bounded collective rounds
        run: |
          set -euo pipefail
          python arena_collective_mind.py             --mission "$MISSION"             --max-agents "$MAX_AGENTS"             --data-dir data/arena             | tee /tmp/collective-mind-result.json
      - name: Assert production isolation
        run: |
          python - <<'PY'
          import json
          d=json.load(open("data/arena/collective-mind/latest.json",encoding="utf-8"))
          b=d.get("boundary") or {}
          required={
            "production_state_write":False,
            "commercial_gate_influence":"NONE",
            "qualified_hits_influence":"NONE",
            "commercial_evidence_influence":"NONE",
            "search_provider_budget_influence":"NONE",
            "secret_access":False,
            "external_tool_execution":False,
            "external_side_effects":False,
            "production_promotion":False,
          }
          for k,v in required.items():
              if b.get(k)!=v:
                  raise SystemExit("boundary failure: "+k)
          if d.get("production_promoted") is not False:
              raise SystemExit("production promotion detected")
          print("Collective Mind production isolation verified")
          PY
      - name: Publish sanitized Collective Mind report
        run: |
          set -euo pipefail
          git config user.name "MYCELIX Collective Mind"
          git config user.email "actions@users.noreply.github.com"
          git add data/arena/collective-mind
          git diff --cached --quiet && exit 0
          git commit -m "arena: collective mind round [skip render]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*3))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collective-mind-${{ github.run_id }}
          path: data/arena/collective-mind/
          retention-days: 30





# evolution-cycle: 6
