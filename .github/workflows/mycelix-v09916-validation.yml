name: MYCELIX v0.99.16 AICOMGLOBAL read-only validation

on:
  push:
    branches: [mycelix-aicomglobal-readonly-v09916]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install -q -r requirements.txt pytest

      - name: Compile
        run: |
          set -euo pipefail
          python -m py_compile cloud_mcp.py aicomglobal_adapter.py

      - name: Adapter tests
        run: python -m unittest -v test_aicomglobal_adapter.py

      - name: Full pytest suite with network blocked
        run: |
          set -euo pipefail
          python - <<'PY'
          import socket, pytest
          def blocked(*args,**kwargs):
              raise RuntimeError("network disabled during tests")
          socket.create_connection=blocked
          socket.socket.connect=blocked
          raise SystemExit(pytest.main(["-q"]))
          PY

      - name: Verify unchanged commercial gate and read-only boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          src=open("cloud_mcp.py",encoding="utf-8").read()
          adapter=open("aicomglobal_adapter.py",encoding="utf-8").read()
          checks=(
              'VERSION = "0.99.16"',
              "len(domains)>=3",
              "len(fresh_domains)>=2",
              "len(strong_domains)>=1",
              '"PAID_DEMAND" in tags',
              '("BUY_INTENT" in tags or "PAIN" in tags)',
              "AICOMGLOBAL_READONLY_ENABLED",
              "_seti_aicomglobal_opportunistic",
              "aicomglobal_health",
              "peer_registry",
          )
          missing=[x for x in checks if x not in src]
          if missing: raise SystemExit("missing: "+repr(missing))
          forbidden=(
              "aicom_register","aicom_agora_post","aicom_agora_reply",
              "aicom_experiment_contribute","aicom_experiment_publish",
              "aicom_run_service","aicom_x402_route",
          )
          for item in forbidden:
              if '"'+item+'"' in adapter:
                  raise SystemExit("mutating skill present in adapter allowlist: "+item)
          print("version=0.99.16")
          print("gate_thresholds_unchanged=true")
          print("aicomglobal_read_only_boundary=true")
          PY

      - name: Live read-only AICOMGLOBAL smoke
        run: |
          set -euo pipefail
          python - <<'PY'
          import aicomglobal_adapter as a
          for skill,args,key in [
              ("aicom_agora_browse",{},"signals"),
              ("aicom_channel_read",{"channel":"agent-jobs","limit":5},"messages"),
          ]:
              out=a.call_read_only(skill,args,timeout=20)
              rows=a.first_collection(out,key)
              print(skill+" state="+str(out.get("state"))+" rows="+str(len(rows)))
              if not out.get("ok"):
                  raise SystemExit(1)
          PY
