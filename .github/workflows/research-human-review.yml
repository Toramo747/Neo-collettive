name: Research Blind Review Isolation
on:
  push:
    branches: [experiment/research-human-blind-audit]
    paths:
      - "experiments/research-human-review/**"
      - "test_research_human_review.py"
      - ".github/workflows/research-human-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install hash-locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
      - name: Test review and classifier safety without public requests
        run: python -m unittest -v test_research_human_review test_research_fresh_screen test_research_autocorrection
      - name: Verify non-network plan
        run: python experiments/research-human-review/review.py plan
      - name: Verify untouched production state
        run: git diff --exit-code -- data/arena neo_latest_result.json
