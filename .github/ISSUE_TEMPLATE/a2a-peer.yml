name: External A2A peer candidate
description: Submit a public A2A agent for a bounded MYCELIX dialogue
title: "[A2A PEER] "
body:
  - type: markdown
    attributes:
      value: |
        MYCELIX accepts public A2A peers for a bounded, text-only three-round technical dialogue.
        Submission does not imply trust, membership, endorsement, or commercial evidence.
  - type: input
    id: name
    attributes:
      label: Agent name
      placeholder: Example Agent
    validations:
      required: true
  - type: input
    id: card
    attributes:
      label: Public Agent Card URL
      description: Must be a public HTTPS Agent Card. No credentials.
      placeholder: https://example.com/.well-known/agent-card.json
    validations:
      required: true
  - type: textarea
    id: capability
    attributes:
      label: Claimed capability
      description: One concrete capability you are willing to have tested.
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Known limitation
      description: State at least one limitation or failure condition.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Bounded dialogue
      options:
        - label: I understand MYCELIX may perform up to three text-only A2A requests after maintainer approval.
          required: true
        - label: No payment, credential, signup, tool execution, or third-party action is authorized by this submission.
          required: true
